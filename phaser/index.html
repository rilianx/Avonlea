<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prueba de Phaser</title>
<style>
  :root { --papel: #f6efe0; --tinta: #3b2a1e; --borde: #c9a97a; --fondo: #e9dcc0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --papel: #2c241c; --tinta: #f1e6d2; --borde: #6b5236; --fondo: #1b1612; } }
  :root[data-theme="dark"] { --papel: #2c241c; --tinta: #f1e6d2; --borde: #6b5236; --fondo: #1b1612; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta); font: 15px/1.35 Georgia, 'Times New Roman', serif; overflow: hidden; }
  #juego { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #juego canvas { touch-action: none; }
  #barra { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  #barra button { font: inherit; color: var(--tinta); background: var(--papel); border: 1.5px solid var(--borde); border-radius: 999px; padding: 8px 16px; cursor: pointer; box-shadow: 0 2px 6px rgba(40,25,10,.18); }
  #barra button:disabled { opacity: .5; cursor: default; }
  #nota { position: fixed; top: 10px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; font-size: 13px; }
  #nota span { background: var(--papel); border: 1px solid var(--borde); border-radius: 8px; padding: 4px 10px; }
</style>
</head>
<body>
<div id="juego"></div>
<div id="nota"><span>Prueba de Phaser · la cocina de Tejas Verdes</span><span id="fps">— fps</span></div>
<div id="barra"><button id="mesa">Poner la mesa</button><button id="otra">Quitar los platos</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
/* A trial: the kitchen of Green Gables in Phaser. The room comes from the Tiled map (src/mapas/cocina.tmj), the drawings
   are the game's own, baked into images by tools/hojas_phaser.js (phaser/hojas/). Ana walks where you touch (or with the
   arrows) in 8 directions, and «Poner la mesa» does what the game does: to the dresser, the plates, to the table, three
   places laid one by one. Everything is in units of the room (13 × 9 tiles of 32); the camera fits it to the screen. */
const VEL = 50, PASO = 9;   // (her pace, as in the game; steps per second of the walking cycle)
const DPR = Math.min(3, window.devicePixelRatio || 1);   // (Phaser draws at CSS size: the canvas is made DPR times bigger and shown at 1/DPR, sharp on a phone)
let H, M;                   // (the sheets' description; the map's points)

class Cocina extends Phaser.Scene {
  preload(){
    this.load.json('hojas', 'hojas/hojas.json');
    this.load.json('mapa', '../src/mapas/cocina.tmj');
    for (const k of ['cocina', 'mesa', 'aparador', 'fregadero', 'silla', 'pila', 'plato']) this.load.image(k, `hojas/${k}.png`);
    this.load.once('filecomplete-json-hojas', (k, t, d) => { const f = d.frame; this.load.spritesheet('ana', 'hojas/ana.png', { frameWidth: f.w * d.R, frameHeight: f.h * d.R }); });
  }
  create(){
    H = this.cache.json.get('hojas');
    const pts = Object.fromEntries(this.cache.json.get('mapa').layers.flatMap(l => l.objects || []).map(o => [o.name, { x: o.x, y: o.y }]));
    const mesa = pts.mesa, apar = pts.aparador;
    M = { aparador: [apar.x + 46, apar.y + 6], mesa: [mesa.x - 20, mesa.y + 18], lugares: [0, 1, 2].map(k => [mesa.x - 30 + k * 30, mesa.y - 28]), puerta: [pts.puerta.x, pts.puerta.y - 14], fregadero: [pts.fregadero.x, pts.fregadero.y + 34] };
    const s = 1 / H.R, F = H.frame;
    this.add.image(0, 0, 'cocina').setOrigin(0).setScale(s).setDepth(-1e6);
    for (const [k, y] of Object.entries(H.orden)) this.add.image(0, 0, k).setOrigin(0).setScale(s).setDepth(y);
    // Ana: a row of the sheet per direction (0 up … 4 down …), standing, 8 steps, bending down
    for (let q = 0; q < 8; q++) this.anims.create({ key: 'andar' + q, frames: this.anims.generateFrameNumbers('ana', { start: q * F.cols + 1, end: q * F.cols + 8 }), frameRate: PASO, repeat: -1 });
    this.ana = this.add.sprite(M.puerta[0], M.puerta[1] - 30, 'ana', 4 * F.cols).setOrigin(F.x / F.w, F.y / F.h).setScale(s);
    this.q = 4; this.meta = null; this.tarea = null; this.platos = [];
    this.pila = this.add.image(0, 0, 'pila').setScale(s).setVisible(false);
    this.globo = this.add.text(0, 0, '', { fontFamily: 'Georgia, serif', fontSize: '22px', color: '#3b2a1e', backgroundColor: '#fffaf0', padding: { x: 10, y: 6 } }).setOrigin(.5, 1).setScale(s * 1.5).setDepth(1e6).setVisible(false);
    // the camera fits the room to the screen, whatever its size
    // (on a phone held upright the whole room would be a strip: there the camera comes closer and follows Ana)
    const ajustar = () => { const cam = this.cameras.main, W = this.scale.width, Hh = this.scale.height - 60 * DPR, z = Math.min(W / H.sala.w, Hh / H.sala.h);
      if (Hh > W * 1.2) { const zz = Math.min(z * 1.8, Hh * .62 / H.sala.h), alto = Math.round(H.sala.h * zz); cam.setViewport(0, Math.round((this.scale.height - alto) / 2), W, alto).setZoom(zz).setBounds(0, 0, H.sala.w, H.sala.h).startFollow(this.ana, true, .12, .12); }
      else { cam.stopFollow(); cam.removeBounds(); cam.setViewport(0, 0, this.scale.width, this.scale.height).setZoom(z); cam.centerOn(H.sala.w / 2, H.sala.h / 2 + 30 * DPR / z); } };
    ajustar(); this.scale.on('resize', ajustar); window.__cocina = this;   // (for the tests)
    addEventListener('resize', () => this.scale.resize(innerWidth * DPR, innerHeight * DPR));
    // touching: she goes there at once (if she was doing a chore, she leaves it, as in the game); holding the finger
    // down she follows it; a little ring marks where she is going
    this.marca = this.add.ellipse(0, 0, 14, 6).setStrokeStyle(1.2, 0x8a5e3c, .9).setDepth(-1e5).setVisible(false);
    const tocar = p => { const w = this.cameras.main.getWorldPoint(p.x, p.y); if (this.tarea) this.dejar(true); this.ir(w.x, w.y); this.marca.setPosition(this.meta.x, this.meta.y).setVisible(true).setAlpha(1).setScale(1); };
    // (only touches on the room itself: Phaser also hears the ones on the buttons, and those would cancel the chore just begun)
    const enSala = p => p.event?.target === this.game.canvas;
    this.input.on('pointerdown', p => { if (!enSala(p)) return; this.arrastre = true; tocar(p); this.tweens.add({ targets: this.marca, scale: 1.6, alpha: .25, duration: 380 }); });
    this.input.on('pointermove', p => { if (p.isDown && this.arrastre) tocar(p); });
    this.input.on('pointerup', () => { this.arrastre = false; });
    for (const ev of ['touchstart', 'touchend', 'mousedown', 'mouseup', 'pointerdown']) document.getElementById('barra').addEventListener(ev, e => e.stopPropagation());
    this.teclas = this.input.keyboard.createCursorKeys();
    document.getElementById('mesa').onclick = () => this.ponerMesa();
    document.getElementById('otra').onclick = () => this.quitarMesa();
  }
  dentro(x, y){ return [Phaser.Math.Clamp(x, 14, H.sala.w - 14), Phaser.Math.Clamp(y, H.sala.piso + 16, H.sala.h - 8)]; }
  ir(x, y, luego){ const [tx, ty] = this.dentro(x, y); this.meta = { x: tx, y: ty, luego }; }
  mirar(q, f = 0){ this.q = q; this.ana.anims.stop(); this.ana.setFrame(q * H.frame.cols + f); }
  decir(t, seg = 2.6){ this.globo.setText(t).setVisible(!!t); this.globoHasta = this.time.now + seg * 1000; }
  // «poner la mesa», as the game does it (ACC_PASOS 'quehacer:mesa'): the dresser, then the table, a place every 1.1 s
  ponerMesa(){
    if (this.tarea) return; for (const p of this.platos) p.destroy(); this.platos = [];
    const { luego, fin } = this.empezar('mesa', 'Poniendo la mesa…');
    this.ir(...M.aparador, () => {
      this.mirar(6, 9); this.decir('Los platos de todos los días…');
      luego(2500, () => {
        this.pila.setVisible(true);
        this.ir(...M.mesa, () => {
          this.mirar(0);
          M.lugares.forEach(([x, y], k) => luego(k * 1100, () => {
            const p = this.add.image(x, y, 'plato').setScale(0).setDepth(H.orden.mesa + 1).setOrigin(9 / 24, .5); this.platos.push(p);
            this.tweens.add({ targets: p, scale: 1 / H.R, duration: 260, ease: 'Back.Out' });
            if (k === 2) this.pila.setVisible(false);
          }));
          luego(3500, () => fin('¡Lista! La mesa puesta para tres.'));
        });
      });
    });
  }
  // she leaves the chore half done (the plates go back to the dresser)
  // a chore: both buttons wait while it goes on; each step runs only while this same chore goes on
  empezar(id, texto){
    const botones = [...document.querySelectorAll('#barra button')], boton = document.getElementById(id), T = { boton, botones, nombre: boton.textContent, timers: [] };
    for (const b of botones) b.disabled = true; boton.textContent = texto; this.tarea = T;
    return { luego: (ms, f) => T.timers.push(this.time.delayedCall(ms, () => { if (this.tarea === T) f(); })),
      fin: dice => { if (this.tarea !== T) return; this.tarea = null; for (const b of botones) b.disabled = false; boton.textContent = T.nombre; this.decir(dice); } };
  }
  // «quitar los platos», as the game does it ('quehacer:platos'): picks them up one by one, washes them at the sink,
  // and puts them back in the dresser
  quitarMesa(){
    if (this.tarea) return;
    if (!this.platos.length) { this.decir('No hay platos en la mesa.'); return; }
    const { luego, fin } = this.empezar('otra', 'Quitando los platos…');
    this.ir(...M.mesa, () => {
      this.mirar(0);
      [...this.platos].reverse().forEach((p, k) => luego(k * 700, () => {
        this.tweens.add({ targets: p, x: this.ana.x, y: this.ana.y - 24, scale: .6 / H.R, alpha: 0, duration: 380, ease: 'Quad.In', onComplete: () => { p.destroy(); this.platos = this.platos.filter(q => q !== p); } });
        this.pila.setVisible(true);
      }));
      luego(2400, () => this.ir(...M.fregadero, () => {
        this.mirar(0); this.decir('A lavar la loza…', 3);
        const agua = this.add.particles(M.fregadero[0], M.fregadero[1] - 62, 'plato', { speed: { min: 8, max: 22 }, angle: { min: 220, max: 320 }, gravityY: 60, lifespan: 600, scale: { start: .12, end: 0 }, tint: 0x9fc8e6, alpha: { start: .9, end: 0 }, frequency: 90 }).setDepth(H.orden.fregadero + 1);
        const vaiven = this.tweens.add({ targets: this.pila, angle: { from: -8, to: 8 }, duration: 260, yoyo: true, repeat: -1 });
        luego(4000, () => { agua.destroy(); vaiven.stop(); this.pila.setAngle(0);
          this.ir(...M.aparador, () => { this.mirar(6, 9); luego(1600, () => { this.pila.setVisible(false); this.mirar(6); fin('Todo limpio y guardado.'); }); }); });
        this.agua = agua;
      }));
    });
  }
  dejar(dice){ const T = this.tarea; if (!T) return; for (const e of T.timers) e.remove(false); this.tarea = null; for (const b of T.botones) b.disabled = false; T.boton.textContent = T.nombre; this.agua?.destroy(); this.pila.setAngle(0); this.tweens.killTweensOf(this.pila); if (dice) this.decir('Bueno… la mesa, después.'); this.meta = null; this.pila.setVisible(false); this.ana.setFrame(this.q * H.frame.cols); }
  update(t, dms){
    const dt = Math.min(dms, 100) / 1000, a = this.ana, k = this.teclas;
    let vx = 0, vy = 0;
    vx = (k.right.isDown ? 1 : 0) - (k.left.isDown ? 1 : 0); vy = (k.down.isDown ? 1 : 0) - (k.up.isDown ? 1 : 0);
    if (vx || vy) { if (this.tarea) this.dejar(true); this.meta = null; this.marca.setVisible(false); }
    if (this.meta) { const dx = this.meta.x - a.x, dy = this.meta.y - a.y, d = Math.hypot(dx, dy);
      if (d < 1.5) { const f = this.meta.luego; this.meta = null; this.marca.setVisible(false); a.setPosition(a.x + dx, a.y + dy); if (f) f(); } else { vx = dx / d; vy = dy / d; } }
    if (vx || vy) {
      const n = Math.hypot(vx, vy), step = Math.min(VEL * dt, this.meta ? Math.hypot(this.meta.x - a.x, this.meta.y - a.y) : 1e9);
      const [nx, ny] = this.dentro(a.x + vx / n * step, a.y + vy / n * step); a.setPosition(nx, ny);
      const q = ((Math.round(Math.atan2(vy, vx) / (Math.PI / 4)) + 2) % 8 + 8) % 8;
      if (q !== this.q || !a.anims.isPlaying) { this.q = q; a.play('andar' + q, true); }
    } else if (a.anims.isPlaying) this.mirar(this.q);
    a.setDepth(a.y);
    this.pila.setPosition(a.x + (this.q === 6 ? -6 : this.q === 2 ? 6 : 0), a.y - 24).setDepth(a.y + ([7, 0, 1].includes(this.q) ? -.5 : .5));   // (with her back to us, the plates are in front of her: hidden)
    this.globo.setPosition(a.x, a.y - 66); if (this.globo.visible && t > this.globoHasta) this.globo.setVisible(false);
    if (!this.fpsT || t > this.fpsT) { this.fpsT = t + 500; document.getElementById('fps').textContent = Math.round(this.game.loop.actualFps) + ' fps'; }
  }
}

new Phaser.Game({ type: Phaser.AUTO, parent: 'juego', backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--fondo').trim() || '#e9dcc0',
  scale: { mode: Phaser.Scale.NONE, width: innerWidth * DPR, height: innerHeight * DPR, zoom: 1 / DPR }, render: { antialias: true }, scene: Cocina });
</script>
</body>
</html>
