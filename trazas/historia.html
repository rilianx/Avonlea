arra: siempre hay algo que decir.","disparo":"objeto","objeto":"pizarra","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"pupitre_1","origen":"guion","si":["hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(En el pupitre, alguien dejó una manzana roja y un papelito: «Para Ana, de tu D.».)"},{"q":"ana","t":"Diana. Esta manzana es demasiado linda para comérsela. Me la voy a comer igual, pero despacio."}],"resumen":"En el pupitre, una manzana y un papelito de Diana.","disparo":"objeto","objeto":"pupitre","paso":"1","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"pupitre_2","origen":"guion","si":["hecho:zanahorias"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se sienta muy derecha, sin mirar hacia el pupitre de Gilbert Blythe.)"},{"q":"ana","t":"No voy a mirar. No voy a mirar.","piensa":true},{"q":"ana","t":"(No mira. Bueno, una vez. De reojo. Para ver si él está mirando. No está mirando.)"}],"resumen":"En su pupitre, Ana no mira hacia Gilbert.","disparo":"objeto","objeto":"pupitre","paso":"2","canal":"ana_sola","tambien":true,"prioridad":"2","tipo":"escena"},{"id":"pupitre_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Mi pupitre. Tiene una muesca con forma de luna. Seguro que alguien, hace años, también se aburría con la geografía.","piensa":true}],"resumen":"Lo de todos los días con pupitre: siempre hay algo que decir.","disparo":"objeto","objeto":"pupitre","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"escenario_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana sube al escenario. El salón vacío parece enorme desde arriba.) Si algún día recito aquí, me van a temblar las rodillas. Pero la voz no. La voz, nunca."}],"disparo":"objeto","objeto":"escenario","paso":"1","tambien":true,"canal":"ana_sola","tipo":"escena"},{"id":"escenario_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana mira las bancas vacías desde el escenario.) Un día voy a recitar aquí sin que me tiemble ni la voz ni las rodillas.","piensa":true}],"resumen":"Lo de todos los días con escenario: siempre hay algo que decir.","disparo":"objeto","objeto":"escenario","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"banco_iglesia_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Por la ventana de la iglesia se ve una rama de abedul que se mueve con el viento.)"},{"q":"ana","t":"Rezar sentada en un banco entre tanta gente es difícil. Yo rezo mejor en el bosque, donde Dios está más a la vista."}],"disparo":"objeto","objeto":"banco","paso":"1","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"banco_iglesia_2","origen":"guion","si":["hecho:allan_invitados"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(La Sra. Allan le sonríe desde el primer banco.)"},{"q":"ana","t":"Cuando la Sra. Allan sonríe, dan ganas de ser buena. No buena de esas aburridas: buena de verdad, de las que se notan por dentro."}],"resumen":"En la iglesia, la Sra. Allan le sonríe.","disparo":"objeto","objeto":"banco","paso":"2","canal":"ana_sola","tambien":true,"prioridad":"2","tipo":"escena"},{"id":"banco_iglesia_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se sienta derecha, como Marilla.) En la iglesia hasta los pensamientos tienen que estar bien peinados.","piensa":true}],"resumen":"Lo de todos los días con banco iglesia: siempre hay algo que decir.","disparo":"objeto","objeto":"banco","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"frascos_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana pega la nariz al vidrio de los frascos de caramelos.) Menta, limón, rosa… Si fuera rica, no me los comería: los pondría en la ventana para que les diera el sol."}],"disparo":"objeto","objeto":"frascos","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"frascos_2","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Los frascos de caramelos brillan en el mostrador: de menta, de canela, de limón.)"},{"q":"ana","t":"Si yo tuviera un centavo, compraría uno de cada color y los pondría en la ventana de mi pieza, para que el sol los atraviese como vitrales."}],"disparo":"objeto","objeto":"frascos","paso":"2","canal":"ana_sola","tipo":"escena"},{"id":"frascos_3","origen":"guion","si":["afecto:matthew:ana>=5"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se acuerda de que Matthew vino una vez a comprar azúcar morena y rastrillos, y salió con veinte libras de azúcar, todo colorado.)"},{"q":"ana","t":"Pobre Matthew: a la tienda le tiene más miedo que a un toro. Y todo para comprarme algo bonito. Es el hombre más bueno del mundo."}],"disparo":"objeto","objeto":"frascos","paso":"3","canal":"ana_sola","prioridad":"2","tipo":"escena"},{"id":"frascos_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Los caramelos brillan en sus frascos.) Rosa, limón, menta. Si los nombro, ya es casi como haberlos probado.","piensa":true}],"resumen":"Lo de todos los días con frascos: siempre hay algo que decir.","disparo":"objeto","objeto":"frascos","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"ginger_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El loro la mira de reojo, con la cabeza ladeada.) Buenos días, Ginger. ¿Tú también tienes mal genio? Entonces somos espíritus afines… creo."}],"disparo":"objeto","objeto":"cage","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"ginger_2","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ginger, el loro del Sr. Harrison, la mira de lado con un ojo amarillo.)"},{"q":"ana","t":"Buenas tardes, Ginger. Ya sé que dices cosas feas, pero yo creo que en el fondo eres un loro sensible. Te pasa lo mismo que a mí con el genio."}],"disparo":"objeto","objeto":"cage","paso":"2","canal":"ana_sola","tipo":"escena"},{"id":"ginger_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Buenos días, Ginger. ¿Ya me perdonaste por lo de ayer? (El loro la mira y no dice nada, que ya es bastante para Ginger.)"}],"resumen":"Lo de todos los días con ginger: siempre hay algo que decir.","disparo":"objeto","objeto":"cage","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"libros_1","origen":"guion","si":["letras:ana>=10"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Entre los sermones hay un libro de poemas de Tennyson, con las tapas gastadas.)"},{"q":"ana","t":"«La dama de Shalott»… En la escuela nos la van a hacer recitar. Yo ya me la sé casi entera, de tanto imaginarla."}],"disparo":"objeto","objeto":"libros","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"libros_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Cuántos libros. Si los leyera todos, ¿se me notaría en la cara?","piensa":true}],"resumen":"Lo de todos los días con libros: siempre hay algo que decir.","disparo":"objeto","objeto":"libros","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"faro_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana mira el mar, que no se acaba nunca, y las olas que rompen contra la arena roja.)"},{"q":"ana","t":"Cuando llegué en el tren pensé que había visto todo lo hermoso del mundo. Y ahora esto. Hay demasiadas cosas lindas para una sola r. Hoy tiene cara de estar pensando."}],"resumen":"Lo de todos los días con faro: siempre hay algo que decir.","disparo":"objeto","objeto":"faro","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"banco_lago_1","origen":"guion","si":["estacion:primavera"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Las ranas cantan en la orilla. En el agua flotan pétalos de cerezo.)"},{"q":"ana","t":"Las ranas tienen un coro. Seguro que ensayan todo el invierno, bajo el barro, para estrenar en primavera."}],"disparo":"objeto","objeto":"bench","paso":"1","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"banco_lago_2","origen":"guion","si":["hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(En el agua se ven reflejados los manzanos del huerto de los Barry.)"},{"q":"ana","t":"El huerto de Diana se mira en el lago como en un espejo. Si Diana estuviera aquí, nos reflejaríamos las dos: dos amigas del alma, cabeza abajo."}],"resumen":"En el banco del lago, pensando en Diana.","disparo":"objeto","objeto":"bench","paso":"2","canal":"ana_sola","tambien":true,"prioridad":"2","tipo":"escena"},{"id":"banco_lago_3","origen":"guion","si":["hora:17-21","!estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El sol se pone y el Lago de las Aguas Brillantes se vuelve de oro, de rosa, de violeta.)"},{"q":"ana","t":"Por eso le puse ese nombre. A esta hora, si una tira una piedrita, seguro que se convierte en un diamante."}],"disparo":"objeto","objeto":"bench","paso":"3","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"banco_lago_4","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El lago está helado. Unos niños patinan a lo lejos, con bufandas de colores.)"},{"q":"ana","t":"El Lago de las Aguas Brillantes duerme bajo el hielo. Pero sigue brillando: no se le quita la costumbre."}],"disparo":"objeto","objeto":"bench","paso":"4","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"banco_lago_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El lago se mueve apenas, como si respirara.) Aquí cualquier pensamiento se vuelve largo y tranquilo.","piensa":true}],"resumen":"Lo de todos los días con banco lago: siempre hay algo que decir.","disparo":"objeto","objeto":"bench","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"camino_blanco_1","origen":"guion","si":["estacion:primavera"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Los manzanos forman un túnel de flores sobre el camino. Los pétalos caen despacio, como nieve tibia.)"},{"q":"ana","t":"Cada vez que paso me dan ganas de hablar en voz baja, como en una iglesia. Debe ser porque aquí algo muy grande está pasando, en silencio."}],"disparo":"lugar","lugar":"camino_blanco","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"camino_blanco_2","origen":"guion","si":["estacion:primavera","hecho:se_queda"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"narra","t":"Los manzanos del Camino Blanco florecieron todos juntos, en una sola noche."},{"q":"ana","t":"(Ana se detiene en seco. Sobre ella, la bóveda de flores es tan blanca que parece hecha de luz. Ya no se acuerda de adónde iba.)"},{"q":"ana","t":"(No dice nada. Por una vez, Ana Shirley no dice nada.)"},{"q":"ana","t":"…Es como la primera vez. No: es mejor que la primera vez, porque ahora es mío. Ahora vuelvo a casa por aquí.","piensa":true}],"resumen":"Los manzanos del Camino Blanco en flor.","disparo":"lugar","lugar":"camino_blanco","paso":"2","canal":"ana_sola","prioridad":"6","interrumpe":true,"tipo":"escena"},{"id":"camino_blanco_3","origen":"guion","si":["estacion:otoño"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ya no hay flores. Las hojas de los manzanos se pusieron amarillas y crujen bajo los pies.)"},{"q":"ana","t":"Ahora es el Camino Dorado de las Delicias. Le voy a dar un nombre para cada estación. Así nunca se aburre de sí mismo."}],"disparo":"lugar","lugar":"camino_blanco","paso":"3","canal":"ana_sola","tipo":"escena"},{"id":"camino_blanco_4","origen":"guion","si":["estacion:invierno","hecho:se_queda"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Empiezan a caer los primeros copos, grandes y lentos, sobre las ramas desnudas del Camino Blanco.)"},{"q":"ana","t":"(Ana levanta la cara y saca la lengua para atrapar uno.)"},{"q":"ana","t":"¡La primera nieve! El Camino Blanco se acordó de su nombre. Cada copo es distinto, dicen en la escuela. Como las personas. Como las amigas del alma."}],"resumen":"La primera nieve sobre el Camino Blanco.","disparo":"lugar","lugar":"camino_blanco","paso":"4","canal":"ana_sola","prioridad":"6","interrumpe":true,"tipo":"escena"},{"id":"camino_blanco_5","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Las ramas desnudas están cargadas de nieve. El túnel vuelve a ser blanco, pero de otra manera.)"},{"q":"ana","t":"Ves, te dije que eras el Camino Blanco. Hasta en invierno cumples tu nombre. Eso se llama tener carácter."}],"disparo":"lugar","lugar":"camino_blanco","paso":"5","canal":"ana_sola","tipo":"escena"},{"id":"camino_blanco_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"El Camino Blanco de las Delicias. Cada vez que paso, le agradezco el nombre que le puse.","piensa":true}],"resumen":"Lo de todos los días con camino blanco: siempre hay algo que decir.","disparo":"lugar","lugar":"camino_blanco","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"playa_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El camino se abre de golpe y ahí está el mar, enorme, azul, brillando hasta donde se
