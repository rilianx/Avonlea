tró. | yo: di el examen de ingreso a Queen's, ¡y entré!"],"narra":["El examen de ingreso al Queen's, el colegio de Charlottetown donde se preparan los maestros, se da al comenzar el verano. Los mejores alumnos de toda la Isla compiten por entrar. Ana estudió meses con la Srta. Stacy, y Gilbert Blythe también."],"L":[{"q":"marilla","t":"Ana, hoy es el examen de Queen's. Matthew te lleva a Charlottetown. Toma, no se te olvide el almuerzo."},{"q":"ana","t":"(Ana pasa el día en Charlottetown, con la pluma temblándole en la mano. La geometría fue terrible… pero el resto, no tanto.)"},{"q":"ana","t":"(Semanas después, sale la lista en el diario.) ¡Marilla! ¡Entré a Queen's! No primera… pero entré."},{"q":"marilla","t":"Lo sabía. Aunque no te lo iba a decir, para que no te llenaras de humo."}],"resumen":"El examen del Queen's: Ana entra.","canal":"gg","prioridad":"8","interrumpe":true,"en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"examen_no","origen":"guion","si":["estacion:verano","dia_estacion:1","dia_juego:56","estudio:ana>=20","estudio:ana\u003c50","!hecho:queens","no_hoy:examen"],"o":[],"empieza":[],"termina":["hecho examen","triste ana","log Ana dio el examen de ingreso a Queen's en Charlottetown, pero no le alcanzó. El año que viene, otra vez. | yo: di el examen de ingreso a Queen's, pero no me alcanzó. El año que viene, otra vez."],"narra":["El examen de ingreso al Queen's, el colegio de Charlottetown donde se preparan los maestros, se da al comenzar el verano. Los mejores alumnos de toda la Isla compiten por entrar. Ana estudió meses con la Srta. Stacy, y Gilbert Blythe también."],"L":[{"q":"marilla","t":"Ana, hoy es el examen de Queen's. Matthew te lleva a Charlottetown. Toma, no se te olvide el almuerzo."},{"q":"ana","t":"(Ana pasa el día en Charlottetown. La geometría… la geometría fue un desastre.)"},{"q":"ana","t":"(Semanas después, sale la lista en el diario. Ana la lee tres veces.) No estoy, Marilla. No estoy."},{"q":"marilla","t":"Bueno. Hay otro examen el año que viene, y tú no eres de las que se rinden. A estudiar, entonces."}],"resumen":"El examen del Queen's: Ana no alcanza a entrar.","canal":"gg","prioridad":"8","interrumpe":true,"en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"inicio_llegada","origen":"guion","si":["hecho:inicio_juego","!hecho:llegada_tv"],"o":[],"empieza":["log Ana llegó a Tejas Verdes con Matthew, de noche. Marilla esperaba a un niño.","olvidar primer_viaje"],"termina":["hecho llegada_tv","hecho primera_noche","log Marilla dejó que Ana se quedara esa noche, hasta aclarar el enredo. Ana casi no probó la cena. | yo: Marilla me dejó quedarme esa noche, hasta aclarar el enredo. Casi no probé la cena."],"narra":["Avonlea, un pueblito de granjas en la Isla del Príncipe Eduardo, en Canadá, a fines del siglo XIX. En la granja de Tejas Verdes viven dos hermanos solterones, Matthew y Marilla Cuthbert. Ya están mayores, y le pidieron a la Sra. Spencer que les trajera del orfanato un niño, para ayudar en el campo.","Pero en la estación de Bright River, Matthew no encontró a ningún niño: lo esperaba una niña flaca, de pelo rojo, con un sombrero de paja y una maleta vieja. Matthew no se atrevió a dejarla allí. Ahora llegan juntos a Tejas Verdes, ya de noche, y Marilla los está esperando en la puerta de la cocina."],"L":[{"q":"marilla","t":"Matthew Cuthbert, ¿quién es ésa? ¿Dónde está el niño?"},{"q":"matthew","t":"No había ningún niño. Solo estaba ella."},{"q":"marilla","t":"¡Ningún niño! Pero tiene que haber habido un niño. Le mandamos decir a la señora Spencer que trajera un niño."},{"q":"matthew","t":"Bueno, pues, no lo trajo. La trajo a ella. Le pregunté al jefe de estación. Y tuve que traerla a casa. No se podía quedar allá, fuera cual fuera el error."},{"q":"marilla","t":"¡Vaya, qué lindo enredo!"},{"q":"ana","t":"¡No me quieren! ¡No me quieren porque no soy un niño! Debí haberlo esperado. Nadie me ha querido nunca."},{"q":"ana","t":"Debí saber que era demasiado hermoso para durar. Debí saber que nadie me quería de verdad. ¡Oh, qué voy a hacer! ¡Me voy a poner a llorar!"},{"ef":"sentar ana"},{"ef":"ana llora=true"},{"q":"ana","t":"(Ana se deja caer en una silla junto a la mesa, hunde la cara entre los brazos y llora a mares.)"},{"q":"matthew","t":"(Matthew y Marilla se miran por encima de la estufa, sin saber qué hacer.)"},{"q":"marilla","t":"Bueno, bueno, no hace falta llorar así."},{"q":"ana","t":"¡Sí que hace falta! Usted también lloraría si fuera huérfana y llegara a un lugar que creía que iba a ser su hogar, y se encontrara con que no la quieren porque no es un niño. ¡Oh, es lo más trágico que me ha pasado en la vida!"},{"q":"marilla","t":"(A Marilla se le escapa una sonrisa un poco oxidada, de tan poco usarla.) Bueno, no llores más. No te vamos a echar esta noche. Te quedas hasta que aclaremos este enredo. ¿Cómo te llamas?"},{"ef":"ana llora=false"},{"q":"ana","t":"(Ana levanta la cara, toda mojada de lágrimas.)"},{"ops":[{"t":"«¿Me llamaría Cordelia, por favor?»","propia":true,"L":[{"q":"ana","t":"¿Me llamaría Cordelia, por favor?"},{"q":"marilla","t":"¿Cordelia? ¿Así te llamas?"},{"q":"ana","t":"N-no… no exactamente. Me llamo Ana Shirley. Pero me encantaría que me llamaran Cordelia. Es un nombre tan perfectamente elegante."},{"q":"marilla","t":"No sé qué quieres decir con eso. Ana es un nombre sensato y bonito. No tienes por qué avergonzarte de él."}]},{"t":"«Ana Shirley», y nada más","propia":false,"L":[{"q":"ana","t":"Ana Shirley."},{"q":"marilla","t":"(Marilla asiente, un poco sorprendida de que la niña conteste derecho.) Bueno. Ana es un nombre sensato y bonito."},{"ef":"suma afecto:marilla:ana 1"}]}]},{"q":"ana","t":"Si me llama Ana, por favor llámeme Ana con una sola n. A-n-n-a se ve espantoso, pero A-n-a se ve tanto más distinguido."},{"q":"marilla","t":"(Marilla aprieta los labios.) Muy bien, Ana con una sola n. Ahora a cenar."},{"ef":"sentar marilla"},{"ef":"sentar matthew"},{"ef":"mesa cena"},{"q":"marilla","t":"(Marilla sirve pan, mantequilla y jalea de manzanitas silvestres. Matthew se sienta en silencio.)"},{"q":"ana","t":"(Ana mordisquea el pan y empuja la jalea por el plato con la cuchara. No come casi nada.)"},{"q":"marilla","t":"No estás comiendo nada."},{"ops":[{"t":"«No puedo. Estoy en las profundidades de la desesperación.»","propia":true,"L":[{"q":"ana","t":"No puedo. Estoy en las profundidades de la desesperación. ¿Usted puede comer cuando está en las profundidades de la desesperación?"},{"q":"marilla","t":"Nunca he estado en las profundidades de la desesperación, así que no sabría decirte."},{"q":"ana","t":"¿Nunca? Bueno, ¿alguna vez trató de imaginar que estaba?"},{"q":"marilla","t":"No, nunca."},{"q":"ana","t":"Entonces no creo que pueda entender cómo es."}]},{"t":"Probar un bocado, para no desairar a Marilla","propia":false,"L":[{"q":"ana","t":"(Ana se obliga a tragar un bocado de pan. Le cuesta muchísimo.) Está muy rico, Srta. Cuthbert. Es que no tengo nada de hambre."},{"q":"marilla","t":"(Marilla la mira un momento. Algo se le ablanda por dentro, aunque no lo demuestra.)"},{"ef":"suma afecto:marilla:ana 1"}]}]},{"q":"matthew","t":"Bueno, pues… creo que está cansada, Marilla. Lo mejor sería acostarla."},{"q":"marilla","t":"(Marilla enciende una vela.) Tu pieza es la del alero este, arriba. Sube y acuéstate."},{"ef":"levantar marilla"},{"ef":"levantar matthew"},{"ef":"levantar ana"},{"q":"narra","t":"Así se juega: cuando hay que elegir, eliges tú por Ana; el tiempo espera mientras decides. Lo que hace cambia lo que los demás sienten por ella. Ahora mismo Marilla no la quiere: mañana la llevará a White Sands, a devolverla."},{"q":"narra","t":"Ahora te toca a ti: lleva a Ana a su pieza. Toca el suelo para que camine (o usa las flechas), y toca la escalera, al fondo de la cocina. Si tocas a una persona o una cosa estando Ana al lado, verás qué puede hacer con ella. En el cuaderno (📖), lo que Ana puede hacer para quedarse en Tejas Verdes."}],"a_prueba":true,"resumen":"El comienzo: Avonlea, los Cuthbert, y Matthew va a buscar a un niño del orfanato.","narra_salvo":"hecho:desde_estacion","canal":"gg","prioridad":"10","interrumpe":true,"sujeta":"matthew, marilla","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"primera_noche_sube","origen":"guion","si":["hecho:primera_noche","!hecho:desayuno_prueba","!dicha:cama_1","hora:21-29","horas_desde:llegada_tv:0.5"],"o":[],"empieza":[],"termina":["a_pieza"],"narra":["Ya es noche cerrada. Marilla toma la vela, busca a Ana y la lleva hasta la pieza del alero, sin decir palabra."],"L":[],"a_prueba":true,"resumen":"La primera noche: Marilla lleva a Ana a la pieza del alero.","canal":"gg","prioridad":"9","interrumpe":true,"tipo":"escena"},{"id":"primera_noche","origen":"guion","si":["hecho:llegada_tv","!hecho:primera_noche","!capitulo"],"o":[],"empieza":[],"termina":["hecho primera_noche","log Marilla dejó que Ana se quedara esa noche, hasta aclarar el enredo. | yo: Marilla me dejó quedarme esa noche, hasta aclarar el enredo."],"narra":[],"L":[{"q":"marilla","t":"Bueno, bueno, no hace falta llorar así. No te vamos a echar esta noche. Te quedas hasta que aclaremos este enredo. ¿Cómo te llamas?"},{"q":"ana","t":"¿Me llamaría Cordelia, por favor?"},{"q":"marilla","t":"¿Cordelia? ¿Así te llamas?"},{"q":"ana","t":"N-no… no exactamente. Me llamo Ana Shirley. Pero me encantaría que me llamaran Cordelia. Es un nombre tan perfectamente elegante."},{"q":"marilla","t":"Ana es un nombre sensato y bonito. No tienes por qué avergonzarte de él."},{"q":"ana","t":"Entonces, por favor, llámeme Ana. Ana con una sola n: A-n-a se ve tanto más distinguido."},{"q":"matthew","t":"(Matthew mira a Ana y luego a Marilla, sin decir nada. Pero no se le olvida la niña que le habló todo el camino.)"},{"q":"marilla","t":"Mañana veremos qué se hace contigo. Ahora a cenar, y a la cama. Tu pieza es la del alero."},{"q":"ana","t":"(Ana apenas prueba la cena. Esa noche, en la pieza del alero, llora hasta quedarse dormida.)"}],"a_prueba":true,"resumen":"Marilla le dice que esa noche se queda, hasta aclarar el enredo.","canal":"gg","prioridad":"10","interrumpe":true,"sujeta":"matthew, marilla","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"lynde_se_entera","origen":"guion","si":["hecho:inicio_juego","hecho:desayuno_prueba","hora:7-12","!sabe:lynde:nina_cuthbert"],"o":[],"empieza":["saber lynde nina_cuthbert"],"termina":[],"narra":["Anoche, desde su ventana, la Sra. Rachel Lynde vio pasar la calesa de Matthew… y en ella, una niña de trenzas rojas. Esta mañana, antes de que el sol esté alto, ya se lo ha contado a medio Avonlea. A la otra mitad se lo contará en la tarde."],"L":[],"a_prueba":true,"resumen":"La Sra. Lynde se entera de que los Cuthbert tienen una niña.","canal":"rl","prioridad":"2","tipo":"escena"},{"id":"desayuno_prueba","origen":"guion","si":["hecho:primera_noche","dias_desde:llegada_tv:1","!hecho:desayuno_prueba","hora:6.5-14"],"o":[],"empieza":["a_cocina","punto viaje | Volver a la mañana del viaje a White Sands"],"termina":["hecho desayuno_prueba"],"narra":["Huele a pan tostado en toda la casa. Marilla llama: «¡Ana! ¡El desayuno!»."],"L":[{"ef":"sentar ana"},{"ef":"sentar marilla"},{"ef":"mesa desayuno"},{"q":"ana","t":"¡Oh, Marilla! ¿Vio la mañana? El cerezo de la ventana está todo en flor. ¿No le da gusto que haya mañanas en el mundo?"},{"q":"marilla","t":"Es una mañana como cualquier otra. Siéntate y come."},{"q":"marilla","t":"Y otra cosa: anoche dejaste la ropa tirada por todo el suelo. La doblé yo, pero no pienso hacerlo otra vez. En esta casa, cada una dobla su ropa y la deja en la silla."},{"q":"ana","t":"Es que anoche tenía el alma tan atormentada que no me acordé de la ropa. Esta noche la voy a doblar muy bien. En el orfanato siempre teníamos que doblarla."},{"q":"ana","t":"Bueno… la mitad de las veces se me olvidaba. Tenía tanto apuro por meterme en la cama, quietecita, a imaginar cosas."},{"q":"marilla","t":"(Marilla aprieta los labios.) Pues aquí no se te va a olvidar."},{"q":"ana","t":"Me cuesta comer cuando estoy desesperada. Pero es tan difícil estar desesperada en una mañana así…"},{"q":"marilla","t":"Esta tarde vamos a White Sands, a ver a la Sra. Spencer. Ella se equivocó, y ella lo va a arreglar."},{"q":"ana","t":"(Ana baja la mirada al plato y no dice nada más, cosa rara en ella.)"},{"ef":"levantar ana"},{"ef":"levantar marilla"},{"ef":"mesa nada"}],"a_prueba":true,"resumen":"El primer desayuno en Tejas Verdes: Ana todavía no sabe si se queda.","canal":"gg","prioridad":"9","interrumpe":true,"sujeta":"marilla","donde":"tejas","tipo":"escena"},{"id":"viaje_spencer","origen":"guion","si":["hecho:desayuno_prueba","!hecho:a_prueba","hora:14-19","paciencia:marilla:ana>=1"],"o":[],"empieza":["a_cocina","hecho rumbo_spencer"],"termina":[],"narra":["White Sands está a unas millas por el camino de la costa. Allí vive la Sra. Spencer, la que trajo a Ana del orfanato por equivocación: Marilla va a pedirle que la devuelva. Ana sabe que puede ser su último día en Tejas Verdes."],"L":[{"q":"marilla","t":"Ponte el sombrero, Ana. Nos vamos a White Sands."},{"q":"ana","t":"Puede que sea la última vez que veo esta cocina.","piensa":true},{"ef":"viaje white_sands"}],"a_prueba":true,"resumen":"Marilla y Ana salen a White Sands, a devolverla donde la Sra. Spencer.","punto":"white_sands | Antes de salir a White Sands","canal":"gg","prioridad":"9","interrumpe":true,"sujeta":"marilla","donde":"tejas","tipo":"escena"},{"id":"ws_t1","origen":"guion","si":["hecho:rumbo_spencer","!hecho:a_prueba","avance:ws:1-30"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"¿Sabe, Srta. Cuthbert? He decidido disfrutar de este viaje. Si uno se decide con firmeza, casi siempre puede disfrutar de las cosas."},{"q":"ana","t":"No voy a pensar en el orfanato mientras vamos. Solo en el camino. ¡Mire, ya hay una rosa silvestre! ¿No le parece que el rosa es el color más encantador del mundo? Lástima que yo no lo pueda usar, con este pelo."},{"q":"marilla","t":"Hm."},{"q":"ana","t":"¿Ha conocido a alguien que de chica tuviera el pelo rojo y de grande se le volviera de otro color?"},{"q":"marilla","t":"No, nunca. Y no creo que en tu caso vaya a pasar."},{"q":"ana","t":"(Ana suspira.) Bueno, otra esperanza perdida. Mi vida es un perfecto cementerio de esperanzas enterradas. Lo leí en un libro, y me lo digo para consolarme cuando algo me sale mal."},{"q":"marilla","t":"No veo dónde está el consuelo."},{"q":"ana","t":"Es que suena tan bonito y tan romántico… como si yo fuera la heroína de un libro."}],"a_prueba":true,"resumen":"En la calesa: Ana decide disfrutar el viaje; las rosas silvestres y su pelo.","canal":"viaje","prioridad":"6","interrumpe":true,"en":"ana=out, marilla=out","calesa":"avonlea","tipo":"escena"},{"id":"ws_t2","origen":"guion","si":["hecho:rumbo_spencer","!hecho:a_prueba","avance:ws:25-60"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"(Marilla mira el camino, no a Ana.) Ya que tienes tantas ganas de hablar, cuéntame lo que sepas de ti."},{"q":"ana","t":"Oh, lo que sé de mí no vale la pena contarlo, Srta. Cuthbert. Si me dejara contarle lo que imagino de mí, le parecería mucho más interesante."},{"q":"marilla","t":"No, nada de imaginaciones. Los hechos, sin adornos. ¿Dónde naciste y cuántos años tienes?"},{"q":"ana","t":"Cumplí once en marzo. Nací en Bolingbroke, en Nueva Escocia. Mi padre se llamaba Walter Shirley y era maestro en la escuela de Bolingbroke. Mi madre se llamaba Bertha Shirley. ¿No son lindos nombres, Walter y Bertha? Me alegra tanto que mis padres tuvieran nombres bonitos."},{"q":"marilla","t":"El nombre de una persona importa poco, si se porta bien."},{"q":"ana","t":"Bueno, no sé. Una rosa con otro nombre olería igual de dulce, dice el libro, pero nunca he podido creerlo. No creo que una rosa fuera tan linda si se llamara cardo o repollo."},{"q":"marilla","t":"Hay que ver la de cosas que caben en esa cabeza.","piensa":true}],"a_prueba":true,"resumen":"Marilla le pide «los hechos»: Bolingbroke, Walter y Bertha Shirley.","canal":"viaje","prioridad":"6","interrumpe":true,"en":"ana=out, marilla=out","calesa":"avonlea","tipo":"escena"},{"id":"ws_t3","origen":"guion","si":["hecho:rumbo_spencer","!hecho:a_prueba","avance:ws:45-88"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Mi madre también era maestra, pero cuando se casó con mi padre dejó de enseñar. Eran pobres como ratones de iglesia. Vivían en una casita amarilla, con madreselvas en la ventana. Yo nunca la vi, pero la he imaginado miles de veces."},{"q":"ana","t":"Mi madre se murió de fiebre cuando yo tenía tres meses. Ojalá hubiera vivido lo bastante para que yo me acordara de haberla llamado mamá. Mi padre se murió cuatro días después, de la misma fiebre."},{"q":"ana","t":"Nadie me quería, ni siquiera entonces. Parece que ese es mi destino. Al final me llevó la Sra. Thomas, que era pobre y tenía un marido que bebía. Me crió con biberón. Yo cuidaba a sus hijos, que eran cuatro, todos menores que yo."},{"q":"ana","t":"Después el Sr. Thomas se cayó debajo de un tren, y me llevó la Sra. Hammond, río arriba. Tenía ocho hijos: tres pares de mellizos. A mí me gustan los bebés, dentro de lo razonable, pero tres pares de mellizos seguidos es demasiado."},{"q":"ana","t":"Y cuando el Sr. Hammond se murió, ella repartió a sus hijos entre los parientes y se fue a Estados Unidos. Y yo tuve que ir al orfanato de Hopetown, porque nadie me quería. Ni en el orfanato me querían: estaba lleno."},{"q":"marilla","t":"¿Y fuiste a la escuela?"},{"q":"ana","t":"No mucho. Pero sé muchísimos poemas de memoria: «La batalla de Hohenlinden», y «Edimburgo después de Flodden», y casi todo «La dama del lago». ¿No le encantan esos poemas que le dan a uno escalofríos por la espalda?"},{"q":"marilla","t":"¿Y esas mujeres, la Sra. Thomas y la Sra. Hammond, te trataban bien?"},{"q":"ana","t":"(Ana se pone colorada hasta la frente.) Q-querían tratarme bien. Sé que querían ser tan buenas y amables como pudieran. Y cuando alguien quiere ser bueno con uno, no importa tanto si no lo consigue del todo, ¿no? Tenían muchas preocupaciones."},{"q":"marilla","t":"Qué vida, la de esta criatura. Hambre de cariño, trabajo, pobreza y abandono. Y está tan contenta de haber llegado a un hogar de verdad. ¿Y si se la quedaran? Matthew quiere. Y parece buena, y enseñable.","piensa":true}],"a_prueba":true,"resumen":"Ana cuenta su vida: la fiebre, la Sra. Thomas, los mellizos, el orfanato.","canal":"viaje","prioridad":"6","interrumpe":true,"en":"ana=out, marilla=out","calesa":"avonlea","tipo":"escena"},{"id":"ws_pye","origen":"guion","si":["hecho:rumbo_spencer","!hecho:a_prueba","avance:ws:80-100","ve:srapye"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"srapye","t":"¡Marilla Cuthbert! (La Sra. Pye se acerca a la calesa, con su canasto, y mira a Ana de arriba abajo.) ¿Así que esta es la huérfana que les mandaron por equivocación?"},{"q":"marilla","t":"Buenas tardes, Sra. Pye."},{"q":"srapye","t":"Flaca como un palo, y con ese pelo… Yo que usted, Marilla, la devolvía hoy mismo. A esas niñas del asilo no se les quita lo que traen: mienten, roban, y al primer descuido le queman a una la casa. Nadie las quiere por algo."},{"q":"ana","t":"Nadie las quiere por algo.","piensa":true},{"ops":[{"t":"Bajar de la calesa y correr hacia el mar","propia":true,"L":[{"q":"ana","t":"(Ana salta de la calesa sin decir una palabra y echa a correr por el pasto, hacia el mar, con la trenza al viento.)"},{"q":"marilla","t":"¡Ana! ¡Ana Shirley!"},{"ef":"hecho ws_corrio"},{"ef":"viaje orilla"}]},{"t":"Quedarse quieta, apretando la maleta","propia":false,"L":[{"q":"ana","t":"(Ana no dice nada. Aprieta la maleta vieja contra las rodillas, hasta que le duelen los dedos, y mira el mar.)"},{"q":"marilla","t":"(Marilla sacude las riendas.) Buenas tardes, Sra. Pye. Tenemos que llegar a White Sands antes del té."},{"q":"ana","t":"No voy a llorar delante de ella. No voy a llorar.","piensa":true},{"ef":"hecho ws_callo"},{"ef":"viaje sigue"}]}]}],"a_prueba":true,"resumen":"La Sra. Pye sale al camino y dice algo cruel de Ana (no es del libro).","canal":"viaje","prioridad":"7","interrumpe":true,"en":"ana=out, marilla=out, srapye=out","sujeta":"srapye","calesa":"avonlea","tipo":"escena"},{"id":"ws_orilla","origen":"guion","si":["hecho:rumbo_spencer","!hecho:a_prueba","hecho:ws_corrio","!no_hoy:ws_marilla_llega"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"narra","t":"El mar está gris y verde, con espuma en las rocas. Ana se ha sentado en la arena roja, abrazada a las rodillas, y llora como si el mar entero le hubiera entrado por los ojos."},{"q":"marilla","t":"(Marilla llega sin aliento, sujetándose el sombrero.) No se sale corriendo así, sin una palabra. Casi me matas del susto."},{"q":"ana","t":"(Ana no levanta la cara.) Ella tiene razón, ¿no? Nadie me quiso nunca. Debe ser por algo. Por eso me van a devolver."},{"q":"marilla","t":"(Marilla se queda de pie un momento. Después, con un suspiro, se sienta en la arena junto a Ana, con su falda negra y todo.)"},{"q":"marilla","t":"La Sra. Pye dice lo que dice de todo el mundo, Ana. De mí también, a mis espaldas, y aquí me tienes."},{"q":"ana","t":"Pero a mí me lo dijo delante. Y usted no le contestó nada."},{"q":"marilla","t":"Le dije buenas tardes. Con la Sra. Pye, eso ya es decirle bastante."},{"ops":[{"t":"«¿Usted también cree que debería volver al orfanato?»","propia":true,"L":[{"q":"ana","t":"¿Usted también cree que debería volver al orfanato? Dígamelo de verdad. Prefiero saberlo aquí, con el mar, que allá, delante de la Sra. Spencer."},{"q":"marilla","t":"(Marilla mira las olas un buen rato antes de contestar.) Lo que yo crea es asunto mío, y todavía no lo he decidido. Pero no lo voy a decidir por lo que diga una mujer en un camino. Eso te lo prometo."},{"q":"ana","t":"(Ana se seca la cara con la manga.) Gracias, Srta. Cuthbert. Eso ya es bastante. Es casi una esperanza, y yo sé vivir con casi esperanzas."},{"ef":"suma afecto:marilla:ana 1"},{"ef":"hecho ws_pregunto"}]},{"t":"Mirar el mar sin decir nada","propia":false,"L":[{"q":"ana","t":"(Ana se queda mirando las olas, que van y vienen. Al rato, sin darse cuenta, ya no llora.) El mar no se ofende de nada, ¿verdad? Le dicen cosas y él sigue yendo y viniendo, como si nada."},{"q":"marilla","t":"Hm. Será que tiene mucho que hacer. (Pero Marilla no se levanta todavía. Se quedan las dos, mirando el agua.)"},{"q":"ana","t":"Se quedó. No dijo nada bonito, pero se sentó en la arena conmigo. Eso tiene que contar.","piensa":true},{"ef":"suma afecto:marilla:ana 1"},{"ef":"hecho ws_mar"}]},{"t":"«Perdón por salir corriendo. No sé portarme como una niña decente.»","propia":false,"L":[{"q":"ana","t":"Perdón por salir corriendo, Srta. Cuthbert. Ya ve, no sé portarme como una niña decente. A lo mejor por eso…"},{"q":"marilla","t":"Una niña decente no se tira de una calesa, eso es verdad. (Marilla le arregla el sombrero torcido.) Pero tampoco se queda sentada oyendo eso. Ya está. Vamos, que se hace tarde."},{"ef":"hecho ws_perdon"}]}]},{"q":"marilla","t":"Vamos, levántate. Sacúdete esa arena, que no vas a llegar donde la Sra. Spencer hecha una playa."},{"ef":"viaje calesa"}],"a_prueba":true,"resumen":"Ana llora en la orilla del mar; Marilla se sienta con ella en la arena.","canal":"viaje","prioridad":"8","interrumpe":true,"en":"ana=out, marilla=out","sujeta":"marilla","tipo":"escena"},{"id":"ws_spencer","origen":"guion","si":["hecho:rumbo_spencer","!hecho:a_prueba","avance:ws:100-100","ve:spencer"],"o":[],"empieza":[],"termina":["hecho ws_vuelven","olvidar rumbo_spencer"],"narra":[],"L":[{"q":"spencer","t":"¡Marilla Cuthbert! ¡Qué sorpresa! Pasen, pasen. ¿Y cómo está la niña?"},{"q":"marilla","t":"Para eso venimos, Sra. Spencer. Ha habido una equivocación. Le mandamos a decir con su hermano Robert que queríamos un niño de diez u once años."},{"q":"spencer","t":"¡No me diga! Pues Robert me mandó a decir con su hija Nancy que ustedes querían una niña. ¿No fue así, Flora Jane? (Mira hacia dentro de la casa.) Bueno, la culpa no es mía. Hice lo que pude, y seguí sus instrucciones."},{"q":"spencer","t":"Pero mire qué casualidad: aquí está la Sra. Peter Blewett, que justo andaba buscando una niña para que la ayude. Tiene una familia grande, y le cuesta conseguir ayuda."},{"q":"blewett","t":"(La Sra. Blewett mira a Ana de arriba abajo, con sus ojos chicos y duros.) ¿Cuántos años tienes y cómo te llamas?"},{"q":"ana","t":"Ana Shirley. Tengo once años."},{"q":"blewett","t":"Hm. No pareces gran cosa, pero eres fibrosa. Las fibrosas son las que más rinden. Si te llevo, vas a tener que ser buena, ¿entiendes? Buena y lista, y respetuosa. Te vas a ganar lo que comes, no te equivoques. Y el bebé es de lo más caprichoso."},{"q":"ana","t":"Tiene cara de barrena. De esas que se meten en la madera.","piensa":true},{"ops":[{"t":"Mirar a Marilla, sin decir una palabra","propia":true,"L":[{"q":"ana","t":"(Ana no dice nada. Se pone pálida y mira a Marilla, con unos ojos tan desesperados que Marilla tiene que bajar los suyos.)"},{"ef":"hecho ws_mira"}]},{"t":"«Sé barrer y lavar platos, y cuidar mellizos…»","propia":false,"L":[{"q":"ana","t":"(Con un hilo de voz.) Sé barrer y lavar platos, y cuidar mellizos. Tres pares. Pero… pero en Tejas Verdes hay un cerezo que se ve desde mi ventana."},{"ef":"hecho ws_ofrece"}]}]},{"q":"marilla","t":"(Marilla carraspea.) Bueno, no sé. No he dicho que Matthew y yo hayamos decidido del todo no quedarnos con ella. La verdad es que Matthew quiere quedársela. Me la llevo a casa y lo hablamos."},{"q":"blewett","t":"(La Sra. Blewett aprieta los labios.) Como quiera. Pero no me la mande después, cuando ya tenga a otra."},{"q":"ana","t":"(Ya en el camino, Ana le habla en un susurro.) Srta. Cuthbert, ¿de verdad dijo que a lo mejor me dejaba quedarme en Tejas Verdes? ¿O me lo imaginé?"},{"q":"marilla","t":"Más te vale aprender a sujetar esa imaginación, Ana, si no sabes distinguir lo que es de verdad de lo que no. Sí, oíste bien, y nada más. Todavía no está decidido."},{"q":"ana","t":"Prefiero volver al orfanato antes que ir con ella. Parece una… una barrena."},{"q":"marilla","t":"(A Marilla se le escapa algo que podría ser una sonrisa, y se lo traga.) No se habla así de una señora, y menos de una que no conoces. Súbete, y quédate quieta."},{"ef":"viaje casa"}],"a_prueba":true,"resumen":"Donde la Sra. Spencer: la Sra. Blewett la quiere de sirvienta; Marilla se la lleva.","canal":"viaje","prioridad":"8","interrumpe":true,"en":"ana=out, marilla=out, spencer=out, blewett=out","sujeta":"spencer, blewett","tipo":"escena"},{"id":"ws_noche","origen":"guion","si":["hecho:ws_vuelven","!hecho:a_prueba"],"o":[],"empieza":[],"termina":["hecho conoce_blewett","hecho a_prueba","suma afecto:marilla:ana 1","log Marilla llevó a Ana a White Sands; la Sra. Blewett la quería de sirvienta, y Marilla no se la dio. Esa noche le dijo a Matthew que se la quedaba; a Ana, todavía no. | yo: Marilla me llevó a White Sands. La Sra. Blewett me quería de sirvienta, pero Marilla no me entregó.","punto a_prueba | Marilla decidió quedársela, a prueba"],"narra":["Esa noche, en el corral, Marilla habla largo con Matthew. «Me la quedo», le dice al fin. «Alguien tiene que criarla, y no voy a dársela a esa mujer.» Matthew sonríe, sin decir nada. Pero a Ana, por razones que solo ella sabe, Marilla no le dice nada todavía."],"L":[{"q":"ana","t":"No me dijo nada en todo el camino de vuelta. ¿Me devolverán mañana?","piensa":true}],"a_prueba":true,"resumen":"Esa noche, Marilla le dice a Matthew que se queda con Ana (a ella, todavía no).","canal":"gg","prioridad":"9","interrumpe":true,"sujeta":"marilla","tipo":"escena"},{"id":"llamar_almuerzo","origen":"guion","si":["hecho:desayuno_prueba","hora:12-13.4","no_hoy:llamada_almuerzo"],"o":[],"empieza":["hecho llamada_almuerzo"],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Ana, a la mesa. La comida no se va a quedar esperando a que termines de imaginar."},{"ops":[{"t":"Sentarse a la mesa con los Cuthbert","propia":true,"L":[{"ef":"a_la_mesa"},{"q":"ana","t":"¡Voy! Huele a papas con mantequilla."}]},{"t":"«Un minutito, Marilla…»","propia":false,"L":[{"q":"ana","t":"Un minutito, Marilla. Estoy en la mitad de algo importantísimo."},{"q":"marilla","t":"(Marilla suspira.) Todo es importantísimo contigo."}]}]}],"a_prueba":true,"resumen":"Marilla llama a Ana a almorzar, en la cocina.","canal":"gg","prioridad":"4","sujeta":"marilla","repetir":"dia","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"llamar_almuerzo_afuera","origen":"guion","si":["hecho:desayuno_prueba","hora:12-13.4","no_hoy:llamada_almuerzo"],"o":[],"empieza":["hecho llamada_almuerzo"],"termina":[],"narra":["Desde la puerta de la cocina, Marilla se seca las manos en el delantal y llama: «¡Ana! ¡A la mesa!»"],"L":[{"ops":[{"t":"Entrar a almorzar con los Cuthbert","propia":true,"L":[{"ef":"a_cocina"},{"ef":"a_la_mesa"},{"q":"ana","t":"¡Voy, Marilla! Huele a papas con mantequilla."}]},{"t":"Quedarse afuera un ratito más","propia":false,"L":[{"q":"ana","t":"Un minutito más. Las abejas todavía no terminan su himno.","piensa":true}]}]}],"a_prueba":true,"resumen":"Marilla llama a Ana a almorzar desde la puerta.","canal":"gg","prioridad":"4","repetir":"dia","en":"ana=out","donde":"casa","tipo":"escena"},{"id":"matthew_busca_almuerzo","origen":"guion","si":["hecho:desayuno_prueba","hora:12-14","!no_hoy:matthew_llega_almuerzo","no_hoy:llamada_almuerzo"],"o":[],"empieza":["hecho llamada_almuerzo"],"termina":[],"narra":[],"L":[{"q":"matthew","t":"(Matthew llega un poco agitado, con el sombrero en la mano.) Bueno, pues… Marilla dice que el almuerzo se enfría. Y que te diga que no es un almuerzo imaginario."},{"ops":[{"t":"Volver con Matthew a almorzar","propia":true,"L":[{"q":"ana","t":"¡El almuerzo! Se me olvidó por completo, Matthew. Estaba en la mitad de un pensamiento larguísimo."},{"q":"matthew","t":"Me lo imaginaba. Los pensamientos largos dan hambre, dicen."},{"ef":"a_cocina"},{"ef":"a_la_mesa"}]},{"t":"Pedirle que le guarde algo para más tarde","propia":false,"L":[{"q":"ana","t":"¿Le podría decir a Marilla que me guarde un plato? Estoy en algo que no se puede dejar a medias."},{"q":"matthew","t":"(Matthew se rasca la nuca.) Le diré. Pero no te prometo la cara que va a poner."},{"ef":"log Ana no fue a almorzar: le pidió a Matthew que le guardaran un plato. | yo: No fui a almorzar. Matthew vino a buscarme hasta acá. Creo que Marilla va a poner su cara de «ya hablaremos»."}]}]}],"a_prueba":true,"resumen":"Ana anda lejos a la hora de almuerzo: Matthew viene a buscarla.","canal":"general","prioridad":"5","repetir":"dia","en":"ana=out, matthew=out","sujeta":"matthew","tipo":"escena"},{"id":"marilla_a_la_cama","origen":"guion","si":["hecho:a_prueba","hora:21-23.5"],"o":[],"empieza":[],"termina":[],"narra":["Ya es de noche en Tejas Verdes. Marilla se asoma con la vela: «Ana, a la cama. Mañana hay que madrugar.»"],"L":[{"ops":[{"t":"Ir a acostarse","propia":true,"L":[{"ef":"acostarse"}]},{"t":"«¡Cinco minutitos más, Marilla!»","propia":false,"L":[{"q":"ana","t":"¡Cinco minutitos más, Marilla! Estoy en la mitad de un sueño despierta."}]}]}],"a_prueba":true,"resumen":"Marilla manda a Ana a acostarse.","canal":"gg","prioridad":"5","repetir":"dia","donde":"tejas","tipo":"escena"},{"id":"falta_camison","origen":"guion","si":["hecho:desayuno_prueba","ana:camison","ve:marilla","hora:9-19"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"¡Ana! ¿Todavía en camisón a esta hora? En esta casa una se viste apenas se levanta."},{"ops":[{"t":"«Perdón, Marilla. Ahora mismo me visto.»","propia":false,"L":[{"q":"ana","t":"Perdón, Marilla. Ahora mismo me visto. Se me olvidó por completo: estaba ocupadísima imaginando."},{"ef":"vestirse"},{"q":"marilla","t":"(Marilla suspira.) Imaginando. Claro."}]},{"t":"«Es que en camisón me siento como un hada…»","propia":true,"L":[{"q":"ana","t":"Es que en camisón me siento como un hada del bosque. Las hadas nunca se visten, ¿sabía?"},{"q":"marilla","t":"Tú no eres un hada. Eres una niña, y vives en mi casa. Ve a vestirte."},{"ef":"suma paciencia:marilla:ana -1"}]}]}],"a_prueba":true,"resumen":"Marilla encuentra a Ana en camisón a media mañana.","canal":"gg","prioridad":"6","repetir":"dia","sujeta":"marilla","tipo":"escena"},{"id":"falta_ropa","origen":"guion","si":["hecho:ropa_tirada_otra","ve:marilla","hora:6-13"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Otra vez la ropa por el suelo, Ana. ¿No habíamos quedado en que la doblabas en la silla?"},{"ops":[{"t":"«Tiene razón. Esta noche la doblo, se lo prometo.»","propia":false,"L":[{"q":"ana","t":"Tiene razón, Marilla. Esta noche la doblo. Se lo prometo con todo mi corazón."},{"ef":"olvidar ropa_tirada_otra"}]},{"t":"«En el orfanato nadie se fijaba…»","propia":true,"L":[{"q":"ana","t":"En el orfanato nadie se fijaba en esas cosas."},{"q":"marilla","t":"Aquí sí. Aquí todo se ve."},{"ef":"suma paciencia:marilla:ana -1"}]}]}],"a_prueba":true,"canal":"gg","prioridad":"6","repetir":"dia","sujeta":"marilla","tipo":"escena"},{"id":"camison_barry","origen":"guion","si":["ana:camison","!donde:ana:tejas","ve:barry","sabe:barry:nina_cuthbert","!comento:barry:ana:camison","hora:7-21"],"o":[],"empieza":[],"termina":["contar barry ana_en_camison"],"narra":[],"L":[{"q":"barry","t":"(La Sra. Barry se lleva la mano al pecho.) ¡Niña! ¿Andas en camisón por las casas ajenas? ¡Qué va a decir la gente! Ya hablaré con Marilla."}],"a_prueba":true,"canal":"os","prioridad":"6","repetir":"dia","sujeta":"barry","tipo":"escena"},{"id":"camison_lynde","origen":"guion","si":["ana:camison","!donde:ana:tejas","ve:lynde","sabe:lynde:nina_cuthbert","!comento:lynde:ana:camison","hora:7-21"],"o":[],"empieza":[],"termina":["contar lynde ana_en_camison"],"narra":[],"L":[{"q":"lynde","t":"¡Habráse visto! ¡La huérfana de los Cuthbert, en camisón por el camino! Esto lo sabe Marilla antes de que se ponga el sol, como que me llamo Rachel Lynde."}],"a_prueba":true,"canal":"rl","prioridad":"6","repetir":"dia","sujeta":"lynde","tipo":"escena"},{"id":"marilla_sabe_camison","origen":"guion","si":["sabe:marilla:ana_en_camison:contada","!sabe:marilla:ana_en_camison:2","ve:marilla"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Ana. Me vino a contar {de:marilla:ana_en_camison} que andabas en camisón por Avonlea. En camisón. ¿Tienes idea de lo que va a decir la gente?"},{"ops":[{"t":"«Perdón, Marilla. No pensé que fuera tan grave.»","propia":false,"L":[{"q":"ana","t":"Perdón, Marilla. No pensé que fuera tan grave. Es que el camisón es tan cómodo… pero no lo vuelvo a hacer."}]},{"t":"«Pero es que la mañana estaba tan linda…»","propia":true,"L":[{"q":"ana","t":"Pero es que la mañana estaba tan linda que no podía perder tiempo vistiéndome."},{"q":"marilla","t":"(Marilla aprieta los labios hasta que se le ponen blancos.)"},{"ef":"suma paciencia:marilla:ana -1"}]}]}],"a_prueba":true,"canal":"gg","prioridad":"6","sujeta":"marilla","tipo":"escena"},{"id":"marilla_sabe_noche","origen":"guion","si":["sabe:marilla:ana_de_noche:contada","ve:marilla","hora:6-21"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Ana. {De:marilla:ana_de_noche} me dijo que anoche te vieron sola por el camino, a esas horas. ¿Es cierto?"},{"ops":[{"t":"«Sí, Marilla. Perdón.»","propia":false,"L":[{"q":"ana","t":"Sí, Marilla. Perdón. La luna estaba tan grande que quise verla de cerca… pero ya sé que no se hace."},{"q":"marilla","t":"Una niña no anda sola de noche por los caminos. Ni con luna ni sin luna. Que no se repita."}]},{"t":"«¡Pero la noche es tan hermosa!»","propia":true,"L":[{"q":"ana","t":"¡Pero la noche es tan hermosa! Los árboles parecen otros, y el lago brilla como si tuviera estrellas adentro."},{"q":"marilla","t":"(Marilla deja la cuchara en la mesa, despacio.) Lo hermosa que sea la noche no me importa. Lo que diga Avonlea, sí. A la cama a las nueve, y punto."},{"ef":"suma paciencia:marilla:ana -1"}]}]}],"a_prueba":true,"canal":"gg","prioridad":"6","sujeta":"marilla","tipo":"escena"},{"id":"marilla_sabe_sombrero","origen":"guion","si":["sabe:marilla:ana_sin_sombrero:contada","ve:marilla","!donde:ana:ig"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Ana Shirley. {De:marilla:ana_sin_sombrero} me contó que fuiste a la iglesia sin sombrero. ¡A la iglesia! ¿Qué va a pensar el reverendo de cómo te crío?"},{"ops":[{"t":"«Perdón, Marilla. Se me olvidó.»","propia":false,"L":[{"q":"ana","t":"Perdón, Marilla. Se me olvidó por completo. Iba pensando en otra cosa… siempre voy pensando en otra cosa."},{"q":"marilla","t":"Pues la próxima vez piensa en el sombrero. Una niña decente va a la casa del Señor como corresponde."}]},{"t":"«Es que el sombrero me aprieta las ideas…»","propia":true,"L":[{"q":"ana","t":"Es que el sombrero me aprieta las ideas, Marilla. Sin sombrero, las oraciones me salen mucho más bonitas."},{"q":"marilla","t":"(Marilla cierra los ojos un momento.) Las oraciones no se rezan con el pelo. El domingo que viene, sombrero. Y no quiero oír más."},{"ef":"suma paciencia:marilla:ana -1"}]}]}],"a_prueba":true,"canal":"gg","prioridad":"6","sujeta":"marilla","tipo":"escena"},{"id":"marilla_sabe_camison_descalza","origen":"guion","si":["sabe:marilla:ana_en_camison:2","!sabe:marilla:ana_en_camison:3","!dicha:marilla_sabe_camison","ve:marilla"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Ana Shirley. {De:marilla:ana_en_camison} me dice que anduviste en camisón por todo Avonlea, y descalza. ¡Descalza, con este tiempo!"},{"ops":[{"t":"«¡Descalza no, Marilla! Llevaba los zapatos. Y no fue por todo Avonlea.»","propia":false,"L":[{"q":"ana","t":"¡Descalza no, Marilla! Llevaba los zapatos puestos. Y no fue por todo Avonlea: fue un ratito nomás."},{"q":"marilla","t":"(Marilla suspira.) En Avonlea las cosas crecen al contarlas, eso es verdad. Pero en camisón anduviste, ¿o no? Que no se repita."}]},{"t":"«¿Y qué importa? La mañana estaba preciosa.»","propia":true,"L":[{"q":"ana","t":"¿Y qué importa, Marilla? La mañana estaba preciosa, y el camisón es casi un vestido, si una lo imagina."},{"q":"marilla","t":"(Marilla aprieta los labios hasta que se le ponen blancos.)"},{"ef":"suma paciencia:marilla:ana -1"}]}]}],"a_prueba":true,"canal":"gg","prioridad":"6","sujeta":"marilla","tipo":"escena"},{"id":"marilla_sabe_camison_cementerio","origen":"guion","si":["sabe:marilla:ana_en_camison:3","ve:marilla"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Ana. Ahora dicen en Avonlea que sales de noche en camisón a bailar en el cementerio. ¿Me quieres explicar de dónde sacan eso?"},{"q":"ana","t":"(Ana abre los ojos como platos.) ¡¿En el cementerio?! ¡Marilla, yo jamás! Le tengo terror a los cementerios de noche… salvo en los poemas."},{"q":"marilla","t":"(Marilla se tapa la boca, y por un momento parece que se ríe.) Ya me parecía. Así es Avonlea: sales en camisón al patio y a la semana bailas con los muertos. Que esto te sirva, Ana: lo que haces aquí, lo cuenta todo el mundo."}],"a_prueba":true,"canal":"gg","prioridad":"6","sujeta":"marilla","tipo":"escena"},{"id":"falta_noche","origen":"guion","si":["hecho:desayuno_prueba","!donde:ana:tejas","!ve:marilla","hora:21.5-29"],"o":[],"empieza":["suma paciencia:marilla:ana -1","contar marilla ana_de_noche"],"termina":["a_pieza"],"narra":["Ya es noche cerrada y Ana no ha vuelto. Marilla enciende el farol y sale a buscarla por los caminos, con el chal sobre los hombros y la boca apretada. La encuentra, y la trae a casa sin decir una palabra."],"L":[{"ops":[{"t":"«¡Perdón, Marilla! Se me pasó la hora.»","propia":true,"L":[{"q":"ana","t":"¡Perdón, Marilla! Se me pasó la hora, y cuando me di cuenta ya estaba oscuro. No pensé que se iba a preocupar."}]},{"t":"«No tenía por qué buscarme. Sé volver sola.»","propia":false,"L":[{"q":"ana","t":"No tenía por qué buscarme. Sé volver sola."},{"ef":"suma paciencia:marilla:ana -1"}]}]}],"a_prueba":true,"resumen":"Ana no ha vuelto de noche: Marilla sale a buscarla con el farol.","canal":"gg","prioridad":"9","interrumpe":true,"repetir":"dia","tipo":"escena"},{"id":"falta_viaje","origen":"guion","si":["hecho:desayuno_prueba","!hecho:a_prueba","!dicha:viaje_spencer","!dicha:viaje_spencer_duda","!donde:ana:tejas","hora:14.5-19"],"o":[],"empieza":["suma paciencia:marilla:ana -1"],"termina":["a_cocina"],"narra":["Marilla tiene la calesa lista para ir a White Sands, y Ana no aparece por ninguna parte. La busca por la granja, por el huerto, por el camino… y la encuentra lejos, muy lejos. Vuelven a Tejas Verdes en un silencio que da miedo."],"L":[],"a_prueba":true,"resumen":"Es hora de ir a White Sands y Ana no está: Marilla la busca.","canal":"gg","prioridad":"10","interrumpe":true,"tipo":"escena"},{"id":"viaje_spencer_duda","origen":"guion","si":["hecho:desayuno_prueba","!hecho:a_prueba","hora:14-19","paciencia:marilla:ana\u003c1"],"o":[],"empieza":["a_cocina"],"termina":["hecho conoce_blewett","hecho blewett_duda"],"narra":["White Sands está a unas millas por el camino de la costa. Marilla lleva las riendas y no dice nada en todo el viaje: piensa en el camisón a mediodía, en la ropa por el suelo, en lo que ha tenido que aguantar. Ana tampoco habla. Mira el mar y aprieta su maleta vieja."],"L":[{"q":"narra","t":"En casa de la Sra. Spencer está la Sra. Peter Blewett, que busca una niña para cuidarle los hijos. Mira a Ana de arriba abajo: «Esta me sirve. Es flaca, pero dura. Va a tener que ganarse lo que come.»"},{"q":"narra","t":"Esta vez Marilla no contesta enseguida. Mira a la Sra. Blewett, mira a Ana, y por primera vez duda de verdad. El silencio dura una eternidad."},{"ops":[{"t":"«¡Por favor, Srta. Cuthbert! Voy a ser buena, se lo juro…»","propia":false,"L":[{"q":"ana","t":"(Ana se aferra a la manga de Marilla.) ¡Por favor, Srta. Cuthbert! Voy a ser buena, se lo juro. Voy a doblar la ropa y a vestirme temprano y a no imaginar nada en horas de trabajo…"},{"ef":"hecho blewett_suplica"}]},{"t":"Quedarse callada, mirando el suelo","propia":false,"L":[{"q":"ana","t":"(Ana no dice nada. Se queda mirando el suelo, muy pálida, con los labios apretados para no llorar.)"},{"ef":"hecho blewett_calla"}]},{"t":"«Prefiero volver al orfanato antes que irme con esa señora.»","propia":true,"L":[{"q":"ana","t":"(Ana levanta la barbilla.) Prefiero volver al orfanato antes que irme con esa señora."},{"ef":"hecho blewett_orgullo"}]}]}],"a_prueba":true,"resumen":"Viaje a White Sands sin paciencia: Marilla duda de verdad ante la Sra. Blewett.","punto":"white_sands | Antes de salir a White Sands","canal":"gg","prioridad":"9","interrumpe":true,"sujeta":"marilla","donde":"tejas","tipo":"escena"},{"id":"duda_matthew","origen":"guion","si":["hecho:blewett_duda","!hecho:a_prueba","afecto:matthew:ana>=4"],"o":[],"empieza":["a_cocina"],"termina":["hecho a_prueba","log Marilla casi le dio Ana a la Sra. Blewett; Matthew pidió que se quedara. | yo: Marilla casi me entregó a la Sra. Blewett, pero Matthew pidió que me quedara.","punto a_prueba | Marilla decidió quedársela, a prueba"],"narra":["«No puedo decidir sin hablarlo con Matthew», dice al fin Marilla. Vuelven a Tejas Verdes ya de tarde. Esa noche, en el corral, Matthew escucha todo sin interrumpir, y después dice, muy bajito: «Bueno, pues… yo creo que podríamos quedarnos con ella, Marilla. Podríamos hacerle algún bien.» Y Marilla, que estaba decidida a devolverla, cede."],"L":[{"ef":"pasa_tiempo 4"},{"q":"ana","t":"Me trajo de vuelta. Pero no me ha dicho nada. ¿Me devolverán mañana?","piensa":true}],"a_prueba":true,"resumen":"Matthew pide quedarse con Ana, y Marilla cede.","canal":"gg","prioridad":"9","interrumpe":true,"sujeta":"marilla","tipo":"escena"},{"id":"duda_suplica","origen":"guion","si":["hecho:blewett_duda","!hecho:a_prueba","hecho:blewett_suplica","afecto:marilla:ana>=2"],"o":[],"empieza":["a_cocina"],"termina":["hecho a_prueba","log Ana le suplicó a Marilla en White Sands, y Marilla no la entregó. | yo: le supliqué a Marilla en White Sands, y no me entregó.","punto a_prueba | Marilla decidió quedársela, a prueba"],"narra":["Marilla mira esa manito aferrada a su manga, y algo se le quiebra por dentro. «No», dice. «No puedo. Me la llevo de vuelta.» La Sra. Blewett se encoge de hombros. En la calesa, Ana llora todo el camino, de puro alivio."],"L":[{"ef":"pasa_tiempo 4"},{"q":"ana","t":"Me trajo de vuelta. Pero no me ha dicho nada. ¿Me devolverán mañana?","piensa":true}],"a_prueba":true,"resumen":"Ana suplica, y Marilla no puede entregarla.","canal":"gg","prioridad":"8","interrumpe":true,"sujeta":"marilla","tipo":"escena"},{"id":"duda_calla","origen":"guion","si":["hecho:blewett_duda","!hecho:a_prueba","hecho:blewett_calla","afecto:marilla:ana>=3"],"o":[],"empieza":["a_cocina"],"termina":["hecho a_prueba","punto a_prueba | Marilla decidió quedársela, a prueba"],"narra":["Marilla ve esa carita pálida que no pide nada, y se acuerda de lo que Ana le contó en el camino: la Sra. Thomas, los mellizos, el orfanato. «No», dice de pronto. «Me la llevo de vuelta.»"],"L":[{"ef":"pasa_tiempo 4"},{"q":"ana","t":"Me trajo de vuelta. Pero no me ha dicho nada. ¿Me devolverán mañana?","piensa":true}],"a_prueba":true,"resumen":"Ana calla, pálida, y Marilla no puede entregarla.","canal":"gg","prioridad":"7","interrumpe":true,"sujeta":"marilla","tipo":"escena"},{"id":"devuelta_blewett","origen":"guion","si":["hecho:blewett_duda","!hecho:a_prueba"],"o":[],"empieza":[],"termina":["hecho devuelta","log Marilla le entregó Ana a la Sra. Blewett. | yo: Marilla me entregó a la Sra. Blewett.","final devuelta | Ana se fue con la Sra. Blewett. En el libro, Marilla no la entregó: Ana se ganó, poco a poco, su lugar en Tejas Verdes."],"narra":["Marilla aprieta los labios y asiente. Esa misma tarde, Ana se va con la Sra. Blewett, con su maleta vieja y su sombrero de paja. No mira hacia atrás, porque si mira hacia atrás va a llorar. En Tejas Verdes, Matthew no dice nada durante días."],"L":[],"a_prueba":true,"resumen":"Final: Marilla entrega a Ana a la Sra. Blewett.","canal":"gg","prioridad":"1","interrumpe":true,"tipo":"escena"},{"id":"se_queda","origen":"guion","si":["hecho:a_prueba","!hecho:se_queda","dias_desde:a_prueba:1","hora:14-19"],"o":[],"empieza":["a_cocina"],"termina":["hecho se_queda","suma afecto:marilla:ana 1","log Marilla le dijo a Ana que se queda en Tejas Verdes, para siempre. | yo: Marilla me dijo que me quedo en Tejas Verdes. ¡Para siempre!","punto se_queda | Marilla le dijo que se queda en Tejas Verdes"],"narra":["«Por razones que solo ella sabía, Marilla no le dijo a Ana que se quedaba en Tejas Verdes hasta la tarde siguiente.» Ana se ha pasado el día con el corazón en la boca, sin atreverse a preguntar."],"L":[{"q":"marilla","t":"Ana, Matthew y yo hemos decidido quedarnos contigo. Es decir, si tratas de ser una niña buena y agradecida."},{"q":"ana","t":"(Ana se queda quieta, sin respirar.) ¿Para siempre? ¿De verdad me quedo en Tejas Verdes?"},{"ops":[{"t":"«Voy a ser tan buena como un ángel.»","propia":true,"L":[{"q":"ana","t":"Voy a intentar ser tan buena como un ángel. Bueno… como se pueda. ¡Oh, Marilla, gracias, gracias!"},{"q":"marilla","t":"(Marilla carraspea, un poco incómoda con tanta gratitud.) Bueno, bueno. Ya veremos."}]},{"t":"Abrazar a Marilla, sin decir nada","propia":false,"L":[{"ef":"junto ana marilla"},{"q":"ana","t":"(Ana corre y abraza a Marilla por la cintura, con la cara escondida contra su delantal.)"},{"q":"marilla","t":"(Marilla se queda tiesa, sin saber dónde poner las manos. Pero no la aparta.) Bueno, bueno… Ve a lavarte la cara."},{"ef":"suma afecto:marilla:ana 1"}]}]},{"q":"ana","t":"(Ana se echa a llorar.) No se preocupe, Marilla: estoy llorando de felicidad. ¿Puedo llamarla tía Marilla?"},{"q":"marilla","t":"No. Marilla, a secas. No soy tu tía, y no me gusta que llamen a la gente lo que no es."},{"q":"ana","t":"Entonces Marilla. Pero voy a imaginar que es mi tía. Por dentro, donde no se ve."}],"a_prueba":true,"resumen":"Marilla le dice a Ana que se queda en Tejas Verdes.","canal":"gg","prioridad":"9","interrumpe":true,"grande":true,"sujeta":"marilla","donde":"tejas","tipo":"escena"},{"id":"senas_vela","origen":"guion","si":["hecho:se_queda","hecho:conocidas_diana"],"o":[],"empieza":[],"termina":["suma afecto:diana:ana 1","log Ana le hizo señas a Diana con la vela, desde la ventana de su pieza; Diana contestó. | yo: le hice señas a Diana con la vela, desde la ventana de mi pieza, ¡y ella me contestó!"],"narra":[],"L":[{"q":"ana","t":"(Ana pone la vela en la ventana y la tapa y destapa con un cartón: cinco destellos.)"},{"q":"ana","t":"(Un rato después, entre los árboles, en la ventana de Diana, una luz contesta: cinco destellos.)"},{"q":"ana","t":"Cinco destellos: «ven mañana temprano, que tengo algo importante que contarte». Y todavía no sé qué le voy a contar… pero se me va a ocurrir."}],"disparo":"menu","canal":"ana_sola","repetir":"dia","tipo":"escena"},{"id":"lynde_visita","origen":"guion","si":["hecho:se_queda","!hecho:lynde_visita","sentada:lynde"],"o":[],"empieza":[],"termina":["hecho lynde_visita"],"narra":["La Sra. Rachel Lynde, la vecina que todo lo sabe y todo lo dice, ha venido a ver con sus propios ojos a la huérfana de Tejas Verdes. Es la mujer más respetada de Avonlea, y la que tiene la lengua más larga."],"L":[{"q":"lynde","t":"(La Sra. Lynde mira a Ana de arriba abajo.) Bueno, no te eligieron por tu cara, eso seguro. Es terriblemente flaca y fea, Marilla. ¡Y qué pecas! ¡Y el pelo, rojo como zanahoria!"},{"ops":[{"t":"¡La odio! ¡Es una mujer grosera e insensible!","propia":false,"L":[{"q":"ana","t":"(Ana se planta frente a ella, temblando de rabia.) ¡La odio! ¡La odio, la odio, la odio! ¿Cómo se atreve a decir que soy flaca y fea? ¿Le gustaría que dijeran que usted es gorda y torpe y que no tiene una chispa de imaginación?"},{"q":"lynde","t":"¡Habráse visto! ¡Qué genio!"},{"q":"marilla","t":"Ana, ve a tu pieza y quédate ahí hasta que yo suba."},{"ef":"hecho ofendio_lynde"},{"ef":"suma afecto:lynde:ana -1"},{"ef":"log Ana estalló con la Sra. Lynde, que la llamó flaca, fea y pelirroja. Marilla la mandó a su pieza. | yo: la Sra. Lynde me llamó flaca, fea y pelirroja, y estallé. Marilla me mandó a mi pieza."}]},{"t":"Apretar los puños y contar hasta diez","propia":true,"L":[{"q":"ana","t":"(Ana aprieta los puños, se pone roja como un tomate… y cuenta hasta diez, muy despacio.) Buenas tardes, Sra. Lynde."},{"q":"lynde","t":"Hmm. Por lo menos tiene modales. Algo es algo."},{"q":"marilla","t":"(Marilla mira a Ana con algo parecido al orgullo.)"},{"ef":"suma afecto:marilla:ana 1"},{"ef":"hecho lynde_contenida"},{"ef":"log Ana se contuvo cuando la Sra. Lynde la llamó flaca y fea. Marilla lo notó. | yo: la Sra. Lynde me llamó flaca y fea, y me contuve. Marilla lo notó."}]},{"t":"Salir corriendo a llorar a su pieza","propia":false,"L":[{"q":"ana","t":"(Ana sale corriendo escaleras arriba y se tira en la cama a llorar.)"},{"q":"lynde","t":"Vaya, vaya. Sensible, además."},{"q":"marilla","t":"Rachel, a veces eres demasiado franca."},{"ef":"hecho lynde_llanto"},{"ef":"a_pieza"},{"ef":"log Ana se fue llorando cuando la Sra. Lynde la llamó flaca y fea. | yo: la Sra. Lynde me llamó flaca y fea, y me fui llorando a mi pieza."}]}]}],"resumen":"La Sra. Lynde viene a conocer a Ana y la llama flaca y fea; Ana elige cómo responder.","punto":"Antes de la visita de la Sra. Lynde","canal":"gg","prioridad":"9","interrumpe":true,"grande":true,"sujeta":"lynde, marilla","en":"ana=gg, marilla=gg, lynde=gg","tipo":"escena"},{"id":"lynde_perdon_marilla","origen":"guion","si":["hecho:ofendio_lynde","!hecho:perdon_pedido"],"o":[],"empieza":[],"termina":["hecho perdon_pedido"],"narra":[],"L":[{"q":"marilla","t":"Ana, lo que hiciste no se hace. Vas a ir a la casa de la Sra. Lynde a pedirle perdón."},{"q":"ana","t":"¡Nunca! Puede encerrarme en un calabozo oscuro y húmedo, con sapos y culebras, y darme pan y agua. Pero no le voy a pedir perdón."},{"q":"marilla","t":"No tenemos calabozos en Tejas Verdes. Pero te vas a quedar en tu pieza hasta que estés dispuesta a pedirle perdón."}],"resumen":"Marilla le dice a Ana que tiene que pedirle perdón a la Sra. Lynde.","canal":"gg","prioridad":"8","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"lynde_disculpa","origen":"guion","si":["hecho:ofendio_lynde"],"o":[],"empieza":[],"termina":["hecho disculpa_lynde","olvidar ofendio_lynde"],"narra":[],"L":[{"q":"ana","t":"(Ana se arrodilla de pronto frente a la Sra. Lynde.)"},{"ops":[{"t":"Disculparse a lo grande, con todo el dramatismo del mundo","propia":true,"L":[{"q":"ana","t":"¡Oh, Sra. Lynde, lo siento tanto! Nunca podré expresar todo mi dolor, aunque usara un diccionario entero. Me porté terriblemente. Soy una niña mala e ingrata. Merezco que me echen para siempre de la gente respetable."},{"q":"ana","t":"Todo lo que usted dijo era verdad: tengo el pelo rojo, soy flaca y fea, y estoy llena de pecas. Por favor, Sra. Lynde, perdóneme. Si no, va a ser una pena para toda mi vida."},{"q":"lynde","t":"(La Sra. Lynde, que no es mala, se ablanda.) Ya, ya, levántate, niña. Claro que te perdono. Yo fui demasiado dura. Y te diré algo: conocí a una niña con el pelo tan rojo como el tuyo, y de grande se le oscureció a un castaño precioso."},{"q":"ana","t":"¡Oh, Sra. Lynde! Me ha dado una esperanza. Siempre la voy a considerar una benefactora."},{"ef":"suma afecto:lynde:ana 3"},{"ef":"log Ana le pidió perdón a la Sra. Lynde a lo grande, de rodillas; la Sra. Lynde la perdonó y terminó encantada con ella. | yo: le pedí perdón a la Sra. Lynde a lo grande, de rodillas. Me perdonó, y terminó encantada conmigo."}]},{"t":"Pedirle perdón con pocas palabras","propia":false,"L":[{"q":"ana","t":"Sra. Lynde… perdóneme por lo que le dije. No estuvo bien."},{"q":"lynde","t":"Hmm. Está bien, niña. Que no se repita."},{"ef":"suma afecto:lynde:ana 1"},{"ef":"log Ana le pidió perdón a la Sra. Lynde. | yo: le pedí perdón a la Sra. Lynde."}]}]}],"resumen":"Ana se arrodilla y le pide perdón a la Sra. Lynde, con todo el drama.","canal":"rl","prioridad":"9","interrumpe":true,"sujeta":"lynde","en":"ana=rl, lynde=rl","tipo":"escena"},{"id":"ventana_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana corre a la ventana y la abre de par en par. Afuera, un cerezo enorme, todo blanco de flores, le roza el marco.)"},{"q":"ana","t":"¡Oh, qué hermoso! Es como si el árbol se hubiera vestido de novia para mí. ¿No es precioso?"},{"q":"ana","t":"Te voy a llamar…"},{"ops":[{"t":"la Reina de las Nieves","propia":true,"L":[{"q":"ana","t":"La Reina de las Nieves. Ya está: ese es tu nombre, para siempre."},{"ef":"nombrar cerezo"}]},{"t":"Otro nombre…","propia":false,"L":[{"q":"ana","t":"La Reina de las Nieves. Ya está: ese es tu nombre, para siempre."},{"ef":"nombrar cerezo ?"}]}]},{"q":"ana","t":"(Más allá, un huerto de manzanos, un arroyo entre abedules, y a lo lejos, el mar azul y brillante.) Esto es demasiado lindo para ser verdad. Si tengo que irme, al menos lo voy a recordar toda la vida."}],"disparo":"objeto","objeto":"gwin","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"ventana_2","origen":"guion","si":["hecho:a_prueba","!hecho:se_queda"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana apoya la frente en el vidrio.) Si me porto bien… si soy útil… si aprendo…","piensa":true},{"q":"ana","t":"Voy a imaginar que esta ventana es mía para siempre. Así, si me tengo que ir, al menos la habré tenido un poco."}],"resumen":"En la ventana, a prueba: si se porta bien, quizás se quede.","disparo":"objeto","objeto":"gwin","paso":"2","canal":"ana_sola","prioridad":"2","tipo":"escena"},{"id":"ventana_3","origen":"guion","si":["hecho:se_queda"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana abre la ventana de par en par, como si fuera la primera vez.)"},{"q":"ana","t":"Mi ventana. Mi cerezo. Mi pieza. ¡Ana de Tejas Verdes! ¿Hay algo más lindo que poder decir «mío» sin miedo?"}],"resumen":"En la ventana, ya aceptada: todo le parece suyo.","disparo":"objeto","objeto":"gwin","paso":"3","canal":"ana_sola","prioridad":"3","tipo":"escena"},{"id":"ventana_4","origen":"guion","si":["hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Entre los árboles se ve el techo de La Cuesta del Huerto.)"},{"q":"ana","t":"Allí está Diana. Seguro que ahora mismo también está mirando por su ventana. Una amiga del alma es alguien que mira por la ventana al mismo tiempo que tú."}],"resumen":"Desde la ventana se ve la casa de Diana.","disparo":"objeto","objeto":"gwin","paso":"4","canal":"ana_sola","prioridad":"2","tipo":"escena"},{"id":"ventana_5","origen":"guion","si":["hecho:zanahorias"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana cierra la ventana de un golpe.) ¡Zanahorias! ¡Me llamó Zanahorias delante de toda la escuela!"},{"q":"ana","t":"Gilbert Blythe puede pasar cien años pidiéndome perdón. El hierro me ha entrado en el alma."}],"resumen":"Ana cierra la ventana furiosa: Gilbert le dijo «Zanahorias».","disparo":"objeto","objeto":"gwin","paso":"5","canal":"ana_sola","prioridad":"3","tipo":"escena"},{"id":"ventana_6","origen":"guion","si":["hecho:prohibida","!hecho:perdonada"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana mira largo rato hacia La Cuesta del Huerto, con los ojos llenos de lágrimas.)"},{"q":"ana","t":"Tan cerca, y no puedo ir. Es como en los cuentos, cuando hay un río encantado entre dos castillos."},{"q":"ana","t":"Voy a dejar la vela encendida un ratito. Diana no la puede ver… pero yo sé que está."}],"resumen":"Desde la ventana, la casa de Diana, que ya no puede visitar.","disparo":"objeto","objeto":"gwin","paso":"6","canal":"ana_sola","prioridad":"4","tipo":"escena"},{"id":"ventana_7","origen":"guion","si":["hecho:perdonada"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(La luz de la pieza de Diana brilla entre los árboles desnudos.)"},{"q":"ana","t":"Minnie May está bien, y la Sra. Barry me perdonó. Creo que nunca había visto una luz tan bonita como esa ventana."}],"resumen":"Desde la ventana, la luz de la pieza de Diana: otra vez amigas.","disparo":"objeto","objeto":"gwin","paso":"7","canal":"ana_sola","prioridad":"4","tipo":"escena"},{"id":"ventana_8","origen":"guion","si":["estudio:ana>=50","!hecho:queens"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana tiene la gramática abierta sobre las rodillas, pero mira por la ventana.)"},{"q":"ana","t":"Si entro al Queen's, voy a ser maestra. Y entonces Marilla y Matthew… no, primero la gramática. Pero qué ganas de mirar el mundo en vez de los verbos."}],"disparo":"objeto","objeto":"gwin","paso":"8","canal":"ana_sola","prioridad":"1","tipo":"escena"},{"id":"ventana_9","origen":"guion","si":["hecho:queens"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana mira el cerezo, el arroyo, el bosque, como si quisiera aprendérselos de memoria.)"},{"q":"ana","t":"En Charlottetown voy a tener otra ventana. Pero esta va a ser siempre la de verdad: las otras van a ser ventanas de visita."}],"resumen":"Ana mira por la ventana antes de irse al Queen's.","disparo":"objeto","objeto":"gwin","paso":"9","canal":"ana_sola","prioridad":"4","tipo":"escena"},{"id":"ventana_10","origen":"guion","si":["estacion:primavera","hora:5-11"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana abre la ventana. El aire de la mañana entra oliendo a flores de cerezo y a tierra mojada.)"},{"q":"ana","t":"Las abejas ya están trabajando en la Reina de las Nieves. Zumban como si cantaran un himno muy bajito."},{"q":"ana","t":"Allá abajo va Matthew con el arado. Desde aquí parece un caballero saliendo a una cruzada… una cruzada de papas."}],"disparo":"objeto","objeto":"gwin","paso":"10","canal":"ana_sola","tipo":"escena"},{"id":"ventana_11","origen":"guion","si":["estacion:primavera","hora:14-20"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Por la ventana se ve el huerto en flor, el arroyo entre los abedules y, más allá, el bosque oscuro.)"},{"q":"ana","t":"El arroyo se ríe solo. Debe estar acordándose de algo muy gracioso que le pasó en el invierno, cuando estaba bajo el hielo."},{"q":"ana","t":"Si una pudiera embotellar esta tarde, la guardaría para un día gris de noviembre."}],"disparo":"objeto","objeto":"gwin","paso":"11","canal":"ana_sola","tipo":"escena"},{"id":"ventana_12","origen":"guion","si":["estacion:primavera","hora:20-24"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(La noche está clara. Las flores del cerezo brillan pálidas, como si tuvieran luz propia.)"},{"q":"ana","t":"De noche la Reina de las Nieves parece un fantasma, pero un fantasma bueno, de esos que cuidan las casas."},{"q":"ana","t":"(Ana se arrodilla junto a la ventana.) Gracias por el Camino Blanco de las Delicias, y por el Lago de las Aguas Brillantes, y por esta ventana. Amén."}],"disparo":"objeto","objeto":"gwin","paso":"12","canal":"ana_sola","tipo":"escena"},{"id":"ventana_13","origen":"guion","si":["estacion:verano","hora:5-11"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El sol ya está alto. En el campo de abajo, el heno se mece como un mar verde.)"},{"q":"ana","t":"Matthew dice que hay que segar antes de que llueva. Yo diría que el heno no quiere que lo sieguen: por eso baila así, para que le tengan lástima."}],"disparo":"objeto","objeto":"gwin","paso":"13","canal":"ana_sola","tipo":"escena"},{"id":"ventana_14","origen":"guion","si":["estacion:verano","hora:20-24"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Es una noche tibia. Cantan los grillos y, sobre el campo, se encienden y se apagan las luciérnagas.)"},{"q":"ana","t":"Las luciérnagas son estrellas que bajaron a jugar. Por eso se apagan de a ratos: se esconden para que las estrellas de arriba no las reten."},{"q":"ana","t":"Buenas noches, estrellas. Buenas noches, Reina de las Nieves. Buenas noches, mundo."}],"disparo":"objeto","objeto":"gwin","paso":"14","canal":"ana_sola","tipo":"escena"},{"id":"ventana_15","origen":"guion","si":["estacion:otoño"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Los arces del bosque están rojos y dorados. Unas hojas entran volando por la ventana.)"},{"q":"ana","t":"¡Oh, Marilla tendría que ver esto! Me alegra tanto vivir en un mundo donde hay octubres."},{"q":"ana","t":"Sería terrible pasar de septiembre a noviembre de un salto, ¿no es cierto?"}],"disparo":"objeto","objeto":"gwin","paso":"15","canal":"ana_sola","tipo":"escena"},{"id":"ventana_16","origen":"guion","si":["estacion:otoño","hora:15-19"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Una bandada de gansos salvajes cruza el cielo hacia el sur, en forma de punta de flecha.)"},{"q":"ana","t":"¿Adónde irán? A algún lugar con palmeras y mares tibios, seguro. Me pregunto si se acuerdan de Avonlea cuando están allá."},{"q":"ana","t":"Yo me acordaría. Avonlea es de esos lugares que uno se lleva puesto."}],"disparo":"objeto","objeto":"gwin","paso":"16","canal":"ana_sola","tipo":"escena"},{"id":"ventana_17","origen":"guion","si":["estacion:otoño","hora:19-24"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Sopla el viento y las ramas del cerezo golpean el vidrio, tac, tac.)"},{"q":"ana","t":"Es la Reina de las Nieves que pide entrar. Lo siento, Majestad: Marilla no deja entrar a nadie sin limpiarse los pies."}],"disparo":"objeto","objeto":"gwin","paso":"17","canal":"ana_sola","tipo":"escena"},{"id":"ventana_18","origen":"guion","si":["estacion:invierno","hora:6-17"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El vidrio está cubierto de helechos de escarcha. Ana sopla un círculo para poder mirar.)"},{"q":"ana","t":"Todo blanco. La Reina de las Nieves está sin flores, pero ahora tiene nieve: no hay quién le gane, se viste de blanco todo el año."},{"q":"ana","t":"Los helechos del vidrio los dibujó el Rey del Invierno durante la noche. Debe tener los dedos muy fríos."}],"disparo":"objeto","objeto":"gwin","paso":"18","canal":"ana_sola","tipo":"escena"},{"id":"ventana_19","origen":"guion","si":["estacion:invierno","hora:17-24"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(La luna brilla sobre la nieve. Todo está tan quieto que se oye crujir la casa.)"},{"q":"ana","t":"La nieve con luna parece de plata. Si una caminara por ahí ahora, dejaría huellas de plata."},{"q":"ana","t":"(Ana se mete en la cama temblando.) Bueno, mañana. Hoy me quedo con la idea, que es más tibia."}],"disparo":"objeto","objeto":"gwin","paso":"19","canal":"ana_sola","tipo":"escena"},{"id":"ventana_20","origen":"guion","si":["hora:4-6"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Todavía no amanece del todo. Sobre el bosque, el cielo se pone rosado, después dorado.)"},{"q":"ana","t":"Me gusta levantarme antes que el sol. Es como estar en el teatro antes de que suba el telón."}],"disparo":"objeto","objeto":"gwin","paso":"20","canal":"ana_sola","tipo":"escena"},{"id":"ventana_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana apoya los codos en el alféizar.) Desde esta ventana el mundo parece recién hecho, cada vez.","piensa":true}],"resumen":"Lo de todos los días con ventana: siempre hay algo que decir.","disparo":"objeto","objeto":"gwin","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"espejo_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se mira en el espejito. Una cara angosta, llena de pecas, unos ojos grandes y grises… y ese pelo.)"},{"q":"ana","t":"Si me imagino muy fuerte, el pelo es negro azabache, y yo soy Lady Cordelia Fitzgerald."},{"q":"ana","t":"(Ana cierra los ojos un momento. Los abre.) Pecas. Siguen ahí. Pero los ojos… los ojos no están tan mal."}],"disparo":"objeto","objeto":"mirror","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"espejo_2","origen":"guion","si":["hecho:se_queda"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Ana de Tejas Verdes. (Lo dice despacio, mirándose al espejo.) Ana-de-Tejas-Verdes."},{"q":"ana","t":"Suena mucho mejor que Ana de ninguna parte, ¿verdad? Creo que hasta las pecas se ven más contentas."}],"resumen":"En el espejo: «Ana de Tejas Verdes».","disparo":"objeto","objeto":"mirror","paso":"2","canal":"ana_sola","prioridad":"2","tipo":"escena"},{"id":"espejo_3","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se mira de frente, después de perfil, después de reojo, como para pillarse distraída.)"},{"q":"ana","t":"No hay caso: sigue rojo. Ni con imaginación. Puedo imaginarme casi cualquier cosa, pero el pelo rojo no hay forma de imaginármelo de otro color."}],"disparo":"objeto","objeto":"mirror","paso":"3","canal":"ana_sola","tipo":"escena"},{"id":"espejo_4","origen":"guion","si":["hecho:zanahorias"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se tira una trenza, furiosa.) Zanahorias. Así me ve todo el mundo. Así me ve él."},{"q":"ana","t":"Bueno. Que me vea así. Pero en las notas le voy a ganar. Eso no tiene color.","piensa":true}],"resumen":"En el espejo, furiosa con su pelo: «Zanahorias».","disparo":"objeto","objeto":"mirror","paso":"4","canal":"ana_sola","prioridad":"3","tipo":"escena"},{"id":"espejo_5","origen":"guion","si":["hora:19-24"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(A la luz de la vela, el espejo está oscuro y misterioso.)"},{"q":"ana","t":"Buenas noches, Lady Cordelia Fitzgerald. Tiene usted un cabello negro como el ala del cuervo y unos ojos de estrella…"},{"q":"ana","t":"(Ana suspira.) Y una nariz llena de pecas. Qué lástima, Lady Cordelia: casi la convencía."}],"disparo":"objeto","objeto":"mirror","paso":"5","canal":"ana_sola","tipo":"escena"},{"id":"espejo_6","origen":"guion","si":["estudio:ana>=30","conoce:stacy"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se mira muy seria, con la barbilla levantada.) Señorita Shirley, maestra de la escuela de Avonlea."},{"q":"ana","t":"¿Se puede ser maestra con pecas? La Srta. Stacy no tiene pecas… pero tampoco tiene imaginación roja."}],"disparo":"objeto","objeto":"mirror","paso":"6","canal":"ana_sola","tipo":"escena"},{"id":"espejo_7","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Del frío, Ana tiene las mejillas coloradas como manzanas.)"},{"q":"ana","t":"Por lo menos el invierno me da color en la cara. Rojo, claro. Todo en mí termina siendo rojo."}],"disparo":"objeto","objeto":"mirror","paso":"7","canal":"ana_sola","tipo":"escena"},{"id":"espejo_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se mira en el espejito.) Buenos días, Ana de Tejas Verdes. Hoy te ves… casi pasable. Con un poco de imaginación, bonita."}],"resumen":"Lo de todos los días con espejo: siempre hay algo que decir.","disparo":"objeto","objeto":"mirror","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"armario_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"¡Un armario! Nunca tuve un armario para mí sola. En el orfanato teníamos un clavo cada una, y a veces ni eso."},{"q":"ana","t":"Voy a imaginar que es la puerta de un castillo encantado. Aunque por ahora solo guarde un sombrero."}],"disparo":"objeto","objeto":"armario","paso":"1","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"armario_2","origen":"guion","si":["hecho:se_queda"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(En el armario cuelgan los tres vestidos que le hizo Marilla: lisos, de mangas angostas.)"},{"q":"ana","t":"Son útiles y sensatos, como dice Marilla. Voy a imaginar que uno tiene mangas abullonadas. El del medio. Así, por lo menos, tengo uno de mentira."}],"resumen":"En el armario, los tres vestidos lisos que le hizo Marilla.","disparo":"objeto","objeto":"armario","paso":"2","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"armario_3","origen":"guion","si":["estacion:otoño"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana encuentra en un rincón del armario una hoja de arce, roja, que guardó el otro día.)"},{"q":"ana","t":"Te guardo aquí, hojita. Cuando sea vieja, voy a abrir este armario y me vas a recordar este octubre."}],"disparo":"objeto","objeto":"armario","paso":"3","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"armario_4","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Del armario sale olor a lana y a lavanda: Marilla guarda allí las bolsitas para las polillas.)"},{"q":"ana","t":"Huele a invierno ordenado. Marilla hasta a las polillas las tiene a raya."}],"disparo":"objeto","objeto":"armario","paso":"4","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"armario_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Mis vestidos, en fila, como señoras esperando el carruaje. Algún día uno tendrá mangas abullonadas.","piensa":true}],"resumen":"Lo de todos los días con armario: siempre hay algo que decir.","disparo":"objeto","objeto":"armario","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"cama_1","origen":"guion","si":["hecho:primera_noche","!hecho:desayuno_prueba","!hecho:se_queda"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(La pieza del alero: paredes blancas y desnudas, una cama alta, una mesita, una silla. Ana la mira con espanto.)"},{"q":"ana","t":"(Se arranca el vestido a tirones y lo tira al suelo, con los zapatos. El sombrero lo lanza lejos: por casualidad, queda colgando de la percha. Se pone el camisón del orfanato, que le queda corto.)"},{"ef":"camison"},{"ef":"ropa_tirada"},{"ef":"ana enCama=boca_abajo"},{"q":"ana","t":"(Se tira en la cama boca abajo y llora desconsolada contra la almohada.)"},{"q":"ana","t":"Nadie me quiere. Nadie me ha querido nunca. Y ahora tampoco aquí.","piensa":true},{"ef":"entra marilla ga"},{"q":"marilla","t":"(Marilla sube con la vela. Mira la ropa tirada por el suelo, los zapatos, a la niña hecha un ovillo encima de la colcha.) Métete debajo de las sábanas como corresponde, niña."},{"q":"ana","t":"(Ana se mete bajo las sábanas sin mirarla.)"},{"ef":"ana enCama=tapada"},{"q":"marilla","t":"(Marilla mira otra vez la ropa tirada en el suelo y aprieta los labios. Esta noche no dice nada.) Buenas noches."},{"q":"ana","t":"(Ana asoma la cara, blanca, entre las sábanas.) ¿Cómo puede decir que son buenas noches, cuando sabe que tiene que ser la peor noche de toda mi vida?"},{"q":"ana","t":"(Y se vuelve a meter debajo de las sábanas, hasta la cabeza.)"},{"q":"marilla","t":"(Marilla baja la escalera despacio, con la vela, sin saber muy bien qué pensar.)"},{"ef":"sale marilla"},{"q":"ana","t":"(Esa noche, en la pieza del alero, Ana llora hasta quedarse dormida.)"},{"ef":"dormir"}],"resumen":"Ana en la pieza del alero, la primera noche: llora hasta dormirse.","disparo":"objeto","objeto":"bed","paso":"1","canal":"ana_sola","sujeta":"marilla","tipo":"escena"},{"id":"cama_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Qué cansancio tan agradable. Mañana va a ser un día con muchas posibilidades.","piensa":true}],"resumen":"Lo de todos los días con cama: siempre hay algo que decir.","disparo":"objeto","objeto":"bed","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"escalera_1","origen":"guion","si":["hecho:desayuno_prueba"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana sube la escalera empinada hasta la pieza del alero. Con la luz del día, las paredes blancas ya no le parecen tan tristes como anoche.)"},{"q":"ana","t":"Es tan blanca y tan… tan sin adornos. Pero tiene una ventana. Y una ventana es una ventana al mundo entero."}],"resumen":"Ana sube a su pieza de día: ya no le parece tan triste.","disparo":"objeto","objeto":"stairs","paso":"1","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"escalera_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Diecisiete escalones. Los cuento siempre, por si un día hay uno más y es una escalera encantada.","piensa":true}],"resumen":"Lo de todos los días con escalera: siempre hay algo que decir.","disparo":"objeto","objeto":"stairs","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"geranio_1_1","origen":"guion","si":["ve:marilla"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana se acerca a la ventana de la cocina. En una maceta, un geranio con olor a manzana, lleno de flores rojas.)"},{"q":"ana","t":"Marilla, ¿cómo se llama ese geranio?"},{"q":"marilla","t":"¿Llamarse? Es un geranio con olor a manzana. No se llama de ninguna manera."},{"q":"ana","t":"Oh, pero tiene que tener un nombre, como las personas. ¿Puedo ponerle uno, mientras esté aquí?"},{"ops":[{"t":"Bonny","propia":true,"L":[{"q":"ana","t":"Bonny. Le voy a decir Bonny. ¡Oh, déjeme, por favor!"},{"ef":"nombrar geranio"}]},{"t":"Otro nombre…","propia":false,"L":[{"q":"ana","t":"Ya sé cómo se va a llamar. ¡Oh, déjeme, por favor!"},{"ef":"nombrar geranio ?"}]}]},{"q":"marilla","t":"Por mí, como quieras. Pero ¿de qué sirve ponerle nombre a un geranio?"},{"q":"ana","t":"Me gusta que las cosas tengan nombre, aunque sean geranios. Las hace más personas. ¿Cómo sabe usted que no le duele que le digan «el geranio» y nada más?"}],"disparo":"objeto","objeto":"geranio","paso":"1.1","canal":"ana_sola","tipo":"escena"},{"id":"geranio_1_2","origen":"guion","si":["!hecho:nombro_geranio","!ve:marilla"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana mete la nariz entre las hojas del geranio de la cocina. Huele a manzana.)"},{"q":"ana","t":"Nadie te ha puesto nombre, ¿verdad? Pobrecito. Vivir sin nombre es casi tan triste como no tener a nadie."},{"ops":[{"t":"Bonny","propia":true,"L":[{"q":"ana","t":"Te voy a llamar Bonny. Mientras yo esté aquí, al menos, vas a tener nombre."},{"ef":"nombrar geranio"}]},{"t":"Otro nombre…","propia":false,"L":[{"q":"ana","t":"Te voy a poner un nombre. Mientras yo esté aquí, al menos, vas a tener uno."},{"ef":"nombrar geranio ?"}]}]}],"disparo":"objeto","objeto":"geranio","paso":"1.2","canal":"ana_sola","tipo":"escena"},{"id":"geranio_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana le toca una hoja al geranio.) Buenos días. Hoy estás más bonito que ayer, y no lo digo por cumplido."}],"resumen":"Lo de todos los días con geranio: siempre hay algo que decir.","disparo":"objeto","objeto":"geranio","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"fuego_1","origen":"guion","si":["hora:19-24"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El fuego ilumina la sala con una luz anaranjada. Afuera sopla el viento.)"},{"q":"ana","t":"Me gusta oír el viento cuando una está adentro, tibia. Es como si el invierno golpeara la puerta y nadie le abriera."}],"disparo":"objeto","objeto":"fire","paso":"1","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"fuego_2","origen":"guion","si":["estacion:otoño"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Las primeras noches frías. Huele a leña de manzano.)"},{"q":"ana","t":"El fuego de manzano huele a tarta. Bueno, a lo mejor es que tengo hambre."}],"disparo":"objeto","objeto":"fire","paso":"2","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"fuego_3","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana estira las manos hacia el fuego. Las brasas crujen y saltan chispitas.)"},{"q":"ana","t":"En el fuego se ven castillos. Ese es un castillo con torres, y esa chispa es la princesa escapándose por la ventana."}],"disparo":"objeto","objeto":"fire","paso":"3","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"fuego_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Las llamas bailan.) Si uno mira el fuego el tiempo suficiente, se ven castillos. Y a veces dragones.","piensa":true}],"resumen":"Lo de todos los días con fuego: siempre hay algo que decir.","disparo":"objeto","objeto":"fire","paso":"siempre","tambien":true,"canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"pelusa_1","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"¡Una gata! ¿Cómo te llamas? ¿Nadie te puso nombre? Entonces eres Pelusa. Pelusa de Tejas Verdes."}],"disparo":"objeto","objeto":"toby","paso":"1","tambien":true,"canal":"ana_sola","tipo":"escena"},{"id":"pelusa_2","origen":"guion","si":["estacion:verano"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Pelusa duerme al sol, panza arriba, con las patas en el aire.)"},{"q":"ana","t":"Qué manera de dormir tan sin vergüenza. Ojalá yo pudiera dormir así, sin preocuparme de lo que diría la Sra. Lynde."}],"disparo":"objeto","objeto":"toby","paso":"2","canal":"ana_sola","tambien":true,"tipo":"escena"},{"id":"pelusa_3","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Pelusa se enrosca contra las piernas de Ana, buscando calor.)"},{"q":"ana","t":"Ya, ya, gatita. Tú y yo somos de las que no tienen frío si alguien las quiere un poquito."}],"disparo":"objeto","objeto":"toby","paso":"3","canal":"ana_sola","tam
