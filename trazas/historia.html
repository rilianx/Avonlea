  const sola = ([e, c]) => enHoras(c) === 0 && !c.r.anaNo.length && !c.r.acc.length && !ambiente(e) && !['siempre'].includes(e.repetir) && !/^cada/.test(e.repetir || '') && e.tipo !== 'comentario';
  const ya = T.filter(sola).sort((a, b) => (b[0].interrumpe ? 1 : 0) - (a[0].interrumpe ? 1 : 0) || (+b[0].prioridad || 1) - (+a[0].prioridad || 1) || b[0].si.length - a[0].si.length)[0];
  if (ya && !filtro.q) {
    let h = st.fin ? `<div class="fin">FIN<br>${esc(st.fin)}<br><button id="deshacerfin">← Atrás</button></div>` : '';
    if (st.ultimo) { h += `<div class="cambios">${esc(st.ultimo)}</div>`; st.ultimo = null; }
    const [e] = ya, otras = T.filter(sola).length - 1;
    h += `<h2>Ahora pasa esto</h2><div class="esc ${e.tipo}" data-esc="${esc(e.id)}" style="font-size:16px"><div>${esc(e.resumen || e.tema || e.narra[0]?.slice(0, 160) || e.id)}${e.grande ? '<span class="badge">★ grande</span>' : ''}</div><div class="id">${esc(e.id)} · prioridad ${esc(e.prioridad || 1)}</div></div>`;
    h += `<p><button class="prim" data-esc="${esc(e.id)}">Ver la escena →</button></p>`;
    if (otras) h += `<p class="mut">(${otras} más esperan su turno: después de esta)</p>`;
    $('centro').innerHTML = h; return;
  }   // (a moment of a place or a thing: when she looks, or passes)
  const pronto = T.filter(([, c]) => enHoras(c) <= HORAS && viaje(c) <= CERCA), cerca = pronto.filter(([e]) => !ambiente(e)), momentos = lineaSiguiente(pronto.filter(([e]) => ambiente(e))), lejos = T.filter(x => !pronto.includes(x) && !ambiente(x[0]));
  const tarjeta = ([e, c]) => { const v = viaje(c), pide = [...(c.r.anaNo.length ? [c.r.anaNo.map(x => x.lejos ? x.t : 'Ana va a ' + x.lugares.map(l => LUGARES[l] || l).join(' o ')).join(' y ') + (v ? ` (${v} min a pie)` : '')] : []), ...c.r.acc.map(x => x.t)];
    return `<div class="esc ${e.tipo}" data-esc="${esc(e.id)}"><div>${esc(e.resumen || e.tema || e.narra[0]?.slice(0, 120) || e.id)}${e.grande ? '<span class="badge">★ grande</span>' : ''}${e.interrumpe ? '<span class="badge">interrumpe</span>' : ''}${e.repetir && e.repetir !== 'una_vez' ? '<span class="badge">se repite</span>' : ''}</div>`
      + (pide.length ? `<div class="sit">pide: ${esc(pide.join(' · '))}</div>` : '')
      + `<div class="id">${esc(e.id)} · prioridad ${esc(e.prioridad || 1)}${c.r.otros.length ? ' · <span class="mut">supone: ' + esc(c.r.otros.map(x => x.t).join(', ')) + '</span>' : ''}</div></div>`; };
  const porMomento = L => { let h = '', g = null; for (const x of L) { const m = momento(x[1].dia, x[1].hora); if (m !== g) { g = m; h += `<h3>${esc(m)}</h3>`; } h += tarjeta(x); } return h; };
  let h = st.fin ? `<div class="fin">FIN<br>${esc(st.fin)}<br><button id="deshacerfin">← Atrás</button></div>` : '';
  if (st.ultimo) { h += `<div class="cambios">${esc(st.ultimo)}</div>`; st.ultimo = null; }
  h += `<div class="filtros"><input type="search" id="fq" placeholder="buscar…" value="${esc(filtro.q)}"> <label><input type="checkbox" data-f="solas" ${filtro.solas ? 'checked' : ''}> solo lo que no pide nada a la jugadora</label><label><input type="checkbox" data-f="cartas" ${filtro.cartas ? 'checked' : ''}> cartas</label><label><input type="checkbox" data-f="mis" ${filtro.mis ? 'checked' : ''}> misiones</label></div>`;
  h += `<h2>Cerca de Ana, en las próximas ${HORAS} horas <span class="mut">(${cerca.length})</span></h2>`;
  h += porMomento(cerca) || `<p class="mut">Nada cerca de ${esc(LUGARES[st.donde] || st.donde)} en las próximas ${HORAS} horas.</p>`;
  if (momentos.length) h += `<details class="grupo"><summary><span class="sit">Momentos de lugares y cosas, por aquí</span> <span class="mut">(${momentos.length}: si Ana mira o pasa)</span></summary>${porMomento(momentos)}</details>`;
  if (lejos.length) h += `<details class="grupo"${cerca.length ? '' : ' open'}><summary><span class="sit">Más adelante, o más lejos</span> <span class="mut">(${lejos.length}: elegir una salta hasta ahí)</span></summary>${porMomento(lejos.slice(0, 30))}</details>`;

function pintaLado(){
