as.)"},{"q":"ana","t":"El arroyo nunca está callado. Cuenta lo que vio allá arriba, en el bosque, a todo el que pase. Es el chismoso más simpático de Avonlea."},{"q":"ana","t":"(Tira una hojita al agua y la mira irse.) Buen viaje. Saluda al mar de mi parte."}],"disparo":"lugar","lugar":"puente","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"puente_2","origen":"guion","si":["hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El puente une Tejas Verdes con La Cuesta del Huerto.)"},{"q":"ana","t":"Este es el puente más importante del mundo. Por aquí voy a ver a Diana y por aquí viene ella. Un puente entre dos amigas del alma."}],"resumen":"El puente entre Tejas Verdes y la casa de Diana.","disparo":"lugar","lugar":"puente","paso":"2","canal":"ana_sola","prioridad":"2","tipo":"escena"},{"id":"puente_3","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El arroyo está helado por los bordes; en el medio, el agua sigue corriendo, oscura y fría.)"},{"q":"ana","t":"Sigue corriendo debajo del hielo. Hay cosas así: por fuera parecen dormidas, y por dentro siguen andando."}],"disparo":"lugar","lugar":"puente","paso":"3","canal":"ana_sola","tipo":"escena"},{"id":"puente_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El arroyo corre debajo del puente.) Si uno tira un pensamiento al agua, ¿adónde llegará?","piensa":true}],"resumen":"Lo de todos los días con puente: siempre hay algo que decir.","disparo":"lugar","lugar":"puente","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"bosque_1","origen":"guion","si":["hora:6-12","!estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(De día, el Bosque Encantado está lleno de sol entre las ramas, y huele a resina y a musgo.)"},{"q":"ana","t":"Qué valiente es una a la luz del día. Los fantasmas deben estar durmiendo, enroscados bajo las raíces, como gatos."}],"disparo":"lugar","lugar":"bosque_encantado","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"bosque_2","origen":"guion","si":["hora:18-22"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El bosque de abetos se oscurece. Entre los troncos, la niebla se arrastra como un chal blanco.)"},{"q":"ana","t":"Aquí es donde pasa la dama blanca, retorciéndose las manos… Diana y yo la inventamos, ya lo sé. Pero los bosques no saben que las cosas son inventadas."},{"q":"ana","t":"(Ana apura el paso, sin mirar atrás.) Mañana de día me río de esto. Ahora no."}],"disparo":"lugar","lugar":"bosque_encantado","paso":"2","canal":"ana_sola","tipo":"escena"},{"id":"bosque_3","origen":"guion","si":["estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(La nieve cubre las ramas de los abetos. No se oye nada, ni un pájaro.)"},{"q":"ana","t":"El bosque está guardando silencio, como en la iglesia. Me parece que está rezando por la primavera."}],"disparo":"lugar","lugar":"bosque_encantado","paso":"3","canal":"ana_sola","tipo":"escena"},{"id":"bosque_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"El Bosque Encantado está tranquilo hoy. Los fantasmas que inventamos deben estar durmiendo.","piensa":true}],"resumen":"Lo de todos los días con bosque: siempre hay algo que decir.","disparo":"lugar","lugar":"bosque_encantado","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"lago_brillante_1","origen":"guion","si":["hora:5-9","!estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Sobre el lago flota una niebla delgada. Un pato sale de ella como de un sueño.)"},{"q":"ana","t":"Si una se quedara quieta aquí el tiempo suficiente, vería salir de la niebla a la dama de Shalott en su barca. Bueno, o al pato de nuevo."}],"disparo":"lugar","lugar":"lago","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"lago_brillante_2","origen":"guion","si":["estacion:verano","hora:12-18"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El sol hace brillar el agua en mil puntitos. Los sauces de la orilla mojan las puntas de sus ramas.)"},{"q":"ana","t":"Los sauces se agachan a mirarse el pelo en el agua. Me caen bien: también son un poco vanidosos."}],"disparo":"lugar","lugar":"lago","paso":"2","canal":"ana_sola","tipo":"escena"},{"id":"lago_brillante_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"El Lago de las Aguas Brillantes brilla, como prometió su nombre. Me gusta que las cosas cumplan.","piensa":true}],"resumen":"Lo de todos los días con lago brillante: siempre hay algo que decir.","disparo":"lugar","lugar":"lago","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"huerta_1","origen":"guion","si":["estacion:primavera","dias_desde:regado:2"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(En la tierra oscura asoman unos brotes verdes, tan chiquitos que casi no se ven.)"},{"q":"ana","t":"¡Salieron! Toda la noche estuvieron empujando para arriba, sin que nadie las viera. Eso sí que es fe."}],"disparo":"lugar","lugar":"huerta","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"huerta_2","origen":"guion","si":["estacion:verano","hecho:regado"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Las flores de la huerta están abiertas y zumban las abejas. Huele a tierra tibia.)"},{"q":"ana","t":"Cuando regué estas flores no eran nada. Ahora mírenlas: se creen las reinas del verano. Y tienen razón."}],"disparo":"lugar","lugar":"huerta","paso":"2","canal":"ana_sola","tipo":"escena"},{"id":"huerta_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"La huerta huele a tierra mojada. Todo lo que está ahí abajo está decidiendo qué va a ser.","piensa":true}],"resumen":"Lo de todos los días con huerta: siempre hay algo que decir.","disparo":"lugar","lugar":"huerta","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"cuesta_del_huerto_1","origen":"guion","si":["estacion:primavera","hecho:conocidas_diana"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El huerto de los Barry está en flor. Detrás de esas ventanas está Diana.)"},{"q":"ana","t":"Debe ser imposible estar triste viviendo en una casa con un huerto así. Aunque Diana dice que su mamá lo consigue igual."}],"resumen":"El huerto de los Barry en flor: ahí vive Diana.","disparo":"lugar","lugar":"cuesta_del_huerto","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"cuesta_del_huerto_2","origen":"guion","si":["hecho:prohibida","!hecho:perdonada"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana pasa frente a La Cuesta del Huerto sin detenerse. Le parece ver una cortina que se mueve.)"},{"q":"ana","t":"No voy a mirar, para no ponerla en un aprieto. Pero voy a caminar despacito, para que sepa que pasé.","piensa":true}],"resumen":"Ana pasa frente a la casa de Diana sin detenerse.","disparo":"lugar","lugar":"cuesta_del_huerto","paso":"2","canal":"ana_sola","prioridad":"3","tipo":"escena"},{"id":"cuesta_del_huerto_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"La Cuesta del Huerto. Los manzanos se inclinan sobre el camino como si saludaran.","piensa":true}],"resumen":"Lo de todos los días con cuesta del huerto: siempre hay algo que decir.","disparo":"lugar","lugar":"cuesta_del_huerto","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"rio_1","origen":"guion","si":["!estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(En el río, junto a la escuela, se enfrían las botellas de leche de los alumnos, atadas con cordel.)"},{"q":"ana","t":"El río nos guarda la leche fresca toda la mañana, sin pedir nada a cambio. Es el compañero de curso más generoso."}],"disparo":"lugar","lugar":"rio","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"rio_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"El río va a la escuela todos los días, igual que nosotros, pero nunca llega tarde.","piensa":true}],"resumen":"Lo de todos los días con rio: siempre hay algo que decir.","disparo":"lugar","lugar":"rio","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"iglesia_1","origen":"guion","si":["!estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Junto a la iglesia, el cementerio viejo está lleno de lápidas cubiertas de líquenes, y de rosas silvestres.)"},{"q":"ana","t":"Las rosas crecen aquí como si quisieran hacerles compañía a los que duermen. Es lo más tierno que hace una rosa."}],"disparo":"lugar","lugar":"iglesia","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"iglesia_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"La iglesia blanca entre los árboles. Los domingos parece más alta.","piensa":true}],"resumen":"Lo de todos los días con iglesia: siempre hay algo que decir.","disparo":"lugar","lugar":"iglesia","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"granero_1","origen":"guion","si":["!estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Del granero sale olor a heno recién cortado. Una golondrina entra y sale por la ventanita del pajar.)"},{"q":"ana","t":"El heno huele a todo el verano junto, guardado. En invierno voy a venir a olerlo cuando extrañe el sol."}],"disparo":"lugar","lugar":"granero","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"granero_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Huele a heno.) El granero es el mejor lugar del mundo para esconderse a pensar.","piensa":true}],"resumen":"Lo de todos los días con granero: siempre hay algo que decir.","disparo":"lugar","lugar":"granero","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"escuela_abedules_1","origen":"guion","si":["hora:7-10"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El camino a la escuela pasa entre abedules blancos. La luz entra verde por las hojas.)"},{"q":"ana","t":"Ir a la escuela por aquí es casi como no ir a la escuela. Una llega con el alma ya instruida, aunque la gramática no."}],"disparo":"lugar","lugar":"escuela","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"escuela_abedules_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Los abedules de la escuela parecen muchachas en fila, esperando que toquen la campana.","piensa":true}],"resumen":"Lo de todos los días con escuela abedules: siempre hay algo que decir.","disparo":"lugar","lugar":"escuela","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"corral_1","origen":"guion","si":["!estacion:invierno","hecho:conocidas_diana"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Junto al corral, cuatro abedules forman un rincón, como una salita al aire libre.)"},{"q":"ana","t":"Idlewild. Aquí Diana y yo vamos a tener nuestra casita de juegos, con platos rotos de porcelana como si fueran la mejor vajilla."}],"resumen":"Los abedules junto al corral: un rincón para jugar con Diana.","disparo":"lugar","lugar":"corral","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"corral_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Las vacas rumian, muy serias.) Deben estar pensando en algo importantísimo. O en pasto.","piensa":true}],"resumen":"Lo de todos los días con corral: siempre hay algo que decir.","disparo":"lugar","lugar":"corral","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"campo_rosado_1","origen":"guion","si":["!estacion:invierno"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(El campo está cubierto de flores rosadas que se mecen todas juntas cuando pasa el viento.)"},{"q":"ana","t":"¡Todo el campo se volvió rosado! Parece que la tierra se ruborizó porque alguien le dijo un cumplido."},{"q":"ana","t":"Me dan ganas de llorar de lo lindo. No de pena: de esas lágrimas que salen cuando a una le queda chico el corazón."}],"disparo":"lugar","lugar":"campo_rosado","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"campo_rosado_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"El campo de tréboles. Si encontrara uno de cuatro hojas, ¿qué pediría? Mejor no saberlo, así puedo pedir todo.","piensa":true}],"resumen":"Lo de todos los días con campo rosado: siempre hay algo que decir.","disparo":"lugar","lugar":"campo_rosado","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"aldea_1","origen":"guion","si":["hora:8-18","dias_desde:llegada_tv:10"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(En el cruce de caminos, la gente se saluda de carreta a carreta. Un perro duerme al sol frente a la tienda.)"},{"q":"ana","t":"Aquí todos saben todo de todos. Al principio me daba miedo; ahora me gusta. Es como vivir dentro de una familia muy grande y un poco metida."}],"resumen":"El cruce de caminos de la aldea, ya conocido.","disparo":"lugar","lugar":"aldea","paso":"1","canal":"ana_sola","tipo":"escena"},{"id":"aldea_siempre","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"En la aldea todos se saludan. Aquí nadie es un desconocido mucho tiempo.","piensa":true}],"resumen":"Lo de todos los días con aldea: siempre hay algo que decir.","disparo":"lugar","lugar":"aldea","paso":"siempre","canal":"ana_sola","repetir":"dia","a_prueba":true,"tipo":"escena"},{"id":"mis_brujula_hallazgo","origen":"guion","si":["hecho:se_queda","hora:9-18","!hecho:mis_brujula_hallada"],"o":[],"empieza":["hecho mis_brujula_hallada","log Ana encontró en el lago una brújula vieja con una dedicatoria. | yo: Encontré una brújula en el lago. Dice «A Jim, de J. A. H.». Alguien la perdió… o la tiró."],"termina":[],"narra":["En la orilla del Lago de las Aguas Brillantes, entre los juncos, algo brilla en el barro. Ana se agacha: es una brújula de bronce, verde de tiempo, con la tapa grabada."],"L":[{"q":"ana","t":"«A Jim, de J. A. H. — para que siempre encuentres el camino de vuelta». La aguja todavía tiembla. ¡Todavía busca el norte, después de quién sabe cuántos años en el agua!","piensa":true},{"ops":[{"t":"Limpiarla con el delantal y guardarla","propia":true,"L":[{"q":"ana","t":"Una brújula que alguien regaló con esas palabras no se tira al lago por descuido. Voy a averiguar de quién es. Una no puede dejar un camino de vuelta tirado en el barro.","piensa":true}]},{"t":"Dejarla donde estaba","propia":false,"L":[{"q":"ana","t":"(Ana la deja otra vez entre los juncos, pero no da tres pasos antes de volver por ella.) No. No puedo. Me miraría desde el barro toda la noche.","piensa":true}]}]}],"resumen":"Misión: Ana encuentra una brújula vieja en la orilla del lago.","canal":"mision","prioridad":"3","en":"ana=out","cerca":"ana, lago, 620","tipo":"mision"},{"id":"conv_marilla_perdon","origen":"conversacion","si":["hecho:inicio_juego","!hecho:a_prueba","paciencia:marilla:ana\u003c=1"],"o":[],"empieza":[],"termina":["suma paciencia:marilla:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla… quería pedirle perdón. Sé que no me he portado como debía. No es que quiera ser mala: es que a veces se me olvida ser buena."},{"q":"marilla","t":"(Marilla la mira un largo rato, con los labios apretados.) Bueno. Pedir perdón es un comienzo. Lo que importa es lo que hagas después."}],"a_prueba":true,"con":"marilla","tema":"Pedirle perdón por portarse mal","resumen":"Ana le pide perdón por portarse mal; Marilla: pedir perdón es un comienzo, importa lo que haga después.","repetir":"dia","prioridad":"2","tipo":"conversacion"},{"id":"conv_marilla_e","origen":"conversacion","si":["afecto:marilla:ana>=2"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Marilla, usted se acuerda de que es Ana con una sola n, ¿verdad?"},{"q":"marilla","t":"¿Qué diferencia hay, si se pronuncia igual?"},{"q":"ana","t":"¡Oh, mucha! Cuando oye un nombre, ¿no lo ve escrito en su cabeza, como impreso? Yo sí. A-n-n-a se ve horrible, todo amontonado; pero A-n-a… se ve tan limpio y distinguido."},{"q":"marilla","t":"(Marilla aprieta los labios, pero casi sonríe.) Está bien. Ana con una sola n, entonces."}],"a_prueba":true,"con":"marilla","tema":"Explicarle por qué es «Ana con una sola n»","resumen":"Ana explica por qué su nombre se escribe con una sola n; Marilla acepta, casi sonriendo.","tipo":"conversacion"},{"id":"conv_marilla_oraciones","origen":"conversacion","si":["afecto:marilla:ana>=2","!hecho:se_queda"],"o":[],"empieza":[],"termina":["suma afecto:marilla:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla… tengo que confesarle algo. Nunca he dicho mis oraciones. La Sra. Thomas decía que Dios me había hecho el pelo rojo a propósito, y desde entonces no me interesó mucho."},{"q":"marilla","t":"(Marilla se queda de una pieza.) Mientras vivas bajo mi techo, Ana, vas a rezar. Todas las noches, junto a la cama."},{"q":"ana","t":"Lo haré, si usted quiere. Pero ¿qué tengo que decir?"},{"q":"marilla","t":"Dale gracias a Dios por lo que tienes, y pídele humildemente lo que quieres."},{"q":"ana","t":"(Ana lo piensa con mucha seriedad.) Entonces le voy a dar gracias por el Camino Blanco de las Delicias y el Lago de las Aguas Brillantes. Y le voy a pedir quedarme en Tejas Verdes… y ser bonita cuando sea grande."},{"q":"marilla","t":"(Marilla tiene que darse vuelta para que Ana no la vea reír.) Bueno… es un comienzo."}],"a_prueba":true,"con":"marilla","tema":"Confesarle que nunca aprendió a rezar","resumen":"Ana confiesa que nunca ha rezado; Marilla le enseña a dar gracias y pedir con humildad.","tipo":"conversacion"},{"id":"conv_marilla_hablar","origen":"conversacion","si":["afecto:marilla:ana>=2"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Marilla, hoy imaginé que el arroyo era un río de plata que llevaba cartas a la reina, y que yo era la mensajera, y…"},{"q":"marilla","t":"Ana, hablas demasiado. ¿Por qué no te quedas callada un rato?"},{"q":"ana","t":"Lo intento, Marilla, de verdad. Pero las cosas se me amontonan adentro y tienen que salir. ¿Prefiere que me calle del todo?"},{"q":"marilla","t":"(Marilla suspira.) No he dicho eso. Habla… pero de vez en cuando, piensa antes."}],"a_prueba":true,"con":"marilla","tema":"Contarle todo lo que imaginó hoy","resumen":"Ana cuenta lo que imaginó; Marilla le dice que habla demasiado, pero que hable pensando antes.","tipo":"conversacion"},{"id":"conv_marilla_errores","origen":"conversacion","si":["afecto:marilla:ana>=2","dia_juego:3"],"o":[],"empieza":[],"termina":["suma letras:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla, ¿no es bonito pensar que mañana es un día nuevo, sin ningún error todavía?"},{"q":"marilla","t":"Te garantizo que vas a cometer varios antes de la noche."},{"q":"ana","t":"Sí, ya lo sé. Pero ¿se ha dado cuenta de algo alentador? Nunca cometo el mismo error dos veces."},{"q":"marilla","t":"No sé de qué sirve eso, si siempre estás inventando errores nuevos."},{"q":"ana","t":"Bueno, alguna vez se me tendrán que acabar. Es una idea muy consoladora."}],"a_prueba":true,"con":"marilla","tema":"Decirle algo que pensó sobre el día de mañana","resumen":"Mañana es un día sin errores; Ana nunca repite un error, Marilla: siempre inventa nuevos.","tipo":"conversacion"},{"id":"conv_marilla_por_que","origen":"conversacion","si":["afecto:marilla:ana>=3","hecho:se_queda"],"o":[],"empieza":[],"termina":["suma afecto:marilla:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla… ¿por qué se quedaron conmigo, si querían un niño?"},{"q":"marilla","t":"(Marilla deja la costura.) Matthew lo quiso desde que te vio en la estación. Y yo…"},{"q":"ana","t":"¿Y usted?"},{"q":"marilla","t":"Yo pensé que alguien tenía que hacerse cargo de ti. Y que nadie lo haría mejor que yo… aunque no lo parezca."},{"q":"ana","t":"Oh, Marilla. Voy a ser tan buena que nunca se va a arrepentir. Bueno… voy a intentarlo con todas mis fuerzas."},{"q":"marilla","t":"Con eso basta."}],"con":"marilla","tema":"Preguntarle por qué se quedaron con ella","resumen":"Por qué se quedaron con ella: Matthew la quiso al verla; Marilla, que nadie la cuidaría mejor.","tipo":"conversacion"},{"id":"conv_marilla_vestidos","origen":"conversacion","si":["afecto:marilla:ana>=3","hecho:a_prueba","dia_juego:4"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Marilla, los vestidos que me hizo son muy… prácticos. Pero ¿no podría tener uno, solo uno, con mangas abullonadas?"},{"q":"marilla","t":"Las mangas abullonadas son ridículas. Parecen globos."},{"q":"ana","t":"Lo sé. Pero preferiría parecer ridícula como todas que práctica yo sola."},{"q":"marilla","t":"(Marilla resopla.) Los vestidos sencillos son para niñas sensatas. Ya veremos qué niña eres."},{"ops":[{"t":"Imaginar que los vestidos sí tienen mangas abullonadas","propia":true,"L":[{"q":"ana","t":"Bueno… entonces voy a imaginar que las tienen. Es casi lo mismo. Casi."},{"q":"marilla","t":"(Marilla mueve la cabeza, pero se le escapa media sonrisa.)"},{"ef":"suma letras:ana 1"}]},{"t":"Aceptarlo con buena cara","propia":false,"L":[{"q":"ana","t":"Tiene razón, Marilla. Le agradezco los vestidos. De verdad."},{"q":"marilla","t":"(Marilla parpadea, sorprendida.) Bueno. Eso está mejor."},{"ef":"suma afecto:marilla:ana 1"}]},{"t":"Insistir un poquito más","propia":false,"L":[{"q":"ana","t":"¿Ni siquiera unas mangas pequeñitas? ¿Unas mangas abullonadas modestas?"},{"q":"marilla","t":"Ana. No."}]}]}],"con":"marilla","tema":"Hablarle de las mangas abullonadas","resumen":"Ana pide un vestido con mangas abullonadas; Marilla las encuentra ridículas.","tipo":"conversacion"},{"id":"conv_marilla_cocina","origen":"conversacion","si":["afecto:marilla:ana>=3"],"o":[],"empieza":[],"termina":["suma granja:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla, ¿me enseña a hacer un pastel? Uno de verdad, no de mi imaginación."},{"q":"marilla","t":"Primero, a medir bien. Una taza es una taza, no «más o menos una taza»."},{"q":"ana","t":"(Ana mide la harina con una seriedad solemne.) Una taza. Exactamente una. Ni un granito más."},{"q":"marilla","t":"Y no te pongas a soñar mientras se cuece, que se te quema."},{"q":"ana","t":"Le prometo vigilarlo con los ojos y con el alma, Marilla."}],"a_prueba":true,"con":"marilla","tema":"Pedirle que le enseñe a cocinar","resumen":"Marilla le enseña a hacer un pastel: medir bien y no soñar mientras se cuece.","se_hace_en":"gg","tipo":"conversacion"},{"id":"conv_marilla_diana","origen":"conversacion","si":["hecho:se_queda","afecto:marilla:ana>=3","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Marilla, Diana es la amiga más perfecta del mundo. Tiene los ojos negros y la risa como un arroyo, y le gustan las mismas cosas que a mí. Bueno, casi."},{"q":"marilla","t":"Me alegro. Pero no la canses con tus discursos."},{"q":"ana","t":"Ella dice que le encantan mis discursos. ¡Me lo juró!"},{"q":"marilla","t":"(Marilla mueve la cabeza.) Entre las dos van a terminar en un libro."}],"con":"marilla","tema":"Contarle cómo es Diana","resumen":"Ana le describe a Diana, su amiga perfecta; Marilla le pide no cansarla con discursos.","tipo":"conversacion"},{"id":"conv_marilla_genio","origen":"conversacion","si":["afecto:marilla:ana>=4","dia_juego:10"],"o":[],"empieza":[],"termina":["suma afecto:marilla:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla, ¿usted también se enojaba así cuando era chica? ¿Como yo, que me sube todo a la cara de golpe?"},{"q":"marilla","t":"Tenía mi genio, sí. Pero aprendí que lo que se dice con rabia no se puede desdecir."},{"q":"ana","t":"Es que cuando me dicen «zanahoria» o «flaca», algo se me enciende adentro, como una estufa."},{"q":"marilla","t":"Entonces cuenta hasta diez antes de abrir la boca. Y si a los diez sigues ardiendo, cuenta hasta cien."},{"q":"ana","t":"¡Hasta cien! Para entonces ya me habré olvidado de lo que iba a decir."},{"q":"marilla","t":"Esa es la idea."}],"con":"marilla","tema":"Preguntarle cómo se controla el genio","resumen":"Cómo controlar el genio: Marilla también lo tuvo; contar hasta diez, o hasta cien.","tipo":"conversacion"},{"id":"conv_marilla_queens","origen":"conversacion","si":["afecto:marilla:ana>=4","estudio:ana>=20","dia_juego:10","conoce:stacy"],"o":[],"empieza":[],"termina":["suma estudio:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla, la Srta. Stacy dice que podría dar el examen de Queen's. Pero cuesta tanto…"},{"q":"marilla","t":"Matthew y yo lo hablamos. Si quieres ir, Ana, vas a ir. Una mujer tiene que poder ganarse la vida, haya o no necesidad."},{"q":"ana","t":"(Ana se queda sin palabras, cosa rara.) Oh, Marilla… voy a estudiar como nunca nadie ha estudiado."},{"q":"marilla","t":"No te enfermes estudiando. Con estudiar bien basta."}],"con":"marilla","tema":"Hablarle de ir a Queen's","resumen":"Marilla y Matthew deciden que Ana irá a Queen's: una mujer debe poder ganarse la vida.","tipo":"conversacion"},{"id":"conv_marilla_john","origen":"conversacion","si":["afecto:marilla:ana>=5","hecho:zanahorias","dia_juego:28"],"o":[],"empieza":[],"termina":["suma afecto:marilla:ana 1"],"narra":[],"L":[{"q":"ana","t":"Marilla, encontré una foto vieja en el cajón. Hay un muchacho muy guapo junto a usted. ¿Quién es?"},{"q":"marilla","t":"(Marilla toma la foto y se queda callada un rato largo.) John Blythe. El padre de Gilbert."},{"q":"ana","t":"¿El padre de Gilbert? ¿Y usted… y él…?"},{"q":"marilla","t":"Éramos muy buenos amigos. La gente decía que éramos novios. Nos peleamos, y yo no quise perdonarlo cuando me lo pidió. Quería castigarlo un poco."},{"q":"ana","t":"¿Y después?"},{"q":"marilla","t":"Después ya no volvió. (Marilla guarda la foto.) Siempre me he arrepentido un poco, Ana. No dejes que el orgullo te gane, como a mí."}],"con":"marilla","tema":"Preguntarle por una foto vieja que encontró","resumen":"Una foto de John Blythe: Marilla cuenta que no lo perdonó y se arrepiente.","tipo":"conversacion"},{"id":"conv_marilla_quedarse","origen":"conversacion","si":["afecto:marilla:ana>=5","dia_juego:14","hora:19-23"],"o":[],"empieza":[],"termina":["acostarse"],"narra":[],"L":[{"q":"ana","t":"Buenas noches, Marilla."},{"q":"marilla","t":"Buenas noches, Ana. (Marilla duda un momento.) Ana…"},{"q":"ana","t":"¿Sí?"},{"q":"marilla","t":"Nada. Que me alegro de que te hayas quedado. Eso es todo. A la cama."},{"q":"ana","t":"(Ana sube la escalera dando saltitos y no deja de sonreír hasta que se duerme.)"}],"con":"marilla","tema":"Darle las buenas noches","resumen":"Buenas noches: Marilla, sin decirlo del todo, se alegra de que Ana se haya quedado.","tipo":"conversacion"},{"id":"conv_matthew_flores","origen":"conversacion","si":["afecto:matthew:ana>=2"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"¡Matthew! ¿Ha visto las violetas a la orilla del camino? ¿No le parecen como pedacitos de cielo que se cayeron?"},{"q":"matthew","t":"Bueno, pues… sí. Ahora que lo dices, sí."},{"q":"ana","t":"Usted siempre me entiende. Es tan agradable hablar con alguien que entiende."},{"q":"matthew","t":"(Matthew se pone colorado hasta las orejas, pero sonríe.)"}],"a_prueba":true,"con":"matthew","tema":"Contarle de las violetas del camino","resumen":"Las violetas del camino como pedacitos de cielo; Matthew siempre la entiende.","tipo":"conversacion"},{"id":"conv_matthew_nombres","origen":"conversacion","si":["afecto:matthew:ana>=2","hecho:nombro_avenida","hecho:nombro_lago","!dicha:nombra_avenida"],"o":[],"empieza":[],"termina":["suma letras:ana 1"],"narra":[],"L":[{"q":"ana","t":"Matthew, ¿sabía que la avenida de los manzanos se llama ahora el Camino Blanco de las Delicias? Y el estanque de los Barry, el Lago de las Aguas Brillantes."},{"q":"matthew","t":"¿Ah, sí? ¿Y quién les puso así?"},{"q":"ana","t":"¡Yo! Me pareció que se merecían nombres más bonitos. ¿No le parece?"},{"q":"matthew","t":"Bueno, pues… me parece muy bien. Ya me acostumbraré."},{"q":"ana","t":"Y el cerezo de mi ventana es la Reina de las Nieves. Ya lo conoce."},{"q":"matthew","t":"Je. Le queda bien."}],"a_prueba":true,"con":"matthew","tema":"Contarle los nombres que les puso a los lugares","resumen":"Ana le cuenta los nombres nuevos que puso a los lugares; Matthew se acostumbrará.","tipo":"conversacion"},{"id":"conv_matthew_estrellas","origen":"conversacion","si":["afecto:matthew:ana>=3","hora:19-23"],"o":[],"empieza":[],"termina":["suma afecto:matthew:ana 1"],"narra":[],"L":[{"q":"ana","t":"(Ana se sienta junto a Matthew. Por la ventana se ven salir las primeras estrellas.)"},{"q":"ana","t":"Matthew, ¿usted cree que en alguna estrella hay una niña como yo, mirando para acá?"},{"q":"matthew","t":"Bueno, pues… podría ser. Yo nunca lo pensé."},{"q":"ana","t":"Me gusta pensarlo. Así nadie está nunca del todo solo."},{"q":"matthew","t":"(Matthew no dice nada. Pero se queda ahí con ella un buen rato, mirando las estrellas.)"}],"a_prueba":true,"con":"matthew","tema":"Sentarse con él a mirar el cielo","resumen":"Mirando las estrellas: quizás en una hay otra niña mirando; nadie está del todo solo.","tipo":"conversacion"},{"id":"conv_matthew_mangas","origen":"conversacion","si":["afecto:matthew:ana>=3","cuaderno:escuela_dominical"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Matthew… ¿se fijó en los vestidos de las otras niñas en la escuela dominical? Todas tienen mangas abullonadas. Todas, menos yo."},{"q":"matthew","t":"¿Mangas… abullonadas?"},{"q":"ana","t":"Infladas, aquí arriba, así. Son lo más elegante del mundo. Pero Marilla dice que son ridículas."},{"q":"matthew","t":"(Matthew se rasca la barbilla y mira a Ana un buen rato, pensativo.) Hm. Ya veo."}],"con":"matthew","tema":"Contarle que todas tienen mangas abullonadas","resumen":"Todas las niñas tienen mangas abullonadas menos Ana; Matthew se queda pensando.","tipo":"conversacion"},{"id":"conv_matthew_defensa","origen":"conversacion","si":["afecto:matthew:ana>=3"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Matthew, ¿usted cree que soy una cabeza de chorlito? A veces Marilla me mira como si lo pensara, y se le escapa un suspiro."},{"q":"matthew","t":"Bueno, pues… Marilla es muy buena, ¿sabes? Muy buena. Pero tú… tú haz lo que ella dice, y cuando no puedas, me lo cuentas a mí."},{"q":"ana","t":"¿Usted cree que algún día voy a ser como ella quiere?"},{"q":"matthew","t":"Yo creo que ya eres bastante buena así. Pero no le digas que te lo dije."}],"a_prueba":true,"con":"matthew","tema":"Preguntarle si es una cabeza de chorlito","resumen":"¿Es una cabeza de chorlito? Matthew la defiende: ya es bastante buena así.","tipo":"conversacion"},{"id":"conv_matthew_huerta","origen":"conversacion","si":["afecto:matthew:ana>=3","!estacion:invierno"],"o":[],"empieza":[],"termina":["suma granja:ana 1","cosa ana semillas 1"],"narra":[],"L":[{"q":"ana","t":"Matthew, ¿me enseña a sembrar? Quiero hacerlo bien, no a mi manera. Y quiero tener un huertito mío, chiquito."},{"q":"matthew","t":"(Matthew se agacha junto a la tierra y hace un surco con el dedo.) Bueno, pues… un surco así, ¿ves? No muy hondo. Y una semilla cada tanto, no todas juntas."},{"q":"ana","t":"(Ana pone las semillas una por una, contándolas en voz alta.) …siete, ocho, nueve. ¡Ya están acostadas! ¿Mañana salen?"},{"q":"matthew","t":"Je. No, no… Agua todos los días, y paciencia. Unas dos semanas para que asomen las hojas, y más para las flores. Las cosas que crecen se demoran, ¿sabes?"},{"q":"matthew","t":"(Saca del bolsillo un sobrecito de papel doblado.) Toma. Capuchinas. Para tu huertito… donde tú quieras."},{"q":"ana","t":"¡Donde yo quiera! Oh, Matthew, es el regalo más lleno de futuro que me han hecho nunca."}],"a_prueba":true,"con":"matthew","tema":"Pedirle que le enseñe a sembrar","resumen":"Matthew le enseña a sembrar y le regala semillas de capuchina para su huertito.","se_hace_en":"huertito, huerta","tipo":"conversacion"},{"id":"conv_matthew_mujeres","origen":"conversacion","si":["afecto:matthew:ana>=3"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Matthew, ¿es verdad que a usted le dan miedo todas las mujeres?"},{"q":"matthew","t":"Bueno, pues… todas no. Marilla no. Y tú tampoco."},{"q":"ana","t":"¿Y la Sra. Lynde?"},{"q":"matthew","t":"(Matthew se queda pensando.) Un poco. Sí. Un poco."},{"q":"ana","t":"¡A mí también! Somos espíritus afines, Matthew."}],"a_prueba":true,"con":"matthew","tema":"Preguntarle por qué le dan miedo las señoras","resumen":"A Matthew le dan miedo las señoras, pero no Marilla ni Ana; la Sra. Lynde, un poco.","tipo":"conversacion"},{"id":"conv_matthew_queens","origen":"conversacion","si":["afecto:matthew:ana>=4","estudio:ana>=20","dia_juego:10","conoce:stacy"],"o":[],"empieza":[],"termina":["suma estudio:ana 1"],"narra":[],"L":[{"q":"ana","t":"Matthew, hoy saqué la mejor nota en composición. ¡Le gané a Gilbert Blythe!"},{"q":"matthew","t":"¿Ah, sí? Bueno, pues… yo sabía. Siempre supe que eras lista."},{"q":"ana","t":"La Srta. Stacy dice que podría ir a Queen's."},{"q":"matthew","t":"Entonces vas a ir. No te preocupes por nada más. Yo me encargo."}],"con":"matthew","tema":"Contarle cómo le fue en la escuela","resumen":"Ana sacó la mejor nota y le ganó a Gilbert; Matthew: irá a Queen's, él se encarga.","tipo":"conversacion"},{"id":"conv_matthew_docena","origen":"conversacion","si":["afecto:matthew:ana>=5","dia_juego:28"],"o":[],"empieza":[],"termina":["suma afecto:matthew:ana 1"],"narra":[],"L":[{"q":"ana","t":"Matthew… si yo hubiera sido el niño que esperaban, le habría ayudado mucho más en la granja. ¿No habría preferido un niño?"},{"q":"matthew","t":"Bueno, pues… nunca quise a nadie más que a ti, Ana. Prefiero tenerte a ti que a una docena de muchachos."},{"q":"ana","t":"(Ana no sabe qué decir. Le da un beso en la mejilla, y Matthew se pone rojo como un tomate.)"},{"q":"matthew","t":"Mi niña. Mi niña de la que estoy orgulloso."}],"con":"matthew","tema":"Preguntarle si no habría preferido un niño","resumen":"Ana pregunta si habría preferido un niño; Matthew: la prefiere a una docena de muchachos.","tipo":"conversacion"},{"id":"conv_diana_pelo","origen":"conversacion","si":["hecho:se_queda","afecto:diana:ana>=2","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Diana, ¿tú sabes lo que es tener el pelo rojo? Es una pena para toda la vida."},{"q":"diana","t":"A mí me parece bonito tu pelo, Ana."},{"q":"ana","t":"Eres demasiado buena. Daría cualquier cosa por tener el pelo negro como el tuyo, como el ala de un cuervo."},{"q":"diana","t":"Y yo daría cualquier cosa por tener tu imaginación. Así estamos a mano."}],"con":"diana","tema":"Decirle cuánto le envidia el pelo","resumen":"Ana envidia el pelo negro de Diana; Diana envidia su imaginación.","tipo":"conversacion"},{"id":"conv_diana_minnie","origen":"conversacion","si":["hecho:se_queda","afecto:diana:ana>=2","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"¿Cómo está Minnie May?"},{"q":"diana","t":"Pesada, como siempre. Quiere ir a todas partes conmigo. Pero la quiero mucho."},{"q":"ana","t":"Yo cuidé a tres pares de mellizos de la Sra. Hammond. Créeme que una hermanita es un regalo, aunque a veces no lo parezca."},{"q":"diana","t":"¡Tres pares! Ana, has vivido tanto."}],"con":"diana","tema":"Preguntarle por su hermanita","resumen":"Minnie May es pesada pero querida; Ana cuidó tres pares de mellizos.","tipo":"conversacion"},{"id":"conv_diana_nombres","origen":"conversacion","si":["hecho:se_queda","afecto:diana:ana>=2","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":["suma letras:ana 1"],"narra":[],"L":[{"q":"ana","t":"Diana, ese sendero entre los abedules necesita un nombre. ¿Qué te parece…"},{"ops":[{"t":"el Paseo de los Enamorados","propia":true,"L":[{"q":"ana","t":"…el Paseo de los Enamorados?"},{"ef":"nombrar senda"}]},{"t":"Otro nombre…","propia":false,"L":[{"q":"ana","t":"…el Paseo de los Enamorados?"},{"ef":"nombrar senda ?"}]}]},{"q":"diana","t":"¡Ana! Pero si por ahí no pasea ningún enamorado."},{"q":"ana","t":"Por eso. Hay que imaginarlos. Y el manantial junto al arroyo…"},{"ops":[{"t":"la Burbuja de la Dríade","propia":true,"L":[{"q":"ana","t":"…la Burbuja de la Dríade."},{"ef":"nombrar burbuja"}]},{"t":"Otro nombre…","propia":false,"L":[{"q":"ana","t":"…la Burbuja de la Dríade."},{"ef":"nombrar burbuja ?"}]}]},{"q":"diana","t":"(Diana se ríe.) Contigo hasta los charcos tienen nombre."},{"q":"ana","t":"Los charcos también se lo merecen."}],"con":"diana","tema":"Inventar nombres para los lugares con ella","resumen":"Inventan nombres para los lugares (el Paseo de los Enamorados).","tipo":"conversacion"},{"id":"conv_diana_escuela","origen":"conversacion","si":["hecho:se_queda","afecto:diana:ana>=2","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"diana","t":"¿Te gusta la escuela, Ana?"},{"q":"ana","t":"Me gusta aprender. Lo que no me gusta es la geometría. Es lo menos imaginativo que hay en el mundo."},{"q":"diana","t":"A mí me cuesta la ortografía. Siempre me equivoco en las mismas palabras."},{"q":"ana","t":"Hagamos un trato: yo te ayudo con la ortografía, y tú me ayudas con la geometría."},{"q":"diana","t":"¡Pero si yo tampoco entiendo la geometría!"},{"q":"ana","t":"Entonces la vamos a odiar juntas. Eso también une."}],"con":"diana","tema":"Hablar de la escuela","resumen":"La escuela: Ana odia la geometría, Diana la ortografía; se ayudarán.","tipo":"conversacion"},{"id":"conv_diana_bosque","origen":"conversacion","si":["hecho:se_queda","afecto:diana:ana>=3","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":["suma letras:ana 1"],"narra":[],"L":[{"q":"ana","t":"Diana, ¿sabías que en el Bosque Encantado vive una dama blanca que llora por su amor perdido? Pasa a medianoche junto al arroyo."},{"q":"diana","t":"(Diana abre mucho los ojos.) ¿De verdad?"},{"q":"ana","t":"Y un niño sin cabeza que camina detrás de los árboles. Y unos dedos fríos que te tocan el hombro…"},{"q":"diana","t":"¡Ana! ¡Ya no voy a poder pasar por ahí!"},{"q":"ana","t":"(Ana mira hacia los abetos, que de pronto se ven muy oscuros.) Bueno… yo tampoco, ahora que lo pienso."}],"con":"diana","tema":"Contarle historias del Bosque Encantado","resumen":"Ana inventa fantasmas del Bosque Encantado y asusta a Diana.","tipo":"conversacion"},{"id":"conv_diana_vestidos","origen":"conversacion","si":["hecho:se_queda","afecto:diana:ana>=3","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"diana","t":"Para el concierto me voy a poner el vestido azul, el de las cintas."},{"q":"ana","t":"Yo voy a ir con el de siempre. Pero voy a imaginar que es de seda rosa, con mangas abullonadas y un collar de perlas."},{"q":"diana","t":"Te vas a ver bonita igual, Ana."},{"q":"ana","t":"Con tu ayuda, y con mucha imaginación, quizás."}],"con":"diana","tema":"Hablar de vestidos y de la fiesta","resumen":"Vestidos para el concierto: Diana el azul, Ana el de siempre, imaginado de seda.","tipo":"conversacion"},{"id":"conv_diana_club","origen":"conversacion","si":["hecho:se_queda","afecto:diana:ana>=3","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":["suma letras:ana 1"],"narra":[],"L":[{"q":"ana","t":"Diana, ¿y si hacemos un club de cuentos? Cada una escribe uno por semana y lo leemos juntas."},{"q":"diana","t":"Yo no sé escribir cuentos, Ana."},{"q":"ana","t":"Claro que sabes. Solo tienes que matar a alguien al final. Los cuentos tristes son los más bonitos."},{"q":"diana","t":"(Diana se ríe.) ¡Ana! Bueno… puedo intentarlo. Pero tú me ayudas con los nombres."},{"q":"ana","t":"Los nombres son lo más importante. Cordelia, Geraldine, Rosamunda…"}],"con":"diana","tema":"Proponerle un club de cuentos","resumen":"Proponen un club de cuentos; los tristes son los más bonitos.","tipo":"conversacion"},{"id":"conv_diana_gilbert","origen":"conversacion","si":["afecto:diana:ana>=3","hecho:zanahorias","!hecho:zanahorias_contesta","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"diana","t":"Ana… Gilbert Blythe es el muchacho más guapo de la escuela, ¿no te parece?"},{"q":"ana","t":"¡Diana Barry! Gilbert Blythe es la persona más odiosa de toda la isla. Nunca, nunca le voy a hablar."},{"q":"diana","t":"Pero si fue solo una broma…"},{"q":"ana","t":"Una broma imperdonable. Hay cosas que no se olvidan, Diana. Se llevan en el alma."},{"q":"diana","t":"(Diana suspira, pero no dice nada más.)"},{"ops":[{"t":"Cambiar de tema","propia":true,"L":[{"q":"ana","t":"Hablemos de otra cosa. De cualquier cosa que no tenga pelo castaño y sonrisa de presumido."},{"q":"diana","t":"(Diana se ríe.) Como quieras, Ana."}]}]}],"con":"diana","tema":"Hablar de Gilbert Blythe","resumen":"Diana encuentra guapo a Gilbert; Ana jura que nunca le hablará.","tipo":"conversacion"},{"id":"conv_diana_gilbert_contesta","origen":"conversacion","si":["afecto:diana:ana>=3","hecho:zanahorias_contesta","hecho:llego_gilbert","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"diana","t":"Ana… toda la escuela habla de lo que le dijiste a Gilbert. ¡Nadie le había contestado así nunca! Se puso más rojo que tu pelo."},{"q":"ana","t":"Se lo merecía, Diana. Una no puede dejar que le digan zanahoria delante de todos y quedarse callada como un pez."},{"q":"diana","t":"Pero él dijo «me lo merezco». Y después, en el recreo, te miraba. Yo creo que le gustaste, Ana."},{"q":"ana","t":"(Ana se pone colorada hasta las orejas.) ¡Diana Barry! No digas esas cosas. Gilbert Blythe puede mirar todo lo que quiera: yo no pienso mirarlo nunca."},{"q":"diana","t":"(Diana sonríe, pero no dice nada.)"},{"ops":[{"t":"«Aunque… fue bastante caballero al reconocerlo.»","propia":true,"L":[{"q":"ana","t":"Aunque… hay que admitir que fue bastante caballero al reconocerlo. Un muchacho cualquiera se habría enojado."},{"q":"diana","t":"¿Ves? No es tan malo."},{"q":"ana","t":"No he dicho que no sea malo. He dicho que fue caballero. Una vez."},{"ef":"suma afecto:ana:gilbert 1"}]},{"t":"«No quiero hablar más de Gilbert Blythe.»","propia":false,"L":[{"q":"ana","t":"No quiero hablar más de Gilbert Blythe, Diana. Ni hoy ni nunca. Hablemos de algo que tenga poesía."},{"q":"diana","t":"(Diana se ríe.) Como quieras, Ana."}]},{"t":"Admitir que tiene lindos ojos (solo un poquito)","propia":false,"L":[{"q":"ana","t":"Bueno… está bien. Tiene lindos ojos. Pero eso no cambia nada. ¡Nada!"},{"q":"diana","t":"¡Ana Shirley! ¡Lo sabía!"},{"ef":"hecho ana_admite_gilbert"},{"ef":"suma afecto:diana:ana 1"}]}]}],"con":"diana","tema":"Hablar de lo que le contestó a Gilbert","resumen":"Toda la escuela habla de lo que Ana le contestó a Gilbert; Diana cree que le gustó.","tipo":"conversacion"},{"id":"conv_diana_tia","origen":"conversacion","si":["afecto:diana:ana>=3","hecho:cama_josephine","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"diana","t":"Ana, cada vez que me acuerdo de la cara de la tía Josephine… cuando saltamos sobre la cama…"},{"q":"ana","t":"(Las dos se ríen hasta que les duele la barriga.) ¡«Misericordia»! ¡Eso dijo!"},{"q":"diana","t":"Y ahora te quiere más que a mí. Dice que eres un espíritu afín."},{"q":"ana","t":"Es que lo somos. Aunque no lo parezca a primera vista."}],"con":"diana","tema":"Reírse con ella de la noche de la tía Josephine","resumen":"Se ríen de la noche en que saltaron sobre la tía Josephine.","tipo":"conversacion"},{"id":"conv_diana_secreto","origen":"conversacion","si":["afecto:diana:ana>=4","cuaderno:amigas","!hecho:prohibida","dia_juego:10"],"o":[],"empieza":[],"termina":["suma afecto:diana:ana 1"],"narra":[],"L":[{"q":"ana","t":"Diana, te voy a contar algo que nunca le he contado a nadie. Antes de venir a Tejas Verdes, tenía una amiga imaginaria. Se llamaba Katie Maurice y vivía en el vidrio de un armario."},{"q":"diana","t":"¿En el vidrio?"},{"q":"ana","t":"Era mi reflejo. Pero yo hacía como que era otra niña, en una sala encantada. Le contaba todo. Era la única con quien podía hablar."},{"q":"diana","t":"(Diana le toma la mano.) Ya no la necesitas. Ahora me tienes a mí."},{"q":"ana","t":"Ya lo sé. Por eso te lo cuento."}],"con":"diana","tema":"Contarle un secreto","resumen":"Ana le cuenta su amiga imaginaria del orfanato, Katie Maurice; Diana: ahora me tienes a mí.","tipo":"conversacion"},{"id":"conv_diana_futuro","origen":"conversacion","si":["afecto:diana:ana>=4","estudio:ana>=20","!hecho:prohibida","dia_juego:10","conoce:stacy"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Diana, la Srta. Stacy va a preparar a los que quieran dar el examen de Queen's. ¿Te vas a anotar?"},{"q":"diana","t":"Mamá no quiere. Dice que no hace falta que yo estudie para maestra."},{"q":"ana","t":"(Ana se queda callada.) Entonces vamos a estar separadas…"},{"q":"diana","t":"Solo un tiempo. Y nos vamos a escribir todas las semanas. Todas."},{"q":"ana","t":"Todas. Lo juro por el sol y la luna."}],"con":"diana","tema":"Hablarle de Queen's","resumen":"Diana no irá a Queen's; se escribirán todas las semanas.","tipo":"conversacion"},{"id":"conv_diana_casarse","origen":"conversacion","si":["afecto:diana:ana>=5","cuaderno:amigas","!hecho:prohibida","dia_juego:28"],"o":[],"empieza":[],"termina":["suma afecto:diana:ana 1"],"narra":[],"L":[{"q":"diana","t":"Ana, ¿tú crees que nos vamos a casar algún día?"},{"q":"ana","t":"Tú sí, seguro. Con alguien muy guapo y muy bueno. Y yo voy a ser tu dama de honor, con mangas abullonadas."},{"q":"diana","t":"¿Y tú?"},{"q":"ana","t":"Yo voy a ser una solterona interesante, que escribe libros. O quizás no. Todavía no lo he decidido."},{"q":"diana","t":"Prométeme que, pase lo que pase, vamos a seguir siendo amigas."},{"q":"ana","t":"Mientras el sol y la luna existan, Diana. Ya lo juramos."}],"con":"diana","tema":"Hablar de cuando sean grandes","resumen":"Cuando sean grandes: Diana se casará; Ana será dama de honor o una solterona que escribe.","tipo":"conversacion"},{"id":"conv_diana_vela","origen":"conversacion","si":["afecto:diana:ana>=4","cuaderno:amigas","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"diana","t":"Ana, desde mi ventana se ve la tuya, entre los árboles. ¿Te diste cuenta?"},{"q":"ana","t":"¡Diana! Podríamos hacernos señas de noche, con una vela y un cartón. Como en los libros."},{"q":"diana","t":"¿Y cómo sabríamos qué quiere decir cada una?"},{"q":"ana","t":"Inventamos un código. Dos destellos: «¿estás ahí?». Tres: «sí». Cuatro: «no». Y cinco: «ven mañana temprano, que tengo algo importante que contarte»."},{"q":"diana","t":"¡Cinco destellos! Esta noche lo probamos."}],"con":"diana","tema":"Inventar con ella unas señas con la vela","resumen":"Inventan señas con una vela entre sus ventanas: un código de destellos.","tipo":"conversacion"},{"id":"conv_lynde_ventana","origen":"conversacion","si":["hecho:se_queda","afecto:lynde:ana>=2","!hecho:ofendio_lynde"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sra. Lynde, ¿qué ve desde su ventana, todo el día?"},{"q":"lynde","t":"Todo, niña. Quién pasa, a dónde va y, si me descuido, a qué. Nada se me escapa en Avonlea."},{"q":"ana","t":"¡Debe ser como leer un libro que nunca se acaba!"},{"q":"lynde","t":"(La Sra. Lynde se queda sin respuesta, cosa que no le pasa nunca.) Bueno… algo así."}],"con":"lynde","tema":"Preguntarle qué ve desde su ventana","resumen":"Lo que la Sra. Lynde ve desde su ventana: Avonlea como un libro sin fin.","tipo":"conversacion"},{"id":"conv_lynde_pelo","origen":"conversacion","si":["hecho:se_queda","afecto:lynde:ana>=3","!hecho:ofendio_lynde"],"o":[],"empieza":[],"termina":["suma afecto:lynde:ana 1"],"narra":[],"L":[{"q":"lynde","t":"Ana, mírate. El pelo se te está oscureciendo. Casi castaño rojizo, diría yo."},{"q":"ana","t":"(A Ana se le iluminan los ojos.) ¿De verdad, Sra. Lynde? ¿Castaño rojizo?"},{"q":"lynde","t":"Yo no digo cosas que no son. Cuando seas grande, vas a ser una muchacha bien parecida."},{"q":"ana","t":"Sra. Lynde… la perdono por todo lo que me dijo cuando llegué. Por todo."},{"q":"lynde","t":"(La Sra. Lynde parpadea.) Bueno. Gracias, supongo."}],"con":"lynde","tema":"Hablarle de su pelo","resumen":"La Sra. Lynde nota que el pelo de Ana se oscurece; Ana la perdona por todo.","tipo":"conversacion"},{"id":"conv_lynde_queens","origen":"conversacion","si":["hecho:se_queda","afecto:lynde:ana>=3","estudio:ana>=50","!hecho:ofendio_lynde"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"lynde","t":"Así que te vas a Queen's. Yo nunca creí que las mujeres necesitaran tanto estudio…"},{"q":"ana","t":"Pero, Sra. Lynde, ¿no sería bonito que hubiera maestras muy buenas en toda la isla?"},{"q":"lynde","t":"Hmm. Si son como tú, ruidosas pero buenas… quizás no sería tan malo. No le digas a nadie que dije eso."}],"con":"lynde","tema":"Contarle que quiere ir a Queen's","resumen":"La Sra. Lynde duda de que las mujeres necesiten estudiar; Ana la convence un poco.","tipo":"conversacion"},{"id":"conv_barry_diana","origen":"conversacion","si":["hecho:se_queda","afecto:barry:ana>=2","hecho:conocidas_diana","!hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sra. Barry, ¿Diana puede salir a jugar un rato?"},{"q":"barry","t":"Un rato, sí. Pero que vuelva antes de que oscurezca, y nada de bosques encantados."},{"q":"ana","t":"Se lo prometo, Sra. Barry. Solo bosques normales."}],"con":"barry","tema":"Preguntarle si Diana puede salir","resumen":"Ana pide que Diana salga a jugar; la Sra. Barry: antes de que oscurezca.","tipo":"conversacion"},{"id":"conv_barry_cordial","origen":"conversacion","si":["afecto:barry:ana>=3","hecho:perdonada"],"o":[],"empieza":[],"termina":["suma afecto:barry:ana 1"],"narra":[],"L":[{"q":"ana","t":"Sra. Barry, nunca le dije bien cuánto sentí lo del vino de grosellas."},{"q":"barry","t":"Ya pasó, Ana. Fui muy dura contigo. Lo que hiciste por Minnie May lo borró todo."},{"q":"ana","t":"Desde entonces, cada vez que veo una botella roja me tiemblan las rodillas."},{"q":"barry","t":"(La Sra. Barry se ríe, por primera vez con Ana.) A mí también, niña. A mí también."}],"con":"barry","tema":"Pedirle perdón otra vez por el vino","resumen":"Ana vuelve a pedir perdón por el vino de grosellas; la Sra. Barry se ríe con ella.","tipo":"conversacion"},{"id":"conv_harrison_avena","origen":"conversacion","si":["hecho:se_queda","conoce:harrison"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sr. Harrison, su campo de avena se ve tan verde que parece un mar chiquito. Cuando sopla el viento hace olas."},{"q":"harrison","t":"(El Sr. Harrison se rasca la barba, desconfiado.) Olas. Hmpf. Lo que hace es crecer, si las vacas de los vecinos lo dejan en paz."},{"q":"ana","t":"¿Las vacas de los vecinos se lo comen?"},{"q":"harrison","t":"Una vaca jersey que no voy a nombrar. Se mete por la cerca como si fuera suya la avena."},{"ops":[{"t":"«Si la veo, la espanto yo.»","propia":true,"L":[{"q":"ana","t":"Si alguna vez la veo, yo misma la espanto. Soy muy buena espantando cosas: en el orfanato espantaba los ratones."},{"q":"harrison","t":"(Por primera vez, al Sr. Harrison se le escapa media sonrisa.) Bueno. Eso sí que me serviría."},{"ef":"suma afecto:harrison:ana 1"}]},{"t":"«A lo mejor la vaca también encuentra que es como un mar.»","propia":false,"L":[{"q":"ana","t":"A lo mejor la vaca también encuentra que es como un mar, y por eso no se puede resistir."},{"q":"harrison","t":"(El Sr. Harrison la mira como si hubiera dicho una barbaridad.) Las vacas no piensan en mares, niña. Piensan en avena."}]}]}],"con":"harrison","tema":"Preguntarle por su campo de avena","resumen":"El campo de avena del Sr. Harrison y la vaca jersey que se lo come.","tipo":"conversacion"},{"id":"conv_harrison_solo","origen":"conversacion","si":["hecho:se_queda","conoce:harrison"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sr. Harrison, ¿no se aburre viviendo solo? Yo, cuando estaba sola, inventaba amigas en los vidrios de las vitrinas."},{"q":"harrison","t":"No estoy solo. Tengo a Ginger. Y a mí mismo, que soy buena compañía cuando nadie me molesta."},{"q":"ana","t":"Ginger es su loro, ¿verdad? Dicen que dice cosas terribles."},{"q":"harrison","t":"Dice la verdad, que a la gente le parece terrible. No es lo mismo."},{"ops":[{"t":"«Me gustaría conocerlo algún día.»","propia":true,"L":[{"q":"ana","t":"Me gustaría conocerlo algún día. Prometo no escandalizarme. Bueno… prometo intentarlo."},{"q":"harrison","t":"(El Sr. Harrison gruñe, pero no dice que no.) Algún día. Si te portas bien con mi avena."},{"ef":"suma afecto:harrison:ana 1"}]},{"t":"«Yo creo que nadie debería vivir solo.»","propia":false,"L":[{"q":"ana","t":"Yo creo que nadie debería vivir solo. Hasta los ermitaños de los libros tienen una cabra."},{"q":"harrison","t":"(El Sr. Harrison frunce el ceño.) Lo que tú creas no es asunto mío, niña. Buenos días."}]}]}],"con":"harrison","tema":"Preguntarle si no se aburre viviendo solo","resumen":"¿Se aburre viviendo solo? Tiene a Ginger, su loro, que dice la verdad.","tipo":"conversacion"},{"id":"conv_harrison_loro","origen":"conversacion","si":["hecho:se_queda","afecto:harrison:ana>=2"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sr. Harrison, ¿es verdad que tiene un loro que dice malas palabras?"},{"q":"harrison","t":"Ginger dice lo que le da la gana. Como yo. Por eso nos llevamos bien."},{"q":"ana","t":"¿Puedo conocerlo?"},{"q":"harrison","t":"Si no te asustas con facilidad… Y no le hables de la vaca. Ni a mí tampoco."}],"con":"harrison","tema":"Preguntarle por su loro","resumen":"El loro Ginger dice malas palabras; quizás Ana pueda conocerlo.","tipo":"conversacion"},{"id":"conv_gilbert_caramelo","origen":"conversacion","si":["hecho:zanahorias","hecho:llego_gilbert","!cuaderno:paces"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"gilbert","t":"(Gilbert deja sobre el pupitre de Ana un caramelo rosado con forma de corazón. Tiene escrito, en letras doradas: «Eres dulce».)"},{"q":"gilbert","t":"Es para ti, Ana. Para… bueno, para que me perdones."},{"ops":[{"t":"Tirarlo al suelo y aplastarlo con el talón","propia":true,"L":[{"q":"ana","t":"(Ana toma el corazón con la punta de los dedos, lo deja caer y lo pisa con el talón, sin mirarlo.)"},{"q":"ana","t":"Hay cosas que no se arreglan con azúcar, Gilbert Blythe."},{"q":"gilbert","t":"(Gilbert se pone rojo. Pero no se va enojado: se va pensativo.)"}]},{"t":"Dejarlo en el pupitre, sin tocarlo","propia":false,"L":[{"q":"ana","t":"(Ana no lo toca. Tampoco lo tira. El corazón se queda ahí toda la tarde, rosado y paciente, mientras ella mira el pizarrón.)"},{"q":"gilbert","t":"(Cuando termina la clase, el caramelo sigue ahí. Gilbert no sabe si eso es bueno o malo.)"},{"ef":"suma afecto:ana:gilbert 1"}]}]}],"con":"gilbert","tema":"Gilbert le ofrece un caramelo","resumen":"Gilbert le ofrece un caramelo de corazón para que lo perdone.","tipo":"conversacion"},{"id":"conv_gilbert_estudiar","origen":"conversacion","si":["cuaderno:paces","hecho:llego_gilbert"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"gilbert","t":"Ana, ¿te parece si repasamos juntos la geometría? Tú me explicas la historia y yo te explico los triángulos."},{"q":"ana","t":"(Ana duda un segundo. Antes se habría muerto antes que aceptar.) Bueno. Pero que conste que la historia es mucho más difícil que los triángulos."},{"q":"gilbert","t":"(Gilbert se ríe.) Eso lo veremos."},{"q":"ana","t":"(Pasan la tarde entre libros. Por primera vez, la proposición cinco tiene sentido. Ana no piensa decírselo.)"},{"q":"al_terminar","t":"suma estudio:ana 1"},{"q":"al_terminar","t":"suma afecto:ana:gilbert 1"}],"con":"gilbert","tema":"Estudiar con Gilbert para Queen's","resumen":"Ana y Gilbert estudian juntos geometría e historia para Queen's.","tipo":"conversacion"},{"id":"conv_stacy_queens","origen":"conversacion","si":["hecho:se_queda","conoce:stacy","hecho:llego_stacy"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Srta. Stacy… ¿es verdad que va a preparar a algunos para el examen de Queen's?"},{"q":"stacy","t":"Es verdad. A los que quieran estudiar en serio, después de clases. ¿Te interesa, Ana?"},{"q":"ana","t":"¡Más que nada en el mundo! Quiero ser maestra… como usted. Pero tendría que preguntarle a Marilla."},{"q":"stacy","t":"Pregúntale. Y Ana: tienes cabeza para eso y mucho más. Solo te falta la constancia. La imaginación ya la tienes de sobra."},{"q":"al_terminar","t":"suma estudio:ana 1"}],"con":"stacy","tema":"Preguntarle por la clase de Queen's","resumen":"La Srta. Stacy preparará a algunos para Queen's; Ana quiere ser maestra.","tipo":"conversacion"},{"id":"conv_stacy_escribir","origen":"conversacion","si":["hecho:se_queda","conoce:stacy","hecho:llego_stacy"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Srta. Stacy, Diana y yo tenemos un club de cuentos. Yo escribo tragedias. En la última se mueren todos."},{"q":"stacy","t":"(La Srta. Stacy sonríe.) ¿Todos? ¿Y no queda nadie para contarlo?"},{"q":"ana","t":"Bueno… queda la madre. Para llorar en la tumba."},{"q":"stacy","t":"Ana, escribe de lo que conoces. Avonlea tiene más historias que cualquier castillo. Un arce, una vieja que teje, un niño que espera el tren."},{"q":"ana","t":"(Ana se queda pensando. Nunca se le había ocurrido que Avonlea pudiera salir en un cuento.)"},{"q":"al_terminar","t":"suma afecto:stacy:ana 1"}],"con":"stacy","tema":"Contarle que escribe cuentos","resumen":"Ana escribe tragedias; la Srta. Stacy le aconseja escribir de lo que conoce.","tipo":"conversacion"},{"id":"conv_sraallan_ser_buena","origen":"conversacion","si":["hecho:se_queda","conoce:sraallan","presente:sraallan"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sra. Allan… ¿usted cree que una persona puede ser buena aunque le cueste muchísimo?"},{"q":"sraallan","t":"Creo que esas son las que más valen, Ana. A los que les sale fácil no tienen tanto mérito."},{"q":"ana","t":"Es que a mí me cuesta tanto. Me enojo, digo cosas, y después me arrepiento… y al día siguiente lo hago otra vez."},{"q":"sraallan","t":"(La Sra. Allan le toma la mano.) Mientras te arrepientas, vas bien. Yo también me equivoco, ¿sabes? Hasta la esposa del pastor."},{"q":"ana","t":"(Ana la mira con los ojos muy abiertos. ¡La Sra. Allan se equivoca!) Eso me consuela más que un sermón entero."},{"q":"al_terminar","t":"suma afecto:sraallan:ana 1"}],"con":"sraallan","tema":"Preguntarle cómo se hace para ser buena","resumen":"Cómo ser buena cuando cuesta; la Sra. Allan también se equivoca.","tipo":"conversacion"},{"id":"conv_ruby_muchachos","origen":"conversacion","si":["hecho:se_queda","conoce:ruby"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ruby","t":"Ana, ¿a ti quién te gusta? A mí me gustan casi todos. Charlie Sloane me miró dos veces hoy."},{"q":"ana","t":"A mí no me gusta nadie, Ruby. Bueno, me gustan los héroes de los libros, que son mucho más nobles y nunca tiran de las trenzas."},{"q":"ruby","t":"(Ruby se ríe tapándose la boca.) Pero esos no existen."},{"q":"ana","t":"Por eso son perfectos."},{"ops":[{"t":"«Algún día vendrá uno de verdad, alto y moreno, con ojos melancólicos.»","propia":true,"L":[{"q":"ana","t":"Algún día vendrá uno de verdad, alto y moreno, con ojos melancólicos y palabras de poeta. Y hasta entonces, nada."},{"q":"ruby","t":"¡Ay, Ana, qué bonito lo dices!"}]},{"t":"«Prefiero ser la primera de la clase.»","propia":false,"L":[{"q":"ana","t":"Además, yo prefiero ser la primera de la clase. Eso dura más que una mirada de Charlie Sloane."},{"q":"ruby","t":"(Ruby la mira como si hubiera dicho algo muy raro.)"},{"ef":"suma estudio:ana 1"}]}]}],"con":"ruby","tema":"Hablar con Ruby de los muchachos","resumen":"Ruby habla de muchachos; a Ana solo le gustan los héroes de los libros.","tipo":"conversacion"},{"id":"conv_jane_maestra","origen":"conversacion","si":["hecho:se_queda","conoce:jane"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Jane, ¿tú qué quieres ser cuando seas grande?"},{"q":"jane","t":"Maestra. En una escuela de campo, con un sueldo fijo. Y después, ya veremos."},{"q":"ana","t":"¡Qué práctico! Yo también quiero ser maestra, pero me imagino una escuela junto al mar, y niños que nunca se portan mal."},{"q":"jane","t":"(Jane se ríe.) Eso no existe, Ana. Pero si existiera, te tocaría a ti."}],"con":"jane","tema":"Preguntarle a Jane qué quiere ser","resumen":"Jane quiere ser maestra con sueldo fijo; Ana, en una escuela junto al mar.","tipo":"conversacion"},{"id":"conv_josie_cerca","origen":"conversacion","si":["hecho:se_queda","conoce:josie"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"josie","t":"Ana Shirley, apuesto a que no te atreves a caminar por arriba de la cerca del jardín de los Barry. Yo lo hice. Bueno, casi."},{"ops":[{"t":"Aceptar el desafío, por orgullo","propia":true,"L":[{"q":"ana","t":"Una Shirley no se echa para atrás ante un desafío, Josie Pye."},{"q":"ana","t":"(Ana camina por la cerca con los brazos abiertos, como una equilibrista. Llega hasta la mitad… y salta al pasto antes de caerse.)"},{"q":"josie","t":"(Josie hace una mueca.) Bueno. No está mal. Para una pelirroja."}]},{"t":"No hacerle caso","propia":false,"L":[{"q":"ana","t":"No tengo nada que demostrarte, Josie. Ni a ti ni a nadie."},{"q":"josie","t":"(Josie se encoge de hombros.) Miedosa."},{"q":"ana","t":"(Ana se va con la frente en alto. Por dentro, le arde. Pero se va.)"}]}]}],"con":"josie","tema":"Responderle a Josie Pye","resumen":"Josie desafía a Ana a caminar por la cerca de los Barry.","tipo":"conversacion"},{"id":"conv_minnie_cuento","origen":"conversacion","si":["hecho:se_queda","conoce:minnie"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"minnie","t":"Ana, ¿sabes cuentos? Diana dice que tú inventas los mejores."},{"q":"ana","t":"¡Claro! Había una vez una niña que vivía en una burbuja, adentro de un arroyo. Una burbuja de cristal, y cuando llovía, sonaba como campanitas."},{"q":"minnie","t":"(Minnie abre la boca.) ¿Y qué comía?"},{"q":"ana","t":"Rocío. Y pétalos de violeta los domingos. Hasta que un día vino un sapo con corona…"},{"q":"minnie","t":"(Minnie May escucha hasta el final sin moverse, que para Minnie May es un milagro.) ¡Otro!"},{"q":"al_terminar","t":"suma afecto:minnie:ana 1"}],"con":"minnie","tema":"Contarle un cuento de hadas a Minnie May","resumen":"Ana le cuenta a Minnie May el cuento de la niña en la burbuja del arroyo.","tipo":"conversacion"},{"id":"conv_phillips_libro","origen":"conversacion","si":["hecho:se_queda","conoce:phillips"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sr. Phillips, ¿me prestaría otro libro? Ya terminé el de cuarto grado. Dos veces."},{"q":"phillips","t":"(El Sr. Phillips no la oye. Está mirando por la ventana a Prissy Andrews, que resuelve un problema en el pizarrón.)"},{"q":"ana","t":"¿Sr. Phillips?"},{"q":"phillips","t":"¿Eh? Ah. Sí, sí, Ana. Tome. Sea lo que sea."},{"q":"ana","t":"(Le pasa un libro de aritmética. Ana suspira. No era eso lo que tenía en mente, pero un libro es un libro.)"},{"q":"al_terminar","t":"suma estudio:ana 1"}],"con":"phillips","tema":"Pedirle otro libro al Sr. Phillips","resumen":"Ana pide un libro al Sr. Phillips, que solo mira a Prissy Andrews.","tipo":"conversacion"},{"id":"mis_brujula_lynde","origen":"conversacion","si":["conoce:lynde","hecho:mis_brujula_hallada","!hecho:mis_brujula_sabe"],"o":[],"empieza":[],"termina":["hecho mis_brujula_sabe"],"narra":[],"L":[{"q":"ana","t":"Sra. Lynde, ¿usted sabe quién es «J. A. H.»? Encontré esto en el lago."},{"q":"lynde","t":"(La Sra. Lynde deja de tejer de golpe.) ¡Válgame! James Andrew Harrison. Y el Jim de la tapa es el capitán Jim, el del faro."},{"q":"ana","t":"¿El Sr. Harrison? ¿El de la avena? ¿Le regaló una brújula a alguien, con una dedicatoria tan bonita?"},{"q":"lynde","t":"Eran uña y carne, de muchachos. Iban a embarcarse juntos en la goleta del viejo MacAllister. Y la noche de la tormenta grande, Harrison no se presentó en el muelle. Jim zarpó solo, y de esa noche no se hablaron nunca más."},{"q":"ana","t":"¿Nunca más? ¿Treinta años sin hablarse, viviendo los dos en la misma isla?"},{"q":"lynde","t":"Treinta y uno. Y no me mires así, que yo no tengo la culpa. El orgullo de los hombres es como la mala hierba: se le corta la punta y vuelve a salir."},{"ops":[{"t":"Preguntarle por qué el Sr. Harrison no fue al muelle","propia":true,"L":[{"q":"ana","t":"¿Y por qué no fue?"},{"q":"lynde","t":"Eso no lo sabe nadie, y fíjate que en Avonlea eso es mucho decir. Yo tengo mis sospechas, pero me las guardo."},{"q":"ana","t":"La Sra. Lynde guardándose algo. Debe de ser un secreto muy pesado.","piensa":true}]},{"t":"Prometerle no andar contándolo","propia":false,"L":[{"q":"ana","t":"No se lo voy a contar a nadie, Sra. Lynde. Es una historia demasiado triste para andarla repartiendo."},{"q":"lynde","t":"(La Sra. Lynde la mira con algo parecido al respeto.) Hum. Ojalá todo Avonlea pensara como tú. Aunque entonces yo me aburriría bastante."},{"ef":"suma afecto:lynde:ana 1"}]}]}],"con":"lynde","tema":"Preguntarle quién es «J. A. H.»","resumen":"La Sra. Lynde reconoce la brújula: el Sr. Harrison se la regaló al capitán Jim, y una noche de tormenta, hace treinta años, dejaron de hablarse.","tipo":"conversacion"},{"id":"mis_brujula_harrison","origen":"conversacion","si":["conoce:harrison","hecho:mis_brujula_hallada","!hecho:mis_brujula_fin"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sr. Harrison, encontré esto en el lago. Tiene unas iniciales, y creo que son las suyas."},{"q":"harrison","t":"(El Sr. Harrison toma la brújula, y por un buen rato no dice nada.) Hmpf. Así que la tiró al lago. Era muy de Jim, eso de hacer las cosas con ruido."},{"q":"ana","t":"¿Usted se la regaló?"},{"q":"harrison","t":"Con mis primeros ahorros. Íbamos a dar la vuelta al mundo, él y yo. Esa noche mi madre se puso muy mala, y yo me quedé con ella. Se murió al amanecer."},{"q":"ana","t":"Pero entonces… ¡usted no lo abandonó! ¿Por qué no se lo dijo?"},{"q":"harrison","t":"Porque él no preguntó, niña. Se fue diciendo en el muelle que yo era un cobarde. Y uno no anda explicándole las cosas a quien ya decidió lo que piensa de uno."},{"q":"ana","t":"(Ana aprieta las manos.) Treinta y un años de no explicar…"},{"q":"harrison","t":"Treinta y uno. Ginger es mejor compañía. No hace preguntas."},{"ops":[{"t":"Ofrecerse a llevarle la brújula al capitán Jim","propia":false,"L":[{"q":"ana","t":"Sr. Harrison, déjeme llevársela yo. Una brújula que dice «el camino de vuelta» no puede quedarse en un cajón."},{"q":"harrison","t":"(El Sr. Harrison gruñe, pero le devuelve la brújula.) Haz lo que quieras. Pero no le digas que yo te mandé."},{"ef":"hecho mis_brujula_encargo"}]},{"t":"Decirle que debería ir él mismo","propia":false,"L":[{"q":"ana","t":"Yo creo que debería ir usted mismo. Las cosas importantes no se mandan con una niña, por muy confiable que sea."},{"q":"harrison","t":"(El Sr. Harrison la mira largo.) Eres insolente. Y tienes razón, que es peor. Llévasela tú; yo… lo pensaré."},{"ef":"hecho mis_brujula_encargo"},{"ef":"hecho mis_brujula_empujon"},{"ef":"suma afecto:harrison:ana 1"}]},{"t":"Devolvérsela y no meterse","propia":false,"L":[{"q":"ana","t":"Entonces es suya, Sr. Harrison. Usted sabrá qué hacer con ella. No me voy a meter."},{"q":"harrison","t":"(El Sr. Harrison guarda la brújula en el bolsillo del chaleco.) Eso es lo más sensato que te he oído decir. No me acostumbro."},{"ef":"hecho mis_brujula_guardada"},{"ef":"hecho mis_brujula_fin"},{"ef":"log Ana le devolvió la brújula al Sr. Harrison y no se metió. | yo: Le devolví la brújula al Sr. Harrison. No me metí. No sé si hice bien."}]}]}],"con":"harrison","tema":"Mostrarle la brújula del lago","resumen":"El Sr. Harrison reconoce la brújula. La noche de la tormenta no fue al muelle porque su madre se moría, y nunca se lo dijo a Jim, por orgullo. Ana decide qué hacer.","tipo":"conversacion"},{"id":"mis_brujula_jim","origen":"conversacion","si":["hecho:mis_brujula_encargo","!hecho:mis_brujula_jim"],"o":[],"empieza":[],"termina":["hecho mis_brujula_jim"],"narra":[],"L":[{"q":"ana","t":"Capitán Jim, le traigo algo que se le perdió hace mucho. O que usted perdió a propósito."},{"q":"farero","t":"(El capitán Jim abre la tapa y se le quiebra la voz.) «Para que siempre encuentres el camino de vuelta.» La tiré al lago la mañana que volví del primer viaje. Pensé que no la quería ver nunca más."},{"q":"ana","t":"¿Porque el Sr. Harrison no fue al muelle?"},{"q":"farero","t":"Porque esperé a mi mejor amigo bajo la lluvia hasta que el capitán dijo que zarpábamos. Uno no se olvida de esa lluvia, niña."},{"ops":[{"t":"Contarle por qué el Sr. Harrison no fue","propia":false,"L":[{"q":"ana","t":"Capitán Jim, esa noche la madre del Sr. Harrison se estaba muriendo. Él se quedó con ella. Se murió al amanecer."},{"q":"farero","t":"(El capitán Jim se queda mirando el mar un rato muy largo.) ¿Y por qué diablos no me lo dijo?"},{"q":"ana","t":"Dice que usted no preguntó. Que se fue llamándolo cobarde."},{"q":"farero","t":"(Se ríe, sin ganas.) Dos viejos tontos. Uno que no preguntó y otro que no explicó. Treinta y un años."},{"ef":"hecho mis_brujula_verdad"},{"ef":"suma afecto:farero:ana 1"}]},{"t":"Callarse eso y solo pedirle que vaya a verlo","propia":false,"L":[{"q":"ana","t":"No me toca a mí contarle nada, capitán. Pero el Sr. Harrison guardó treinta y un años las ganas de explicarle algo. Vaya a verlo."},{"q":"farero","t":"(El capitán Jim guarda la brújula en el bolsillo y no promete nada.) Ya veremos, niña. Ya veremos."}]}]}],"con":"farero","tema":"Llevarle la brújula del lago","resumen":"El capitán Jim reconoce la brújula que tiró al lago la noche que zarpó solo. Ana puede contarle por qué el Sr. Harrison no fue al muelle, o solo pedirle que vaya a verlo.","tipo":"conversacion"},{"id":"mis_brujula_final","origen":"conversacion","si":["hecho:mis_brujula_verdad","dias_desde:mis_brujula_jim:1","!hecho:mis_brujula_fin"],"o":[],"empieza":[],"termina":["hecho mis_brujula_paces","hecho mis_brujula_fin","log El capitán Jim y el Sr. Harrison se reconciliaron, después de treinta y un años. | yo: El capitán Jim fue a ver al Sr. Harrison. Hablaron de barcos. A veces las paces se hacen hablando de otra cosa."],"narra":[],"L":[{"q":"ana","t":"Sr. Harrison… ¿vino?"},{"q":"harrison","t":"(El Sr. Harrison sigue revolviendo la avena del caballo, sin mirarla.) Vino."},{"q":"ana","t":"¿Y? ¡No me deje así! ¿Se abrazaron? ¿Lloraron? ¿Se pidieron perdón como en las novelas?"},{"q":"harrison","t":"Tomamos té. Hablamos de barcos. De la tormenta, ni una palabra."},{"q":"ana","t":"(Ana se queda pasmada.) ¿Treinta y un años, y hablaron de barcos?"},{"q":"harrison","t":"Hay cosas que no hace falta decir cuando ya se sabe que el otro las sabe. Eso tú no lo entiendes todavía, porque tú dices todo."},{"ops":[{"t":"Preguntarle por la brújula","propia":true,"L":[{"q":"ana","t":"¿Y la brújula?"},{"q":"harrison","t":"La tiene él. Dice que ya encontró el camino de vuelta, y que es un poco tarde, pero no tanto."},{"ef":"suma afecto:harrison:ana 1"}]},{"t":"Decirle que está contenta, sin más","propia":false,"L":[{"q":"ana","t":"Estoy tan contenta que no sé qué decir. Y eso, viniendo de mí, es mucho."},{"q":"harrison","t":"(Al Sr. Harrison se le escapa una sonrisa, de esas que no le salen hace años.) Ginger dijo lo mismo. Con peores palabras."},{"ef":"suma afecto:harrison:ana 1"}]}]}],"con":"harrison","tema":"Preguntarle si vino el capitán Jim","resumen":"El capitán Jim fue a ver al Sr. Harrison. No hablaron de la tormenta: hablaron de barcos. La brújula volvió a su dueño.","tipo":"conversacion"},{"id":"mis_brujula_final_sin","origen":"conversacion","si":["hecho:mis_brujula_jim","!hecho:mis_brujula_verdad","dias_desde:mis_brujula_jim:1","!hecho:mis_brujula_fin"],"o":[],"empieza":[],"termina":["hecho mis_brujula_fin"],"narra":[],"L":[{"q":"ana","t":"Sr. Harrison… ¿vino el capitán Jim?"},{"q":"harrison","t":"No. Ya te dije que no importaba."},{"q":"ana","t":"Usted lo dijo, pero lo dijo mirando el camino."},{"q":"harrison","t":"(El Sr. Harrison deja la horquilla.) Mira, niña: hay cosas que se rompen y se quedan rotas. Las tazas, los muelles, los amigos."},{"ops":[{"t":"Decirle que vaya usted a explicarle lo de su madre","propia":false,"L":[{"q":"ana","t":"Él no sabe lo de su madre, Sr. Harrison. Yo no se lo dije: no me tocaba. Le toca a usted."},{"q":"harrison","t":"(Largo silencio.) El domingo hay buen viento para ir a la costa. Hmpf. No te prometo nada."},{"ef":"hecho mis_brujula_empujon"},{"ef":"log Ana le dijo al Sr. Harrison que le tocaba a él explicarle al capitán Jim. | yo: El capitán Jim no vino. Le dije al Sr. Harrison que le tocaba a él. Dijo «hmpf», que en su idioma es casi un sí."}]},{"t":"Dejarlo así","propia":false,"L":[{"q":"ana","t":"Está bien. No le voy a insistir."},{"q":"harrison","t":"Gracias. (Pero se queda mirando el camino un rato más.)"},{"ef":"log El capitán Jim no fue a ver al Sr. Harrison. | yo: Hay cosas que se rompen y se quedan rotas, dijo el Sr. Harrison. Yo no quiero creerlo."}]}]}],"con":"harrison","tema":"Preguntarle si vino el capitán Jim","resumen":"El capitán Jim no vino. El Sr. Harrison dice que no importa, y no es verdad. Ana puede contarle lo que sabe del muelle, o dejarlo así.","tipo":"conversacion"}],"habilidades":[{"id":"estudio","suma":["clase","estudiar","recitar","leer","ensayar"],"inicial":0,"titulo":"El estudio"},{"id":"granja","suma":["quehacer","ordeñar","alimentar","sembrar","regar","batir","acarrear_lena","partir_lena","hacer_heno","cocinar","coser","recoger"],"inicial":0,"titulo":"La granja de Tejas Verdes"},{"id":"mano_leche","suma":["ordeñar"],"inicial":0,"titulo":"Ordeñar"},{"id":"mano_cocina","suma":["cocinar"],"inicial":0,"titulo":"Cocinar"},{"id":"letras","suma":["escribir_cuento","escribir_carta","nombrar","adornar"],"inicial":0,"titulo":"Las letras y la imaginación"},{"id":"paciencia","suma":["quehacer","rezar","cocinar","coser","recoger"],"inicial":2,"titulo":"La paciencia de Marilla","de":"marilla","hacia":"ana","por":"ana","rango":[0,4]}],"metas":[{"id":"quedarse","titulo":"Quedarse en Tejas Verdes"},{"id":"conocer_diana","titulo":"Conocer a Diana Barry"},{"id":"amigas","titulo":"Tener una amiga del alma"},{"id":"picnic","titulo":"Ir de picnic con Diana"},{"id":"te_diana","titulo":"Invitar a Diana a tomar el té"},{"id":"perdon_barry","titulo":"Recuperar la amistad de los Barry"},{"id":"josephine","titulo":"Hacerse amiga de la tía Josephine"},{"id":"lynde","titulo":"Visitar a la Sra. Lynde"},{"id":"allan","titulo":"Tomar el té con la Sra. Allan"},{"id":"quehaceres","titulo":"Ayudar con los quehaceres"},{"id":"regalo","titulo":"Hacerle un regalo a Marilla que le guste"},{"id":"huerta","titulo":"Sembrar y regar la huerta"},{"id":"rezo","titulo":"Decir sus oraciones"},{"id":"escuela_dominical","titulo":"Ir a la escuela dominical"},{"id":"escuela","titulo":"Ir a la escuela"},{"id":"recito","titulo":"Recitar la lección en la escuela"},{"id":"queens","titulo":"Entrar a Queen's"},{"id":"paces","titulo":"Hacer las paces con Gilbert Blythe"},{"id":"leido","titulo":"Leer un libro de principio a fin"},{"id":"carta","titulo":"Escribir una carta y mandarla"},{"id" const lineaHtml = b => b.narra != null ? `<div class="ficha narra">${esc(b.narra)}</div>`

function pintaEscena(){

// what can happen now: first, what happens by itself (the state is enough); then, grouped by what the player would have
// to bring about (go somewhere, talk to someone, be with someone): her own decisions, as choices too
const tarjetaEsc = (e, r) => `<div class="esc ${e.tipo}" data-esc="${esc(e.id)}"><div>${esc(e.resumen || e.tema || e.narra[0]?.slice(0, 120) || e.id)}${e.grande ? '<span class="badge">★ grande</span>' : ''}${e.interrumpe ? '<span class="badge">interrumpe</span>' : ''}${e.repetir && e.repetir !== 'una_vez' ? '<span class="badge">se repite</span>' : ''}</div><div class="id">${esc(e.id)} · prioridad ${esc(e.prioridad || 1)}${r.otros?.length ? ' · <span class="mut">supone: ' + esc(r.otros.map(x => x.t).join(', ')) + '</span>' : ''}</div></div>`;
// of the scenes of a thing or a place that could happen, the next of each line (its first step not said; the wildcard
// only if no step can): as the game does
function lineaSiguiente(L){

  const dicho = e => e.paso !== 'siempre' && D.escenas.some(o => o !== e && (o.objeto || o.lugar) === (e.objeto || e.lugar) && o.paso !== 'siempre' && num(o) === num(e) && st.d[o.id]);
  for (const x of L) { const e = x[0], k = e.objeto || e.lugar; if (dicho(e)) continue; const y = M.get(k); if (!y || num(e) < num(y[0])) M.set(k, x); }
  return [...M.values()];
}
function pintaPosibles(){
  const T = D.escenas.filter(e => (filtro.cartas || e.tipo !== 'carta') && (filtro.mis || e.tipo !== 'mision'))
    .filter(e => !filtro.q || (e.id + ' ' + (e.resumen || '') + ' ' + (e.tema || '')).toLowerCase().includes(filtro.q))
    .map(e => [e, cuando(e)]).filter(([, c]) => c).filter(([, c]) => !filtro.solas || (!c.r.anaNo.length && !c.r.acc.length))
