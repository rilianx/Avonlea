<style>
:root{--bg:#f6f1e7;--panel:#fffaf0;--ink:#2e2418;--sub:#7a6a55;--line:#d9cdb8;--hi:#b0452f;--ok:#3f7a3a;--no:#a33;--sit:#7a6a2a;--card:#fffdf6;--acc:#2f6fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a16;--panel:#26221d;--ink:#eee4d4;--sub:#a99a85;--line:#3d362d;--hi:#ff8a70;--ok:#8fd08a;--no:#ff8a80;--sit:#d9c27a;--card:#2b2620;--acc:#79b0ea}}
:root[data-theme=dark]{--bg:#1d1a16;--panel:#26221d;--ink:#eee4d4;--sub:#a99a85;--line:#3d362d;--hi:#ff8a70;--ok:#8fd08a;--no:#ff8a80;--sit:#d9c27a;--card:#2b2620;--acc:#79b0ea}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,'Times New Roman',serif;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:normal;font-style:italic}
#reloj{font-size:14px;color:var(--sub)}
button{font:inherit;font-size:13.5px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--sub)}
button.prim{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{overflow:auto;min-height:0;padding:14px 16px 60px}
main > section{max-width:780px;margin:0 auto}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 16px 40px;min-height:0}
.tabs{display:flex;gap:0;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{white-space:nowrap}.tabs button:disabled{opacity:.4;cursor:default}.tabs button{border-radius:0;flex:1}.tabs button:first-child{border-radius:7px 0 0 7px}.tabs button:last-child{border-radius:0 7px 7px 0}.tabs button+button{border-left:0}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:16px;font-weight:normal;margin:6px 0 10px}

.mut{color:var(--sub)}

.ficha.narra{font-style:italic;background:var(--panel)}
.ficha .q{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.ficha.piensa{border-style:dashed}
.ef{max-width:760px;font:12.5px ui-monospace,Menlo,monospace;color:var(--sub);margin:0 0 8px 6px}
.ops{max-width:760px;display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.ops button{text-align:left;font-size:15px;padding:8px 12px}
.ops button.propia::after{content:'  (lo que Ana haría sola)';color:var(--sub);font-size:12px}
.req{max-width:760px;font-size:13px;margin:0 0 12px;padding:8px 12px;border:1px dashed var(--line);border-radius:7px}
.req .ok{color:var(--ok)}.req .no{color:var(--no)}.req .sit{color:var(--sit)}
.fila{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0;font-size:13.5px}
.fila code,.cod{font:12.5px ui-monospace,Menlo,monospace}
.fila button{font-size:11.5px;padding:0 6px}
input[type=number]{width:60px;font:inherit;font-size:13px;padding:1px 4px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px}
select,input[type=text],input[type=search]{font:inherit;font-size:13.5px;padding:4px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.acc{display:flex;flex-wrap:wrap;gap:6px}
.hist div{font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.hist div:hover{color:var(--hi)}
.cambios{max-width:760px;font-size:13.5px;border-left:3px solid var(--ok);padding:6px 12px;margin:10px 0;background:var(--panel)}
.fin{max-width:760px;text-align:center;font-style:italic;padding:22px;border:1px solid var(--hi);border-radius:9px;background:var(--panel);margin:12px 0}
.grupo{max-width:760px;margin:0 0 6px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.grupo summary{cursor:pointer;font-size:14px}
.grupo .esc{margin-top:6px}
.sit{color:var(--sit)}
.filtros{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub);margin:0 0 10px;max-width:760px}
@media (max-width:760px){.tabs button{flex:0 0 auto}}
.hecho{font:12.5px ui-monospace,Menlo,monospace;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);cursor:pointer;white-space:nowrap}
.hecho:hover{border-color:var(--sub)}.hecho.no{text-decoration:line-through}.hecho.falta{opacity:.7}
dialog{max-width:min(620px,92vw);border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:14px 20px}
dialog::backdrop{background:rgba(0,0,0,.35)}dialog ul{margin:4px 0 8px;padding-left:20px;font-size:14px}
</style></head><body>

<script>
const D = {"escenas":[{"id":"rachel_ventana","origen":"guion","si":["capitulo","marca:rachel_ve"],"o":[],"empieza":[],"termina":[],"narra":["Avonlea, un pueblito de granjas en la Isla del Príncipe Eduardo, en Canadá, a fines del siglo XIX. Una tarde de comienzos de junio.","La Sra. Rachel Lynde vive donde el camino baja a la hondonada, y desde su ventana no se le escapa nada de lo que pasa en Avonlea. Y hoy ve algo rarísimo: Matthew Cuthbert, el hombre más tímido del pueblo, sale en la calesa, de cuello blanco y su mejor traje."],"L":[{"q":"lynde","t":"¡Matthew Cuthbert, con cuello blanco y en la calesa! ¿Adónde irá? No me quedo tranquila: voy ahora mismo a Tejas Verdes."}],"a_prueba":true,"canal":"rl","prioridad":"6","en":"lynde=rl","tipo":"escena"},{"id":"mesa_tres","origen":"guion","si":["capitulo","marca:mesa_tres"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Tres platos. Matthew, yo… y el niño."}],"a_prueba":true,"canal":"gg","prioridad":"4","en":"marilla=gg","tipo":"escena"},{"id":"rachel_marilla","origen":"guion","si":["capitulo","hecho:rachel_llego_tejas_verdes"],"o":[],"empieza":["marca marilla_cuenta | Marilla le contó a Rachel que Matthew fue a Bright River a buscar a un niño huérfano de Nueva Escocia."],"termina":["hecho rachel_lo_sabe","saber lynde huerfano","meta lynde estar_en casa_bell,-,- | Rachel va a casa de los Bell a contar la noticia | ir a casa de Robert Bell a contar la noticia (cap. 1) | 3"],"narra":[],"L":[{"q":"marilla","t":"Buenas tardes, Rachel. Qué tarde tan linda, ¿no? Siéntate. ¿Cómo están todos en tu casa?"},{"q":"lynde","t":"Todos bastante bien. Aunque temí que tú no lo estuvieras, Marilla, cuando vi salir a Matthew. Pensé que iba a buscar al doctor."},{"q":"marilla","t":"Oh, no, estoy muy bien, aunque ayer tuve un dolor de cabeza terrible."},{"q":"marilla","t":"Matthew fue a Bright River. Vamos a traer a un niñito de un orfanato de Nueva Escocia, y llega esta noche en el tren."},{"q":"lynde","t":"…  …  ¿Lo dices en serio, Marilla?"},{"q":"marilla","t":"Sí, por supuesto."},{"q":"lynde","t":"¡Un niño! ¡Ustedes dos, de entre toda la gente! ¿Pero qué cosa en el mundo les metió esa idea en la cabeza?"},{"q":"marilla","t":"Lo venimos pensando hace tiempo, todo el invierno. La señora Alexander Spencer vino antes de Navidad y dijo que en primavera traería a una niñita del orfanato de Hopeton."},{"q":"marilla","t":"Así que Matthew y yo lo hemos conversado de vez en cuando. Decidimos traer un niño. Matthew ya tiene sus años, sesenta, y no está tan ágil como antes."},{"q":"marilla","t":"El corazón le molesta bastante. Y tú sabes lo difícil que está conseguir peones: solo esos muchachitos franceses a medio criar."},{"q":"marilla","t":"Y apenas uno les enseña algo, se van a las fábricas de conservas de langosta o a los Estados Unidos."},{"q":"marilla","t":"Matthew quería un niño de Inglaterra, pero le dije que no, rotundo: nada de pilluelos de las calles de Londres. Por lo menos uno nacido en Canadá."},{"q":"marilla","t":"Así que le mandamos recado a la señora Spencer con la familia de Richard Spencer, en Carmody: que nos trajera un niño listo y despierto de unos diez u once años."},{"q":"marilla","t":"Es la mejor edad: lo bastante grande para ayudar en las tareas y lo bastante chico para criarlo como se debe. Le daremos un buen hogar y escuela."},{"q":"marilla","t":"Hoy llegó un telegrama de la señora Spencer; lo trajo el cartero. Llegan en el tren de las cinco y media. Ella lo deja en Bright River y sigue hasta White Sands."},{"q":"lynde","t":"Bueno, Marilla, te lo digo derecho: creo que están haciendo una tontería enorme, una cosa arriesgada, eso es lo que es. No saben lo que van a recibir."},{"q":"lynde","t":"Meten a un niño extraño en su casa sin saber nada de él: ni su carácter, ni qué clase de padres tuvo, ni cómo va a salir."},{"q":"lynde","t":"¡Si la semana pasada leí en el diario que un matrimonio del oeste de la Isla sacó a un niño de un orfanato, y él les prendió fuego a la casa de noche!"},{"q":"lynde","t":"¡A propósito, Marilla! Casi los deja tostados en sus camas. Y sé de otro niño adoptado que se chupaba los huevos; no hubo forma de quitarle la maña."},{"q":"lynde","t":"Si me hubieras pedido consejo, cosa que no hiciste, Marilla, te habría dicho: ¡por el amor de Dios, ni lo pienses! Eso es lo que te habría dicho."},{"q":"marilla","t":"No niego que algo de razón tienes, Rachel. Yo también he tenido mis dudas. Pero Matthew estaba empeñadísimo, se lo noté, así que cedí."},{"q":"marilla","t":"Es tan raro que Matthew se empeñe en algo, que cuando lo hace siento que es mi deber ceder."},{"q":"marilla","t":"Y riesgos hay en casi todo en este mundo. Hasta los hijos propios no siempre salen bien. Además, Nueva Escocia está aquí al lado: no puede ser muy distinto de nosotros."},{"q":"lynde","t":"Bueno, ojalá todo salga bien. Pero después no digas que no te advertí si quema Tejas Verdes o echa estricnina al pozo."},{"q":"lynde","t":"Supe de un caso en Nuevo Brunswick: un huérfano de asilo hizo eso y la familia entera murió entre dolores espantosos. Aunque en ese caso era una niña."},{"q":"marilla","t":"Bueno, nosotros no vamos a traer una niña. Jamás se me ocurriría criar a una niña. Me sorprende la señora Spencer."},{"q":"marilla","t":"Pero, en fin, ella sería capaz de adoptar un orfanato entero si se le metiera en la cabeza."},{"q":"lynde","t":"Bueno, bueno… no te quito más tiempo, Marilla. Que Dios los ayude con ese niño, eso es lo que digo."}],"a_prueba":true,"canal":"gg","prioridad":"9","interrumpe":true,"sujeta":"lynde, marilla","en":"lynde=gg, marilla=gg","tipo":"escena"},{"id":"rachel_bell","origen":"guion","si":["capitulo","hecho:rachel_en_casa_bell"],"o":[],"empieza":[],"termina":["soltar srbell","meta lynde estar_en h:rl,-,21.5 | Rachel vuelve a su casa, a la ventana | volver a casa, tomar el té y vigilar el camino desde la ventana (cap. 1)"],"narra":[],"L":[{"q":"lynde","t":"¡Robert, señora Bell, no van a creer lo que les vengo a contar! Siéntense, que es para caerse de espaldas, eso es lo que es."},{"q":"bell","t":"¿Qué pasa, Rachel? ¿Hay alguien enfermo?"},{"q":"lynde","t":"¡Matthew y Marilla Cuthbert van a adoptar a un niño! ¡De un orfanato de Nueva Escocia! Matthew fue a buscarlo a Bright River esta misma tarde, con cuello blanco."},{"q":"bell","t":"¡No me diga! ¿Los Cuthbert? ¿Ellos, que no saben nada de niños?"},{"q":"lynde","t":"Eso mismo digo yo. Una tontería y un riesgo. Pero nadie me pidió consejo, claro. Ya verán si no termina quemándoles la casa. Quedan advertidos."},{"q":"bell","t":"Bueno, Rachel, habrá que ver qué tal sale el muchacho."}],"a_prueba":true,"canal":"bell","prioridad":"9","sujeta":"lynde","cerca":"lynde, casa_bell, 160","tipo":"escena"},{"id":"estacion","origen":"guion","si":["capitulo","hecho:matthew_en_estacion","ana_visible","escena_ana:br"],"o":[],"empieza":["marca jefe_explica | El jefe de estación le explicó a Matthew que solo había llegado una niña; Matthew decidió llevarla a casa y que Marilla aclarara el error."],"termina":["ana sit=false","meta matthew llevar ana,cocina | | llevar a la niña a Tejas Verdes en la calesa (cap. 2) | 3","hecho primer_viaje"],"narra":["En la estación de Bright River, a ocho millas de Avonlea. Matthew viene a buscar al niño del orfanato que la Sra. Spencer quedó en traer. Pero en el andén no hay ningún niño."],"L":[{"q":"matthew","t":"Disculpe… ¿falta mucho para el tren de las cinco y media?"},{"q":"jefe","t":"El tren de las cinco y media pasó hace media hora. Pero dejaron a una pasajera para usted: una niñita. Está sentada allá, sobre las tejuelas."},{"q":"jefe","t":"Le pedí que entrara a la sala de espera de señoras, pero me dijo muy seria que prefería quedarse afuera: «Hay más campo para la imaginación». Es todo un caso."},{"q":"matthew","t":"Yo no espero a una niña. Vine a buscar a un niño. Debería estar aquí. La señora Alexander Spencer iba a traérmelo de Nueva Escocia."},{"q":"jefe","t":"(silba) Debe haber algún error. La señora Spencer bajó del tren con esa niña y me la dejó a cargo."},{"q":"jefe","t":"Dijo que usted y su hermana la iban a adoptar y que vendría por ella en un rato. Es todo lo que sé, y no tengo más huérfanos escondidos por aquí."},{"q":"matthew","t":"No entiendo…"},{"q":"jefe","t":"Mejor pregúntele a la niña. Seguro que se lo explica: tiene lengua propia, eso es seguro. A lo mejor se les acabaron los niños de la marca que usted quería."},{"q":"ana","t":"Supongo que usted es el señor Matthew Cuthbert, de Tejas Verdes. Me alegro mucho de verlo. Ya empezaba a temer que no viniera por mí."},{"q":"ana","t":"Estaba imaginándome todas las cosas que podrían haberle impedido venir."},{"q":"ana","t":"Había decidido que, si no venía esta noche, me iría por la vía hasta ese gran cerezo silvestre de la curva y me subiría a dormir ahí. No me daría ni un poquito de miedo."},{"q":"ana","t":"¿No sería precioso dormir en un cerezo silvestre todo blanco de flores a la luz de la luna? Una podría imaginar que vive en salones de mármol, ¿no cree?"},{"q":"ana","t":"Y estaba segura de que vendría por mí en la mañana, si no venía esta noche."},{"q":"matthew","t":"Siento haber llegado tarde. Vamos. El caballo está allá en el patio. Dame tu bolso."},{"q":"ana","t":"¡Oh, yo puedo llevarlo! No pesa. Traigo todos mis bienes terrenales, pero no pesa. Y si no se toma de cierta manera, el asa se sale; yo sé el truco exacto."},{"q":"ana","t":"Es un bolso de alfombra viejísimo. ¡Oh, qué contenta estoy de que haya venido, aunque habría sido lindo dormir en un cerezo silvestre!"},{"q":"ana","t":"Tenemos que recorrer un buen trecho, ¿no? La señora Spencer dijo que eran ocho millas. Me alegro, porque me encanta andar en coche."},{"q":"ana","t":"¡Oh, parece tan maravilloso que voy a vivir con ustedes y a pertenecerles! Nunca le he pertenecido a nadie, no de verdad. Pero el orfanato fue lo peor."},{"q":"ana","t":"Solo estuve cuatro meses, pero bastó. Supongo que usted nunca fue huérfano en un orfanato, así que no puede entender cómo es. Es peor que todo lo imaginable."},{"q":"ana","t":"Eran buenos, ¿sabe?, la gente del orfanato. Pero hay tan poco campo para la imaginación… solo en los otros huérfanos."},{"q":"ana","t":"Yo imaginaba que la niña de al lado era en realidad hija de un conde, robada en la cuna por una niñera cruel que murió antes de poder confesar."},{"q":"ana","t":"Me quedaba despierta de noche imaginando esas cosas, porque de día no tenía tiempo. Por eso debo estar tan flaca. Soy terriblemente flaca, ¿no?"},{"q":"ana","t":"No tengo nada de carne en los huesos. Me encanta imaginar que soy rellenita y que tengo hoyuelos en los codos."},{"q":"matthew","t":"Bueno, pues… aquí está la calesa. Sube."}],"a_prueba":true,"canal":"br","prioridad":"9","sujeta":"matthew","en":"matthew=br","marcas":"8=matthew_nina","tipo":"escena"},{"id":"avenida","origen":"guion","si":["hecho:primer_viaje"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Lo que es seguro es que nunca seré angelicalmente buena. La señora Spencer dice… ¡oh, señor Cuthbert! ¡Oh, señor Cuthbert!! ¡Oh, señor Cuthbert!!!"},{"q":"ana","t":"(Ana enmudece. Se queda mirando la bóveda de flores, con las manos juntas, como si estuviera en una iglesia.)"},{"q":"matthew","t":"(Matthew la mira de reojo. No dice nada, para no romper el encanto.)"},{"q":"ana","t":"(…)"}],"a_prueba":true,"canal":"viaje","prioridad":"10","interrumpe":true,"calesa":"camino","camino":"tramo=avenida","tipo":"escena"},{"id":"newbridge","origen":"guion","si":["hecho:primer_viaje","dicha:avenida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Callada todavía. Los perros les ladran, los chicos gritan desde las cercas, hay caras curiosas en las ventanas: Ana no ve nada de eso.)"}],"a_prueba":true,"canal":"viaje","prioridad":"8","interrumpe":true,"calesa":"camino","camino":"tramo=Newbridge","tipo":"escena"},{"id":"avenida_petalos","origen":"guion","si":["hecho:primer_viaje","dicha:avenida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana echa la cabeza atrás para mirar la bóveda de flores. Los pétalos le caen en el pelo y no se los quita.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"12","calesa":"camino","camino":"tramo=avenida","tipo":"escena"},{"id":"avenida_paso","origen":"guion","si":["hecho:primer_viaje","dicha:avenida_petalos"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"matthew","t":"(Matthew afloja las riendas. La yegua va al paso, como si también ella quisiera que esto no se acabara.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"12","calesa":"camino","camino":"tramo=avenida","tipo":"escena"},{"id":"avenida_roseton","origen":"guion","si":["hecho:primer_viaje","dicha:avenida_paso"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Al fondo de la Avenida, el cielo del atardecer brilla como el rosetón de una catedral.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"12","calesa":"camino","camino":"tramo=avenida","tipo":"escena"},{"id":"newbridge_ventanas","origen":"guion","si":["hecho:primer_viaje","dicha:newbridge"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Las ventanas del pueblo se encienden una a una. Ana sigue mirando hacia atrás, hacia donde quedó la Avenida.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"12","calesa":"camino","camino":"tramo=Newbridge","tipo":"escena"},{"id":"silencio_manos","origen":"guion","si":["hecho:primer_viaje","dicha:avenida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Ana va callada, con las manos juntas sobre el bolso de alfombra y los ojos en el cielo del oeste.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"14","calesa":"camino","camino":"tramo=campos","tipo":"escena"},{"id":"silencio_matthew","origen":"guion","si":["hecho:primer_viaje","dicha:silencio_manos"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"matthew","t":"(Matthew la mira de reojo. Nunca pensó que el silencio de una niña pudiera ser tan cómodo.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"14","calesa":"camino","camino":"tramo=campos","tipo":"escena"},{"id":"silencio_estrella","origen":"guion","si":["hecho:primer_viaje","dicha:silencio_matthew"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"(Sobre los campos aparece la primera estrella. Ana mueve los labios: quizás le está pidiendo un deseo.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"14","calesa":"camino","camino":"tramo=campos","tipo":"escena"},{"id":"silencio_ranas","origen":"guion","si":["hecho:primer_viaje","dicha:silencio_estrella"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"matthew","t":"(En una laguna junto al camino empiezan a cantar las ranas. La yegua resopla: ya huele su casa.)"}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"14","calesa":"camino","camino":"tramo=campos","tipo":"escena"},{"id":"silencio_nombre","origen":"guion","si":["hecho:primer_viaje","dicha:silencio_ranas"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Blanco… de las Delicias… no, todavía no…","piensa":true}],"a_prueba":true,"canal":"viaje","prioridad":"1.5","pausa":"14","calesa":"camino","camino":"tramo=campos","tipo":"escena"},{"id":"nombra_avenida","origen":"guion","si":["hecho:primer_viaje","dicha:avenida"],"o":[{"si":[],"resto":"calesa=camino camino.desde=.955"},{"si":[],"resto":"calesa=avonlea cerca=matthew,letrero_br,2500"}],"empieza":["log Matthew rompió el silencio: «solo nos falta una milla»."],"termina":[],"narra":[],"L":[{"q":"matthew","t":"(después de Newbridge y tres millas de silencio) Supongo que estarás bien cansada y con hambre. Pero ya no falta mucho: solo una milla más."},{"q":"ana","t":"Oh, señor Cuthbert… ese lugar por el que pasamos, ese lugar blanco… ¿qué era?"},{"q":"matthew","t":"Bueno, pues, debes referirte a la Avenida. Es un lugar bonito, más o menos."},{"q":"ana","t":"¿Bonito? Oh, «bonito» no parece la palabra justa. Ni «hermoso» tampoco. No alcanzan. ¡Oh, era maravilloso, maravilloso!"},{"q":"ana","t":"Pero no deberían llamar «la Avenida» a ese lugar tan precioso. Ese nombre no significa nada. Deberían llamarlo… a ver…"},{"ops":[{"t":"el Camino Blanco de las Delicias","propia":true,"L":[{"q":"ana","t":"¡El Camino Blanco de las Delicias! ¿No es un nombre bonito e imaginativo?"},{"ef":"nombrar avenida"}]},{"t":"Otro nombre…","propia":false,"L":[{"q":"ana","t":"¡El Camino Blanco de las Delicias! ¿No es un nombre bonito e imaginativo?"},{"ef":"nombrar avenida ?"}]}]},{"q":"ana","t":"Otros podrán llamarlo la Avenida, pero yo siempre le diré el Camino Blanco de las Delicias."}],"a_prueba":true,"resumen":"Ana le pone nombre a la Avenida (en el libro, «el Camino Blanco de las Delicias»).","canal":"viaje","prioridad":"9","interrumpe":true,"marcas":"0=una_milla","tipo":"escena"},{"id":"lago","origen":"guion","si":["hecho:primer_viaje"],"o":[],"empieza":["log Matthew le mostró la laguna de Barry."],"termina":[],"narra":[],"L":[{"q":"matthew","t":"Ésa es la laguna de Barry."},{"q":"ana","t":"Oh, ese nombre tampoco me gusta. La llamaré… a ver…"},{"ops":[{"t":"el Lago de las Aguas Brillantes","propia":true,"L":[{"q":"ana","t":"El Lago de las Aguas Brillantes. Sí, ése es su nombre verdadero. Lo sé por el escalofrío."},{"ef":"nombrar lago"}]},{"t":"Otro nombre…","propia":false,"L":[{"q":"ana","t":"El Lago de las Aguas Brillantes. Sí, ése es su nombre verdadero. Lo sé por el escalofrío."},{"ef":"nombrar lago ?"}]}]},{"q":"ana","t":"Cuando doy con un nombre que calza exacto, siento un escalofrío. ¿A usted las cosas le dan escalofríos?"},{"q":"matthew","t":"Bueno, pues, sí. Siempre me da como un escalofrío ver esos gusanos blancos y feos que salen al cavar en los almácigos de pepinos. Detesto cómo se ven."},{"q":"ana","t":"Yo siempre les doy las buenas noches a las cosas que quiero, igual que a las personas. Creo que les gusta. Esa agua parece estar sonriéndome."}],"a_prueba":true,"resumen":"Matthew le muestra la laguna de Barry, y Ana le pone nombre (en el libro, «el Lago de las Aguas Brillantes»).","canal":"viaje","prioridad":"9","interrumpe":true,"calesa":"avonlea","cerca":"matthew, lago, 1300","marcas":"0=lago","tipo":"escena"},{"id":"tejas_verdes","origen":"guion","si":["hecho:primer_viaje","dicha:lago"],"o":[{"si":["y_mayor:matthew:61"],"resto":"calesa=avonlea cerca=matthew,tejas_verdes,1700"},{"si":["capitulo","hecho:matthew_llego_casa","!hecho:llegaron"],"resto":""}],"empieza":["log Ana adivinó cuál era Tejas Verdes, bajo una gran estrella blanca."],"termina":[],"narra":[],"L":[{"q":"matthew","t":"Ya estamos bien cerca de casa. Ésa de allá es Tejas Verdes…"},{"q":"ana","t":"¡Oh, no me diga! (le baja el brazo y cierra los ojos) Déjeme adivinar. Estoy segura de que adivinaré."},{"q":"ana","t":"(abre los ojos y mira las granjas, una por una) ¿Es ésa, verdad? La de la izquierda, lejos del camino, blanca de árboles en flor, con esa gran estrella encima."},{"q":"matthew","t":"(sacude las riendas, encantado) ¡Bueno, pues, adivinaste! Pero me imagino que la señora Spencer te la describió para que la reconocieras."},{"q":"ana","t":"No, no lo hizo, de verdad que no. Lo que dijo podría haber sido de casi cualquiera de esas casas. Pero apenas la vi, sentí que era mi hogar."},{"q":"matthew","t":"Bueno, pues… ya llegamos."},{"q":"ana","t":"(en el patio oscuro, mientras él la baja) Escuche a los árboles hablando en sueños. ¡Qué lindos sueños deben tener!"}],"a_prueba":true,"canal":"viaje","prioridad":"9","interrumpe":true,"marcas":"2=adivina_tv","tipo":"escena"},{"id":"llegada","origen":"guion","si":["capitulo","hecho:llegaron","canal_libre:viaje","escena_ana:gg"],"o":[],"empieza":["log Marilla vio a la niña de pelo rojo: «Matthew Cuthbert, ¿quién es ésa? ¿Dónde está el niño?»"],"termina":["fin_capitulo","hecho llegada_tv","olvidar primer_viaje"],"narra":[],"L":[{"q":"marilla","t":"Matthew Cuthbert, ¿quién es ésa? ¿Dónde está el niño?"},{"q":"matthew","t":"No había ningún niño. Solo estaba ella."},{"q":"marilla","t":"¡Ningún niño! Pero tiene que haber habido un niño. Le mandamos decir a la señora Spencer que trajera un niño."},{"q":"matthew","t":"Bueno, pues, no lo trajo. La trajo a ella. Le pregunté al jefe de estación. Y tuve que traerla a casa. No se podía quedar allá, fuera cual fuera el error."},{"q":"marilla","t":"¡Vaya, qué lindo enredo!"},{"q":"ana","t":"¡No me quieren! ¡No me quieren porque no soy un niño! Debí haberlo esperado. Nadie me ha querido nunca."},{"q":"ana","t":"Debí saber que era demasiado hermoso para durar. Debí saber que nadie me quería de verdad. ¡Oh, qué voy a hacer! ¡Me voy a poner a llorar!"}],"a_prueba":true,"resumen":"Llegan a Tejas Verdes: Marilla ve a la niña y pregunta dónde está el niño.","canal":"gg","prioridad":"10","sujeta":"matthew, marilla","en":"marilla=gg","marcas":"0=marilla_nino","tipo":"escena"},{"id":"relleno","origen":"guion","si":[],"o":[],"empieza":[],"termina":[],"narra":[],"L":[],"a_prueba":true,"canal":"viaje","tipo":"escena","prioridad":"0","repetir":"cada 30","calesa":"camino","camino":"no_callado"},{"id":"carta_diana_1","origen":"guion","si":["hecho:se_queda","carta:diana","hecho:conocidas_diana"],"o":[],"empieza":[],"termina":["hecho carta_a_diana"],"narra":[],"L":[{"q":"ana","t":"(Ana moja la pluma en el tintero y se queda mirando el papel en blanco.)"},{"q":"carta","t":"Mi queridísima Diana, amiga del alma:"},{"q":"ana","t":"«Queridísima» es poco. ¿Existirá «requetequeridísima»? En la escuela dirían que es un adjetivo de más… pero el corazón no cuenta adjetivos."},{"q":"carta","t":"Te escribo desde mi cuarto del alero, con la ventana abierta. Aquí en Tejas Verdes {estacion}."},{"q":"carta","t":"{noticia}"},{"q":"ana","t":"(Se le escapa una gota de tinta.) ¡Ay, no! Una mancha justo encima de «alero». Bueno, ahora parece una golondrina. Una golondrina de tinta. Lo dejo así: es poético."},{"q":"carta","t":"Hoy pensé que si fuéramos princesas encerradas en una torre, nos mandaríamos cartas con una paloma blanca."},{"q":"ana","t":"Yo sería la princesa Cordelia, de cabellos negro azabache… y Diana la princesa Geraldine, que ya tiene el pelo negro, así que a ella le cuesta menos imaginarse."},{"q":"ana","t":"Pero el correo de Avonlea es casi lo mismo que una paloma, ¿no? Salvo que el Sr. Lawson no tiene alas. Ni plumas. Tiene bigote."},{"q":"carta","t":"Prométeme que el sábado vamos al Bosque Encantado, aunque nos dé un poquito de miedo."},{"q":"ana","t":"(Mira por la ventana un rato largo, con la pluma en la boca.)"},{"q":"ana","t":"¿Y si le cuento lo del fantasma de la Burbuja de la Dríada? No… Marilla dice que esas cosas no se ponen por escrito. Quedan escritas, justamente."},{"q":"carta","t":"Tu amiga del alma hasta la muerte, Ana (con una sola n)."},{"q":"ana","t":"Listo. ¡La doblo como un abanico, para que se vea elegante!"}],"canal":"carta","prioridad":"5","entre":"5","tipo":"carta"},{"id":"carta_diana_2","origen":"guion","si":["hecho:se_queda","carta:diana","dicha:carta_diana_1","hecho:conocidas_diana"],"o":[],"empieza":[],"termina":["hecho carta_a_diana"],"narra":[],"L":[{"q":"ana","t":"(Ana estira el papel con la palma de la mano, muy seria.)"},{"q":"carta","t":"Mi queridísima Diana:"},{"q":"carta","t":"Aquí en Tejas Verdes {estacion}."},{"q":"carta","t":"{noticia}"},{"q":"ana","t":"Una carta tiene que tener una noticia, una confidencia y una promesa. Lo leí en alguna parte. O me lo imaginé. Casi es lo mismo."},{"q":"carta","t":"Te cuento una confidencia: a veces le hablo a mi reflejo en la puerta de la alacena. Se llama Katie Maurice y era mi única amiga antes de ti."},{"q":"ana","t":"¿Se reirá? Diana no se ríe de esas cosas. Bueno, un poquito. Pero con cariño."},{"q":"ana","t":"(Dibuja una flor en el margen, y luego otra, y luego una enredadera entera.)"},{"q":"carta","t":"Y una promesa: mientras el sol y la luna existan, serás mi amiga del alma."},{"q":"ana","t":"¡Ay, la enredadera se comió media hoja! Ya no queda lugar para la posdata."},{"q":"carta","t":"P. D.: La enredadera la hice yo. Es una enredadera de amistad."},{"q":"carta","t":"Tuya siempre, Ana (con una sola n)."}],"canal":"carta","prioridad":"5","repetir":"siempre","entre":"5","tipo":"carta"},{"id":"carta_stacy_1","origen":"guion","si":["hecho:se_queda","carta:stacy","conoce:stacy","hecho:llego_stacy"],"o":[],"empieza":[],"termina":["hecho carta_a_stacy"],"narra":[],"L":[{"q":"ana","t":"(Ana se sienta derechita, como en la escuela, y moja la pluma.)"},{"q":"carta","t":"Querida Srta. Stacy:"},{"q":"carta","t":"Aquí en Tejas Verdes {estacion}."},{"q":"ana","t":"Así empiezan las cartas de los libros: con el tiempo que hace. Debe ser porque es lo único que todos saben."},{"q":"carta","t":"Le escribo para contarle que terminé de leer el libro que nos recomendó, y que lloré en el capítulo once."},{"q":"ana","t":"En realidad lloré en el diez también, pero lo del once fue más llanto. Más… literario."},{"q":"carta","t":"{noticia}"},{"q":"ana","t":"(Tacha una palabra con tres rayas.) «Indescriptible» no: ya lo usé dos veces esta semana. La Srta. Stacy dice que una palabra gastada es como un vestido con brillo en los codos."},{"q":"carta","t":"Estuve pensando en lo que dijo de los adjetivos: esta carta tiene solo los indispensables. Bueno, casi."},{"q":"ana","t":"(Cuenta los adjetivos con los dedos, y se le acaban los dedos.)"},{"q":"carta","t":"Quería decirle que gracias a usted estudiar ya no me parece un castigo, sino una aventura."},{"q":"carta","t":"Su alumna que la quiere, Ana Shirley."}],"canal":"carta","prioridad":"5","entre":"5","tipo":"carta"},{"id":"carta_stacy_2","origen":"guion","si":["hecho:se_queda","carta:stacy","dicha:carta_stacy_1","conoce:stacy","hecho:llego_stacy"],"o":[],"empieza":[],"termina":["hecho carta_a_stacy"],"narra":[],"L":[{"q":"ana","t":"(Ana mira el techo, buscando las palabras entre las vigas.)"},{"q":"carta","t":"Querida Srta. Stacy:"},{"q":"carta","t":"Aquí en Tejas Verdes {estacion}."},{"q":"carta","t":"Le escribo desde Tejas Verdes con una pregunta muy importante: ¿cree usted que yo podría llegar a escribir un libro de verdad?"},{"q":"ana","t":"Un libro con tapas verdes y letras doradas. «Por Ana Shirley». No: «por Cordelia Fitzgerald»… no, mejor con mi nombre. Que se sepa."},{"q":"carta","t":"Ya tengo el título. Lo que me falta es todo lo demás."},{"q":"carta","t":"{noticia}"},{"q":"ana","t":"(Se queda quieta, con la pluma en el aire, mirando por la ventana.) El título es lo más difícil. Lo demás es… bueno, lo demás también es difícil."},{"q":"carta","t":"Le prometo que no voy a usar más de tres adjetivos por oración. Esta frase tiene cero. ¿Ve?"},{"q":"carta","t":"Su alumna que la quiere, Ana Shirley."}],"canal":"carta","prioridad":"5","repetir":"siempre","entre":"5","tipo":"carta"},{"id":"carta_sraallan_1","origen":"guion","si":["hecho:se_queda","carta:sraallan","conoce:sraallan"],"o":[],"empieza":[],"termina":["hecho carta_a_sraallan"],"narra":[],"L":[{"q":"ana","t":"(Ana busca su mejor papel, el que tiene un borde de florcitas.)"},{"q":"carta","t":"Querida Sra. Allan:"},{"q":"carta","t":"Aquí en Tejas Verdes {estacion}."},{"q":"carta","t":"Le escribo para darle las gracias por el té de la otra tarde. Fue uno de los momentos más elegantes de mi vida."},{"q":"ana","t":"Usé la taza con rosas y no se me cayó nada. Ni una miga. Bueno, una miga. Pero chiquita."},{"q":"carta","t":"{noticia}"},{"q":"ana","t":"¿Le cuento lo del pastel con linimento? No… eso fue antes, y ella fue tan buena que hizo como si no pasara nada. Mejor no recordárselo."},{"q":"carta","t":"Sigo pensando en lo que usted dijo de ser buena. Lo estoy intentando todos los días, aunque algunos días me resulta mejor que otros."},{"q":"ana","t":"(Suspira.) Los martes, por ejemplo, me resulta peor. No sé por qué. Debe ser algo de los martes."},{"q":"carta","t":"Con todo cariño, Ana Shirley."}],"canal":"carta","prioridad":"5","entre":"5","tipo":"carta"},{"id":"carta_sraallan_2","origen":"guion","si":["hecho:se_queda","carta:sraallan","dicha:carta_sraallan_1","conoce:sraallan"],"o":[],"empieza":[],"termina":["hecho carta_a_sraallan"],"narra":[],"L":[{"q":"ana","t":"(Ana escribe despacio, con su mejor letra.)"},{"q":"carta","t":"Querida Sra. Allan:"},{"q":"carta","t":"Aquí en Tejas Verdes {estacion}."},{"q":"carta","t":"{noticia}"},{"q":"carta","t":"En la escuela dominical aprendimos el salmo de los pastos verdes, y me acordé de usted, porque usted hace que todo parezca un pasto verde."},{"q":"ana","t":"¿Se entiende? Es una metáfora. Las metáforas son como los sombreros: hay que saber llevarlas."},{"q":"carta","t":"Quería preguntarle si un espíritu afín puede ser también una persona mayor. Yo creo que sí, y que usted es una prueba."},{"q":"carta","t":"Con todo cariño, Ana Shirley."}],"canal":"carta","prioridad":"5","repetir":"siempre","entre":"5","tipo":"carta"},{"id":"carta_josephine_1","origen":"guion","si":["hecho:se_queda","carta:josephine","conoce:josephine"],"o":[],"empieza":[],"termina":["hecho carta_a_josephine"],"narra":[],"L":[{"q":"ana","t":"(Ana sopla la pluma antes de empezar, como si fuera a tocar una flauta.)"},{"q":"carta","t":"Querida tía Josephine (porque usted me dejó llamarla así):"},{"q":"carta","t":"Le escribo desde Avonlea, donde todo sigue igual de bonito que cuando usted vino de visita. Aquí {estacion}."},{"q":"carta","t":"{noticia}"},{"q":"ana","t":"(Se ríe sola.) Todavía me acuerdo de su cara cuando saltamos sobre la cama. ¡Parecía un fantasma con gorro de dormir!"},{"q":"carta","t":"Diana y yo todavía nos reímos de la noche en que saltamos sobre su cama. Bueno, ahora nos reímos; esa noche no tanto."},{"q":"ana","t":"Charlottetown debe ser enorme. Con calles de piedra, y tiendas con vidrieras, y gente que no se saluda porque no se conoce. Qué triste, eso último."},{"q":"carta","t":"Si alguna vez se aburre en su casa tan grande, acuérdese de que en Avonlea hay una niña que la quiere mucho."},{"q":"carta","t":"Su amiga que la recuerda siempre, Ana Shirley."}],"canal":"carta","prioridad":"5","entre":"5","tipo":"carta"},{"id":"carta_josephine_2","origen":"guion","si":["hecho:se_queda","carta:josephine","dicha:carta_josephine_1","conoce:josephine"],"o":[],"empieza":[],"termina":["hecho carta_a_josephine"],"narra":[],"L":[{"q":"ana","t":"(Ana se arregla el pelo antes de escribir, como si la tía Josephine pudiera verla.)"},{"q":"carta","t":"Querida tía Josephine:"},{"q":"carta","t":"Aquí en Avonlea {estacion}."},{"q":"carta","t":"{noticia}"},{"q":"ana","t":"Las cartas a Charlottetown tardan tres días. En tres días pueden pasar tantas cosas… cuando llegue, lo que le cuento ya será viejo. Como las estrellas, que uno ve su luz de antes."},{"q":"carta","t":"Le cuento que Matthew me regaló un vestido con mangas abullonadas. Son las mangas más abullonadas de toda la isla, creo."},{"q":"carta","t":"Su amiga que la recuerda siempre, Ana Shirley."}],"canal":"carta","prioridad":"5","repetir":"siempre","entre":"5","tipo":"carta"},{"id":"carta_spencer_prueba","origen":"guion","si":["carta:spencer","!hecho:se_queda","hecho:desayuno_prueba"],"o":[],"empieza":[],"termina":["hecho carta_a_spencer"],"narra":[],"L":[{"q":"ana","t":"(Ana moja la pluma y se queda quieta un rato largo. Le tiembla un poco la mano.)"},{"q":"carta","t":"Querida Sra. Spencer:"},{"q":"carta","t":"Le escribo desde Tejas Verdes, donde estoy a prueba. Usted ya sabe que los Cuthbert querían un niño, para ayudar a Matthew en la granja."},{"q":"ana","t":"«A prueba». Suena como un pastel que todavía no saben si se les cayó o no."},{"q":"carta","t":"Marilla todavía no decide si me quedo. Yo me porto lo mejor que puedo, aunque a veces se me olvida."},{"q":"carta","t":"Aquí hay un cerezo debajo de mi ventana, y un arroyo, y una niña que se llama Diana en la granja de al lado."},{"q":"ana","t":"(Escribe una línea, la mira mucho rato, y no la tacha.)"},{"q":"carta","t":"Si me devuelven, ¿podría buscarme una casa donde haya árboles? Pero ojalá no haga falta."},{"q":"carta","t":"Su servidora, Ana Shirley"}],"a_prueba":true,"canal":"carta","prioridad":"5","entre":"5","tipo":"carta"},{"id":"carta_spencer_1","origen":"guion","si":["carta:spencer","hecho:se_queda"],"o":[],"empieza":[],"termina":["hecho carta_a_spencer"],"narra":[],"L":[{"q":"ana","t":"(Ana escribe con su mejor letra, como si la Sra. Spencer fuera a corregirla.)"},{"q":"carta","t":"Querida Sra. Spencer:"},{"q":"carta","t":"Aquí en Tejas Verdes {estacion}."},{"q":"carta","t":"Le escribo para contarle cómo me va, porque usted fue quien me trajo, aunque fuera por equivocación."},{"q":"carta","t":"{noticia}"},{"q":"carta","t":"Marilla es seria pero justa, y Matthew es la persona más buena del mundo. Creo que aquí sí me quieren un poquito."},{"q":"ana","t":"«Un poquito» es por modestia. Pero no le voy a poner «mucho», no vaya a ser que se gaste."},{"q":"carta","t":"Le doy las gracias por la equivocación: fue la más afortunada de mi vida."},{"q":"carta","t":"Su agradecida, Ana Shirley (de Tejas Verdes)"}],"resumen":"Ana le escribe a la Sra. Spencer cómo le va en Tejas Verdes.","canal":"carta","prioridad":"5","repetir":"siempre","entre":"5","tipo":"carta"},{"id":"resp_diana_1","origen":"guion","si":["hecho:se_queda","respuesta:diana","hecho:carta_a_diana"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"¡Qué carta tan bonita! La leí tres veces y la guardé en mi caja de cartas, con la cinta azul."},{"q":"carta","t":"Mamá dice que mañana puedo ir a Tejas Verdes después de los quehaceres. ¡Llevo el libro de poemas!"},{"q":"carta","t":"Tu amiga del alma, Diana"}],"canal":"respuesta","de":"diana","tipo":"carta"},{"id":"resp_diana_2","origen":"guion","si":["hecho:se_queda","respuesta:diana","hecho:carta_a_diana"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Queridísima Ana:"},{"q":"carta","t":"Tu carta me hizo reír tanto que Minnie May me preguntó qué pasaba. No le dije: es un secreto de amigas del alma."},{"q":"carta","t":"Guardé tu lugar en la escuela. Ruby quería sentarse, pero le dije que no."},{"q":"carta","t":"Siempre tuya, Diana"}],"canal":"respuesta","de":"diana","tipo":"carta"},{"id":"resp_stacy_1","origen":"guion","si":["hecho:se_queda","respuesta:stacy","hecho:carta_a_stacy"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Me alegró mucho recibir tu carta. Escribes con el corazón, y eso no se enseña."},{"q":"carta","t":"Sigue leyendo y escribiendo todos los días, aunque sea un poco. Y sí: usa menos adjetivos."},{"q":"carta","t":"Con cariño, Muriel Stacy"}],"canal":"respuesta","de":"stacy","tipo":"carta"},{"id":"resp_stacy_2","origen":"guion","si":["hecho:se_queda","respuesta:stacy","hecho:carta_a_stacy"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Claro que podrías escribir un libro. Empieza por una página, y después otra. Así se hacen todos."},{"q":"carta","t":"Te espero el lunes con tu composición."},{"q":"carta","t":"Tu maestra, M. Stacy"}],"canal":"respuesta","de":"stacy","tipo":"carta"},{"id":"resp_sraallan_1","origen":"guion","si":["hecho:se_queda","respuesta:sraallan","hecho:carta_a_sraallan"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Qué alegría me dio tu carta. A mí también me gustó mucho la tarde del té."},{"q":"carta","t":"Ser buena no es no equivocarse nunca, Ana: es seguir intentándolo. Y tú lo haces muy bien."},{"q":"carta","t":"Te quiere, la Sra. Allan"}],"canal":"respuesta","de":"sraallan","tipo":"carta"},{"id":"resp_josephine_1","origen":"guion","si":["hecho:se_queda","respuesta:josephine","hecho:carta_a_josephine"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Tu carta me hizo reír más que cualquier cosa en todo el invierno. Hacía años que no me reía así."},{"q":"carta","t":"Charlottetown es muy aburrido sin una niña como tú. Cuando vengas con Diana, iremos a la exposición."},{"q":"carta","t":"Tu vieja amiga, Josephine Barry"}],"canal":"respuesta","de":"josephine","tipo":"carta"},{"id":"resp_josephine_2","origen":"guion","si":["hecho:se_queda","respuesta:josephine","hecho:carta_a_josephine"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Mi querida Ana:"},{"q":"carta","t":"Recibí tu carta y la leí junto a la chimenea. Escribes como hablas, y eso es un gran elogio viniendo de mí."},{"q":"carta","t":"Te mando un saludo para Marilla, y para ti, mi cariño."},{"q":"carta","t":"J. Barry"}],"canal":"respuesta","de":"josephine","tipo":"carta"},{"id":"resp_spencer_prueba","origen":"guion","si":["respuesta:spencer","!hecho:se_queda","dicha:carta_spencer_prueba"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Recibí tu carta. No te preocupes antes de tiempo, niña: la Srta. Cuthbert es una mujer seria, pero justa."},{"q":"carta","t":"Ayuda en la casa, haz lo que te dicen y, sobre todo, no hables tanto. Eso es lo que más cansa a la gente mayor."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"a_prueba":true,"canal":"respuesta","de":"spencer","responde":"carta_spencer_prueba","tipo":"carta"},{"id":"resp_spencer_prueba_quedo","origen":"guion","si":["respuesta:spencer","hecho:se_queda","dicha:carta_spencer_prueba"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Cuando llegó tu carta ya me había enterado: ¡los Cuthbert se quedaron contigo! Ya ves que las cosas se arreglan, cuando una se porta bien."},{"q":"carta","t":"Ahora tienes casa, niña. Cuídala, y no hables tanto."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer contesta: se alegra de que los Cuthbert se queden con Ana.","canal":"respuesta","de":"spencer","responde":"carta_spencer_prueba","tipo":"carta"},{"id":"resp_spencer_conocidas_diana","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:conocidas_diana","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"¿Así que ya tienes una amiga, la niña de los Barry? Me alegro, Ana. Una buena amiga vale más que un vestido nuevo. Pero no la marees con tanta palabra."},{"q":"carta","t":"Y pórtate bien en casa de los Barry, que la Sra. Barry es muy estricta."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer contesta: se alegra de que Ana tenga una amiga, Diana.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"resp_spencer_zanahorias_pizarra","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:zanahorias_pizarra","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"¡Ana Shirley! ¿Cómo que le partiste la pizarra en la cabeza a un muchacho? Ya sé que te dijo zanahoria, pero una señorita no anda rompiendo pizarras."},{"q":"carta","t":"Pídele perdón, o por lo menos no lo hagas otra vez. Lo que se dice del pelo se olvida; lo que se hace, no."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer la reta por romperle la pizarra en la cabeza a Gilbert.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"resp_spencer_zanahorias_contesta","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:zanahorias_contesta","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Así que le contestaste a ese muchacho delante de toda la escuela. Hmm. No te voy a decir que hiciste mal, porque se lo buscó. Pero cuida esa lengua, Ana."},{"q":"carta","t":"Una lengua rápida da más disgustos que alegrías. Te lo digo yo, que tengo cuarenta años de práctica."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer: le contestó a Gilbert; que cuide esa lengua.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"resp_spencer_zanahorias_ignora","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:zanahorias_ignora","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Me cuentas que un muchacho se burló de tu pelo y que hiciste como si no existiera. Eso, Ana, es tener más juicio que muchas señoras que conozco."},{"q":"carta","t":"Sigue así. Y el pelo rojo se oscurece con los años, ya verás."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer la felicita por no hacerle caso a Gilbert.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"resp_spencer_ofendio_lynde","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:ofendio_lynde","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Me enteré, Ana. Rachel Lynde me escribió. ¿Cómo se te ocurre gritarle a una señora así, en la casa que te recibió?"},{"q":"carta","t":"Ve a pedirle perdón, niña. Aunque ella haya dicho lo que dijo. Así se hacen las cosas."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer supo que gritó a la Sra. Lynde: que le pida perdón.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"resp_spencer_lynde_llanto","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:lynde_llanto","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Me dices que la Sra. Lynde te llamó flaca y fea, y que te fuiste llorando. Ay, Ana. Rachel Lynde dice lo que piensa, y piensa demasiado."},{"q":"carta","t":"No le hagas caso. Y come más, que algo de razón tiene en lo de flaca."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer la consuela: la Sra. Lynde la trató de flaca y fea.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"resp_spencer_prohibida","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:prohibida","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Qué pena lo de la niña de los Barry. Vino de grosellas… ¡quién iba a pensar! Ten paciencia, Ana: las madres se ablandan con el tiempo."},{"q":"carta","t":"Mientras tanto, no la vayas a buscar a escondidas. Eso lo empeoraría todo."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer: qué pena lo de Diana; paciencia, y nada a escondidas.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"resp_spencer_1","origen":"guion","si":["respuesta:spencer","hecho:se_queda","hecho:carta_a_spencer"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"carta","t":"Querida Ana:"},{"q":"carta","t":"Me dio mucho gusto saber de ti. Ya ves que las cosas se arreglan solas, cuando una se porta bien."},{"q":"carta","t":"Saludos a la Srta. Cuthbert. Y no hables tanto, niña."},{"q":"carta","t":"Afectuosamente, la Sra. Spencer"}],"resumen":"La Sra. Spencer contesta la primera carta: que se porte bien y no hable tanto.","canal":"respuesta","de":"spencer","tipo":"carta"},{"id":"quiere_amiga","origen":"guion","si":["hecho:se_queda","hecho:pide_amiga","!hecho:quiere_amiga","!hecho:conocidas_diana"],"o":[],"empieza":[],"termina":["hecho quiere_amiga","log Ana le contó a Marilla que quería una amiga del alma, y Marilla le habló de Diana Barry. | yo: le conté a Marilla que quería una amiga del alma, y ella me habló de Diana Barry, la niña de La Cuesta del Huerto."],"narra":["Ana nunca ha tenido una amiga de verdad. En el orfanato y en las casas donde vivió, sus únicas amigas fueron imaginarias: Katie Maurice, la niña que vivía detrás del vidrio de una vitrina, y Violetta, el eco de un valle."],"L":[{"q":"ana","t":"Marilla, ¿cree usted que encontraré una amiga del alma en Avonlea?"},{"q":"marilla","t":"¿Una qué?"},{"q":"ana","t":"Una amiga del alma, una amiga íntima, ¿sabe?, un espíritu verdaderamente afín al que pueda confiarle lo más profundo de mi alma. He soñado con conocerla toda mi vida."},{"q":"marilla","t":"Diana Barry vive en La Cuesta del Huerto, y tiene más o menos tu edad. Es una niña muy buena; quizás sea una compañera de juegos para ti cuando vuelva a casa."},{"q":"ana","t":"¡Oh! ¿Y cómo es? ¿Tiene el pelo rojo? Espero que no. Ya es bastante malo que yo lo tenga."},{"q":"marilla","t":"Diana es muy bonita: ojos y pelo negros, y mejillas rosadas. Y es buena e inteligente, que es mejor que ser bonita. Un día de estos tengo que ir a ver a la Sra. Barry; si te portas bien, puedes venir conmigo."},{"q":"ana","t":"¡Oh, Marilla! Ahora tengo miedo: ¿y si no le gusto? Sería la desilusión más trágica de mi vida."}],"resumen":"Ana nunca tuvo una amiga de verdad y le cuenta a Marilla cuánto quiere una.","canal":"gg","prioridad":"7","interrumpe":true,"sujeta":"marilla","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"aviso_barry","origen":"guion","si":["hecho:se_queda","dias_desde:quiere_amiga:1","!hecho:conocidas_diana","!hecho:barry_presenta","presente:diana","hora:6-13"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"marilla","t":"Ana, esta tarde, después del almuerzo, voy a La Cuesta del Huerto a devolverle un patrón a la Sra. Barry. Si quieres conocer a Diana, no te vayas lejos."},{"q":"ana","t":"¡Oh, Marilla! Voy a estar aquí, quietecita como una estatua. Bueno… casi como una estatua."}],"resumen":"Marilla avisa que irá donde los Barry: Ana puede ir a conocer a Diana.","canal":"gg","prioridad":"5","repetir":"dia","sujeta":"marilla","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"barry_recibe","origen":"guion","si":["hecho:se_queda","hecho:quiere_amiga","!hecho:conocidas_diana","!hecho:barry_presenta"],"o":[],"empieza":["contar barry nina_cuthbert"],"termina":["hecho barry_presenta","meta diana estar_en h:os,-,- | Diana entra a conocer a la niña de Tejas Verdes | entrar a conocer a la niña de Tejas Verdes (cap. 12) | 3"],"narra":["La Cuesta del Huerto es la granja de los Barry, al otro lado del arroyo, frente a Tejas Verdes. Allí vive Diana, de la edad de Ana, con sus padres y su hermanita Minnie May. La Sra. Barry es una señora muy estricta."],"L":[{"q":"barry","t":"Buenas tardes, Marilla. ¡Qué sorpresa! Pasa, pasa. ¿Y ésta es la niña que adoptaron?"},{"q":"marilla","t":"Sí, ésta es Ana Shirley. Vengo a devolverle el patrón de la falda que me prestó."},{"q":"ana","t":"Ana con una sola n, por favor."},{"q":"barry","t":"¿Cómo estás, Ana? Diana está en el jardín. ¡Diana! Ven a conocer a la niña de los Cuthbert."}],"resumen":"En La Cuesta del Huerto, la Sra. Barry recibe a Marilla y Ana.","canal":"os","prioridad":"7","interrumpe":true,"sujeta":"marilla, barry","en":"ana=os, marilla=os","tipo":"escena"},{"id":"conoce_diana","origen":"guion","si":["hecho:se_queda","hecho:barry_presenta","!hecho:conocidas_diana"],"o":[],"empieza":[],"termina":["hecho conocidas_diana","afecto diana ana 4","afecto ana diana 5","log Ana conoció a Diana Barry en La Cuesta del Huerto: la Sra. Barry las presentó. | yo: conocí a Diana Barry en La Cuesta del Huerto. ¡Creo que vamos a ser amigas del alma!"],"narra":[],"L":[{"q":"barry","t":"Ésta es mi hija Diana. Diana, ¿por qué no llevas a Ana al jardín y le muestras tus flores?"},{"q":"diana","t":"Hola… ¿quieres venir a ver el jardín?"},{"q":"ana","t":"(Ana mira a Diana muy seria, sin atreverse a respirar.) Oh, Diana… ¿crees que podrías… que podrías quererme un poquito, lo bastante como para ser mi amiga del alma?"},{"q":"diana","t":"(Diana se ríe; Diana siempre se ríe antes de hablar.) Bueno, creo que sí. Me alegro mucho de que hayas venido a vivir a Tejas Verdes. Va a ser tan lindo tener a alguien con quien jugar."}],"resumen":"Ana conoce a Diana en el jardín de los Barry y le pide ser su amiga del alma.","canal":"os","prioridad":"8","interrumpe":true,"sujeta":"ana, diana","en":"ana=os, diana=os","tipo":"escena"},{"id":"diana_por_casualidad","origen":"guion","si":["hecho:se_queda","!hecho:conocidas_diana","!hecho:barry_presenta","!hecho:quiere_amiga"],"o":[],"empieza":[],"termina":["hecho conocidas_diana","afecto diana ana 2","afecto ana diana 4","log Ana y Diana se conocieron por casualidad. | yo: conocí a Diana Barry, por pura casualidad. Creo que vamos a ser amigas del alma."],"narra":[],"L":[{"q":"diana","t":"Hola… ¿Tú eres la niña que vino a vivir a Tejas Verdes?"},{"q":"ana","t":"Sí… soy Ana. Ana con una sola n. ¿Y tú… tú eres Diana Barry?"},{"q":"diana","t":"Sí. Mamá dice que eres muy rara. Pero no pareces rara. Bueno, un poquito."},{"q":"ana","t":"(Ana se pone colorada hasta las orejas.) Tengo una imaginación muy grande, eso es todo. ¿Te… te gustaría que algún día jugáramos juntas?"},{"q":"diana","t":"Bueno… tal vez. Tengo que volver a casa ahora."}],"resumen":"Ana y Diana se encuentran por casualidad, sin que nadie las presente.","disparo":"encuentro","quienes":"ana, diana","tipo":"escena"},{"id":"broche","origen":"guion","si":["cuaderno:amigas","dias_desde:conocidas_diana:5","!hecho:broche"],"o":[],"empieza":[],"termina":["hecho broche"],"narra":["Marilla tiene un broche de amatista que fue de su madre: lo más valioso que posee, y lo usa solo para ir a la iglesia. Y la escuela dominical va a hacer un picnic en el lago, con helado, algo que Ana nunca ha probado."],"L":[{"q":"marilla","t":"Ana, ¿has visto mi broche de amatista? Lo dejé en el alfiletero de mi cuarto y no está."},{"q":"ana","t":"Lo vi ayer… me lo probé, solo un minutito, y lo dejé otra vez en el tocador."},{"q":"marilla","t":"Pues no está. Ana, te quedas en tu cuarto hasta que me digas la verdad."},{"ops":[{"t":"Inventar una confesión, para poder ir al picnic","propia":true,"L":[{"q":"ana","t":"(Ana se queda en su cuarto, pensando en el picnic. Al final, inventa una confesión.) Me lo llevé para ser Lady Cordelia Fitzgerald… y se me cayó al Lago de las Aguas Brillantes. Ya confesé: ¿ahora puedo ir al picnic?"},{"q":"marilla","t":"¿Picnic? No irás a ningún picnic, Ana Shirley."},{"ef":"hecho broche_confeso"},{"ef":"log Marilla perdió su broche de amatista y culpó a Ana; Ana «confesó» para poder ir al picnic. | yo: Marilla perdió su broche de amatista y creyó que yo lo había tomado. Tuve que «confesar» para poder ir al picnic."}]},{"t":"Decir la verdad, aunque se quede sin picnic","propia":false,"L":[{"q":"ana","t":"(Ana se queda en su cuarto, con el picnic doliéndole en el pecho, y no inventa nada.) No lo tomé, Marilla. Se lo digo aunque me quede sin helado para siempre."},{"q":"marilla","t":"Entonces tampoco hay picnic. Cuando quieras decir otra cosa, me avisas."},{"ef":"hecho broche_verdad"},{"ef":"log Marilla perdió su broche de amatista y culpó a Ana; Ana siguió diciendo la verdad, aunque se quedara sin picnic. | yo: Marilla perdió su broche de amatista y creyó que yo lo había tomado. Le dije la verdad, aunque me quedara sin picnic."}]}]},{"q":"marilla","t":"(Marilla saca su chal negro para remendarlo… y algo brilla en el encaje.) ¡El broche! Estaba enganchado en mi chal…"},{"q":"marilla","t":"(Marilla sube la escalera, despacio.) Ana… lo encontré. Perdóname: no debí dudar de ti. Ve a prepararte para el picnic."},{"q":"ana","t":"(Ana baja la escalera de un salto, con los ojos brillando.) ¡Helado! ¡Por fin voy a probar el helado!"}],"resumen":"Desaparece el broche de amatista de Marilla, y Marilla culpa a Ana.","punto":"Antes del broche de amatista","grande":true,"canal":"gg","prioridad":"6","interrumpe":true,"sujeta":"marilla","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"zanahorias","origen":"guion","si":["hecho:se_queda","!hecho:zanahorias"],"o":[],"empieza":[],"termina":["hecho zanahorias","hecho conoce_gilbert"],"narra":["La escuela de Avonlea tiene una sola sala, para todos los niños del pueblo. Gilbert Blythe es el más listo y el más buen mozo, y está acostumbrado a que todas las niñas lo miren. Ana todavía no lo ha mirado."],"L":[{"q":"gilbert","t":"(Gilbert Blythe alarga la mano, toma la punta de una trenza de Ana y susurra, lo bastante fuerte para que lo oiga toda la clase.) ¡Zanahorias! ¡Zanahorias!"},{"ops":[{"t":"Partirle la pizarra en la cabeza","propia":true,"L":[{"q":"ana","t":"(Ana se pone de pie de un salto, con los ojos echando chispas.) ¡Odioso, malvado! ¿Cómo te atreves?"},{"q":"ana","t":"(¡Crac! Ana le parte la pizarra en la cabeza a Gilbert.)"},{"q":"gilbert","t":"¡Ay! Perdona, Ana… solo era una broma. De verdad, perdóname."},{"q":"ana","t":"¡Nunca te lo perdonaré! ¡Nunca jamás!"},{"ef":"hecho zanahorias_pizarra"},{"ef":"ofensa ana gilbert zanahorias -2"},{"ef":"log En la escuela, Gilbert Blythe le dijo «¡Zanahorias!» a Ana, y Ana le partió la pizarra en la cabeza. | yo: en la escuela, Gilbert Blythe me dijo «¡Zanahorias!» delante de todos… y le partí la pizarra en la cabeza."}]},{"t":"Hacer como que no lo oyó, con la frente en alto","propia":false,"L":[{"q":"ana","t":"(Ana se pone roja hasta las orejas… pero no se da vuelta. Mira el pizarrón como si Gilbert Blythe no existiera en el mundo.)"},{"q":"gilbert","t":"(Gilbert se queda con la trenza en la mano, desconcertado. Nadie lo había ignorado nunca.) Oye… solo era una broma."},{"q":"ana","t":"(Ana sigue mirando el pizarrón. Por dentro, le está partiendo mil pizarras en la cabeza.)"},{"ef":"hecho zanahorias_ignora"},{"ef":"ofensa ana gilbert zanahorias -1"},{"ef":"log En la escuela, Gilbert Blythe le dijo «¡Zanahorias!» a Ana, y Ana hizo como que no existía. | yo: en la escuela, Gilbert Blythe me dijo «¡Zanahorias!» delante de todos. Hice como que no existía."}]},{"t":"Contestarle, delante de todos","propia":false,"L":[{"q":"ana","t":"(Ana se da vuelta despacio.) Mejor zanahoria que cabeza hueca, Gilbert Blythe. Las zanahorias, por lo menos, sirven para algo."},{"q":"gilbert","t":"(Toda la clase se ríe… de Gilbert. Él se pone colorado.) Bueno… me lo merezco, supongo."},{"ef":"hecho zanahorias_contesta"},{"ef":"ofensa ana gilbert zanahorias -2"},{"ef":"log En la escuela, Gilbert Blythe le dijo «¡Zanahorias!» a Ana, y Ana le contestó delante de toda la clase. | yo: en la escuela, Gilbert Blythe me dijo «¡Zanahorias!» delante de todos, y le contesté. Toda la clase se rió… de él."}]}]}],"resumen":"En la escuela, Gilbert le dice «Zanahorias» a Ana.","punto":"Antes del día de la pizarra (Gilbert y las zanahorias)","grande":true,"canal":"es","prioridad":"7","interrumpe":true,"en":"ana=es, gilbert=es","tipo":"escena"},{"id":"clase_geografia","origen":"guion","si":["hecho:se_queda","hora:9.2-12","no_hoy:clase"],"o":[],"empieza":[],"termina":["hecho clase"],"narra":["Clase de geografía. El Sr. Phillips señala el mapa del Canadá con una varilla, y las provincias parecen manchas de colores."],"L":[{"q":"phillips","t":"Ana Shirley. ¿Cuál es la capital de la Isla del Príncipe Eduardo?"},{"ops":[{"t":"«Charlottetown, señor. Y es la isla más hermosa del mundo.»","propia":true,"L":[{"q":"ana","t":"Charlottetown, señor. Y si me permite, la Isla del Príncipe Eduardo es la isla más hermosa del mundo. Lo leí antes de venir, y ahora sé que es verdad."},{"q":"phillips","t":"(El Sr. Phillips carraspea.) Basta con la capital, Ana. Pero… correcto."},{"ef":"suma estudio:ana 1"}]},{"t":"Mirar por la ventana, al Lago de las Aguas Refulgentes","propia":false,"L":[{"q":"ana","t":"(Ana no oye la pregunta. Por la ventana se ve un pedacito del lago, y Ana está navegando en él, en un barco de velas de seda.)"},{"q":"phillips","t":"¡Ana Shirley! La capital. Se la estoy preguntando a usted, no a las nubes."},{"q":"ana","t":"(Ana se pone colorada.) ¡Charlottetown! Perdón, señor. Estaba… en otra parte."}]}]}],"canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","tipo":"escena"},{"id":"clase_dictado","origen":"guion","si":["hecho:se_queda","hora:9.2-12","no_hoy:clase"],"o":[],"empieza":[],"termina":["hecho clase"],"narra":["Dictado. Se oye el rasgueo de las plumas sobre las pizarras, y una mosca que choca contra el vidrio."],"L":[{"q":"phillips","t":"«El… invierno… en… Avonlea… es… largo… y… blanco.» Punto."},{"q":"ana","t":"(Ana escribe «blanco», y después, sin poder evitarlo, «como el vestido de una novia que espera junto a la ventana».)"},{"ops":[{"t":"Borrar lo que agregó","propia":true,"L":[{"q":"ana","t":"(Ana lo borra con la manga, con un suspiro. Un dictado no es lugar para la poesía.)"},{"ef":"suma estudio:ana 1"}]},{"t":"Dejarlo, total es más bonito así","propia":false,"L":[{"q":"ana","t":"(Ana lo deja. Cuando el Sr. Phillips revisa, levanta las cejas hasta el pelo.)"},{"q":"phillips","t":"Ana, esto es un dictado, no un concurso de poesía."},{"q":"ana","t":"Ya lo sé, señor. Pero es que la frase se veía tan sola."}]}]}],"canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","tipo":"escena"},{"id":"clase_geometria","origen":"guion","si":["hecho:se_queda","hora:9.2-12","no_hoy:clase"],"o":[],"empieza":[],"termina":["hecho clase"],"narra":["Geometría. En el pizarrón hay un triángulo con letras en las puntas, y para Ana es un misterio tan grande como las pirámides."],"L":[{"q":"phillips","t":"Ana Shirley, al pizarrón. Demuestre que estos dos ángulos son iguales."},{"q":"ana","t":"(Ana se queda mirando el triángulo. El triángulo la mira a ella.)"},{"ops":[{"t":"Intentarlo, aunque se equivoque","propia":true,"L":[{"q":"ana","t":"Bueno… si este lado es igual a este otro… entonces… ¿los ángulos se ponen de acuerdo?"},{"q":"phillips","t":"(Alguien se ríe al fondo.) No exactamente. Siéntese, Ana. Y estudie la proposición cinco para mañana."},{"q":"ana","t":"(Ana vuelve a su banco con la frente en alto. Por dentro, le dan ganas de que se la trague la tierra.)"},{"ef":"suma estudio:ana 1"}]},{"t":"Confesar que no entiende nada","propia":false,"L":[{"q":"ana","t":"Señor Phillips, le confieso que no entiendo nada. La geometría y yo no nos llevamos. Tengo el alma más bien literaria."},{"q":"phillips","t":"(El Sr. Phillips suspira.) El alma literaria también tiene que aprobar el examen, Ana. Siéntese."}]}]}],"canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","tipo":"escena"},{"id":"clase_lectura","origen":"guion","si":["hecho:se_queda","hora:9.2-12","no_hoy:clase"],"o":[],"empieza":[],"termina":["hecho clase"],"narra":["Lectura en voz alta. Le toca a Ana leer un poema del libro de cuarto grado."],"L":[{"q":"phillips","t":"Ana Shirley, «La batalla de Hohenlinden». Desde el principio."},{"q":"ana","t":"(Ana se pone de pie y lee. Al principio despacio; después, con la voz temblando, como si la batalla pasara ahí mismo, entre los bancos.)"},{"q":"ana","t":"«…y de Hohenlinden en la nieve, corría el río, rojo y frío…»"},{"ops":[{"t":"Seguir hasta el final, con todo el corazón","propia":true,"L":[{"q":"ana","t":"(Cuando termina, nadie se mueve. Hasta Josie Pye se quedó con la boca abierta.)"},{"q":"phillips","t":"(El Sr. Phillips se aclara la garganta.) Muy… bien leído. Siéntese."},{"ef":"suma estudio:ana 1"}]},{"t":"Bajar la voz, porque todos la miran","propia":false,"L":[{"q":"ana","t":"(Ana siente todos los ojos encima, y la voz se le achica. Termina el poema casi en un susurro.)"},{"q":"phillips","t":"Más fuerte la próxima vez, Ana. Un poema leído para adentro es un poema perdido."}]}]}],"canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","tipo":"escena"},{"id":"clase_composicion_stacy","origen":"guion","si":["hecho:se_queda","hora:9.2-12","no_hoy:clase","hecho:llego_stacy"],"o":[],"empieza":[],"termina":["hecho clase"],"narra":["La Srta. Stacy abre las ventanas para que entre el aire. «Hoy», dice, «van a escribir sobre algo que vean desde aquí»."],"L":[{"q":"stacy","t":"Escriban lo que ven, niños. Pero miren bien: con los ojos, y con algo más."},{"q":"ana","t":"(Ana mira por la ventana. Un arce, el camino, un pedazo de cielo. Y empieza a escribir sin parar.)"},{"ops":[{"t":"Escribir sobre el arce, sencillo y verdadero","propia":true,"L":[{"q":"ana","t":"(Ana escribe del arce: de cómo se le mueven las hojas, y nada más. Le cuesta no adornarlo.)"},{"q":"stacy","t":"(La Srta. Stacy lee por encima de su hombro, y sonríe.) Esto, Ana, es escribir. Menos adjetivos, más verdad."},{"ef":"suma estudio:ana 1"}]},{"t":"Escribir que el arce es un rey encantado","propia":false,"L":[{"q":"ana","t":"(El arce se vuelve un rey encantado que espera a una princesa desde hace cien años. Ana llena dos páginas.)"},{"q":"stacy","t":"(La Srta. Stacy se ríe bajito.) Tienes imaginación de sobra, Ana. Ahora aprende a usarla con rienda."}]}]}],"resumen":"La Srta. Stacy pide escribir sobre lo que se ve por la ventana.","canal":"es","prioridad":"4","en":"ana=es, stacy=es","repetir":"cada 5","tipo":"escena"},{"id":"clase_botanica_stacy","origen":"guion","si":["hecho:se_queda","hora:9.2-12","no_hoy:clase","hecho:llego_stacy"],"o":[],"empieza":[],"termina":["hecho clase"],"narra":["Clase de botánica. La Srta. Stacy trajo del bosque un ramo de flores silvestres, y lo pone en un frasco sobre su mesa."],"L":[{"q":"stacy","t":"(La Srta. Stacy saca una florcita blanca, de siete pétalos.) ¿Quién sabe cómo se llama esta flor?"},{"ops":[{"t":"«Es una estrella de junio… bueno, así le digo yo.»","propia":true,"L":[{"q":"ana","t":"Es… una estrella de junio. Bueno, así le digo yo. ¿Cómo se llama de verdad?"},{"q":"stacy","t":"Se llama trientalis. Pero me gusta más tu nombre, Ana. Anota los dos."},{"ef":"suma estudio:ana 1"}]},{"t":"Quedarse callada, por si se equivoca","propia":false,"L":[{"q":"ana","t":"(Desde el fondo, alguien contesta: «Trientalis, Srta. Stacy».)"},{"q":"ana","t":"(Ana aprieta los labios. Lo sabía. Bueno, casi. La próxima vez levanta la mano.)"}]}]}],"resumen":"Clase de botánica de la Srta. Stacy con flores silvestres.","canal":"es","prioridad":"4","en":"ana=es, stacy=es","repetir":"cada 5","tipo":"escena"},{"id":"te_grosella","origen":"guion","si":["hecho:se_queda","tomando_te:ana:diana","!hecho:diana_borracha"],"o":[],"empieza":[],"termina":["hecho diana_borracha","meta diana estar_en h:os,-,- | Diana se va a su casa, tambaleándose | volver a su casa, mareada | 3","log Ana invitó a Diana a tomar el té y le sirvió, sin saberlo, vino de grosellas en vez de cordial de frambuesa: Diana se fue a su casa… borracha. | yo: invité a Diana a tomar el té y le serví, sin saberlo, vino de grosellas en vez de cordial de frambuesa. ¡Se fue a su casa borracha!"],"narra":["Marilla le dio permiso a Ana para invitar a Diana a tomar el té, como dos señoras, con el juego de té bueno y el cordial de frambuesa de la despensa. Pero Marilla no se acordó de que el cordial ya no estaba en la despensa, sino en el sótano."],"L":[{"q":"ana","t":"Toma otro vaso de cordial de frambuesa, Diana. Es de Marilla, y es buenísimo."},{"q":"diana","t":"Es el cordial más rico que he probado. Mucho más rico que el de la Sra. Lynde. (Diana se sirve el tercer vaso.)"},{"q":"ana","t":"(Ana le cuenta a Diana cómo se le cayó un ratón en la salsa de ciruela, con todos los detalles.)"},{"q":"diana","t":"Ana… me siento… me siento rara. Creo que me voy a casa."},{"q":"ana","t":"¿A casa? ¡Pero si todavía no hemos tomado el té! ¡Diana, no te vayas!"},{"q":"diana","t":"(Diana se levanta tambaleándose.) Me siento… muy… muy mal."}],"resumen":"El té con Diana: Ana le sirve vino de grosellas creyendo que es cordial.","canal":"gg","prioridad":"7","interrumpe":true,"en":"ana=gg, diana=gg","tipo":"escena"},{"id":"prohibida","origen":"guion","si":["dias_desde:diana_borracha:1","!hecho:prohibida","!hecho:perdonada"],"o":[],"empieza":[],"termina":["hecho prohibida","triste diana","ofensa barry ana vino 0","log La Sra. Barry le prohibió a Diana volver a ver a Ana: el «cordial» era vino de grosellas. | yo: la Sra. Barry le prohibió a Diana volver a verme. Mi corazón está hecho trizas."],"narra":["La Sra. Barry es una mujer severa, que no perdona fácilmente. Y Diana llegó a su casa mareada, tambaleándose, después de tomar el té en Tejas Verdes."],"L":[{"q":"marilla","t":"Ana Shirley, ¿qué le diste de tomar a Diana? La Sra. Barry dice que la mandaste a su casa borracha."},{"q":"ana","t":"¡Le di cordial de frambuesa, Marilla! ¡Nada más!"},{"q":"marilla","t":"(Marilla va a la despensa y vuelve con la botella.) Esto no es cordial de frambuesa, Ana. Es mi vino de grosellas."},{"q":"ana","t":"¡Oh, Marilla! ¿Y ahora qué va a pasar?"},{"q":"marilla","t":"La Sra. Barry dice que Diana no puede volver a jugar contigo. Ve a pedirle perdón, aunque no sé si servirá."},{"q":"ana","t":"(Ana se tira en el sofá, desconsolada.) Mi destino es trágico. Es el más trágico de toda la isla."}],"resumen":"La Sra. Barry le prohíbe a Diana juntarse con Ana.","punto":"Antes de que la Sra. Barry le prohíba a Diana verla","grande":true,"canal":"gg","prioridad":"7","interrumpe":true,"sujeta":"marilla","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"barry_no_perdona","origen":"guion","si":["hecho:prohibida"],"o":[],"empieza":[],"termina":[],"narra":[],"L":[{"q":"ana","t":"Sra. Barry, por favor, perdóneme. No sabía que era vino. Me imaginé que era cordial… bueno, creí que era cordial."},{"q":"barry","t":"No, Ana Shirley. No creo que seas compañía para Diana. Vete a tu casa y pórtate bien."}],"resumen":"Ana va a pedirle perdón a la Sra. Barry, y ella no la perdona.","canal":"os","prioridad":"7","interrumpe":true,"en":"ana=os, barry=os","tipo":"escena"},{"id":"crup_aviso","origen":"guion","si":["hecho:prohibida","dias_desde:prohibida:12","!hecho:crup"],"o":[],"empieza":[],"termina":["hecho crup","meta ana estar_en h:os,-,23 | Ana corre a La Cuesta del Huerto: Minnie May tiene crup | correr a La Cuesta del Huerto: Minnie May tiene crup (cap. 18) | 3","meta diana estar_en h:os,-,23 | Diana vuelve corriendo a su casa | volver corriendo a su casa con Ana | 3"],"narra":["Una noche de invierno. Casi todos los grandes de Avonlea fueron a Charlottetown, a escuchar el discurso del Primer Ministro: también los Barry. Diana se quedó en casa cuidando a Minnie May, su hermanita de tres años.","El crup es una enfermedad de los niños que cierra la garganta: hay que actuar rápido. Ana sabe de crup, porque cuidó a tres pares de mellizos de la Sra. Hammond."],"L":[{"q":"diana","t":"¡Ana! ¡Ven, por favor! Minnie May está enferma… tiene crup. Papá y mamá fueron al pueblo, y Mary Joe no sabe qué hacer."},{"q":"ana","t":"¡Crup! Yo cuidé a los mellizos de la Sra. Hammond… tres veces tuvieron crup. Tengo el jarabe de ipecacuana."},{"q":"ana","t":"(Ana toma el frasco del aparador y su chal.) ¡Vamos, Diana! ¡Corre!"}],"resumen":"Noche de invierno: Diana viene corriendo, Minnie May tiene crup.","punto":"Antes de la noche del crup","grande":true,"canal":"gg","prioridad":"9","interrumpe":true,"en":"ana=gg, diana=gg","tipo":"escena"},{"id":"crup_salva","origen":"guion","si":["hecho:crup","hecho:prohibida"],"o":[],"empieza":[],"termina":["olvidar prohibida","hecho perdonada","afecto barry ana 4","afecto diana ana 5","log Ana salvó a Minnie May del crup, toda la noche, con el jarabe de ipecacuana. La Sra. Barry le pidió perdón. | yo: salvé a Minnie May del crup, toda la noche, con el jarabe de ipecacuana. Y la Sra. Barry me pidió perdón."],"narra":[],"L":[{"q":"ana","t":"(Minnie May arde de fiebre en el sofá, y apenas puede respirar.)"},{"q":"ana","t":"Mary Joe, pon agua a calentar. Diana, más leña en la estufa."},{"q":"ana","t":"(Ana le da el jarabe de ipecacuana a cucharadas, toda la noche, sin parar.)"},{"q":"ana","t":"¡Ya respira mejor! ¡Diana, ya respira mejor!"},{"q":"barry","t":"(Al otro día, la Sra. Barry viene con los ojos llenos de lágrimas.) Ana, el doctor dice que salvaste a Minnie May. Me porté muy mal contigo. Perdóname, y sé amiga de Diana como antes."},{"q":"ana","t":"(Ana no cabe en sí de felicidad.) ¡Oh, Sra. Barry! La perdono con toda mi alma."}],"resumen":"Ana salva a Minnie May del crup con jarabe de ipecacuana.","canal":"os","prioridad":"9","interrumpe":true,"en":"ana=os","tipo":"escena"},{"id":"invita_allan","origen":"guion","si":["cuaderno:escuela_dominical","dias_desde:escuela_dominical:14","presente:sraallan","!hecho:allan_invitados"],"o":[],"empieza":[],"termina":["hecho allan_invitados","hecho conoce_sraallan"],"narra":["Avonlea tiene un pastor nuevo, el Sr. Allan, que llegó con su esposa, joven y alegre. Ana la quiere desde el primer domingo en la escuela dominical. Y en Avonlea, cuando llega un pastor nuevo, cada familia lo invita a tomar el té."],"L":[{"q":"marilla","t":"Invité al pastor y a la Sra. Allan a tomar el té mañana en la tarde. Tú puedes hacer el pastel en capas."},{"q":"ana","t":"¡Oh, Marilla! Lo haré con toda mi alma. ¡Y con vainilla, como dice la receta!"}],"resumen":"Marilla invita a los Allan a tomar el té, y Ana hará un pastel.","punto":"Antes del té con la Sra. Allan","grande":true,"canal":"gg","prioridad":"5","en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"pastel_linimento","origen":"guion","si":["hecho:allan_invitados","!hecho:pastel_linimento","sentada:sraallan"],"o":[],"empieza":[],"termina":["hecho pastel_linimento","afecto sraallan ana 5","log Ana le sirvió a la Sra. Allan un pastel con linimento en vez de vainilla; la Sra. Allan fue tan buena que la invitó a la casa parroquial. | yo: le serví a la Sra. Allan un pastel con linimento en vez de vainilla. Ella fue tan buena que me invitó a la casa parroquial."],"narra":[],"L":[{"q":"ana","t":"(Ana sirve su pastel en capas, con mermelada roja entre las capas.)"},{"q":"sraallan","t":"(La Sra. Allan prueba un bocado… y pone una cara rara. Pero sigue comiendo, con valentía.)"},{"q":"marilla","t":"Ana Shirley, ¿qué le pusiste a este pastel?"},{"q":"ana","t":"Vainilla, Marilla… solo vainilla."},{"q":"marilla","t":"(Marilla trae el frasco y lo huele.) ¡Linimento anodino! Se me rompió la botella la semana pasada y guardé lo que quedaba en el frasco viejo de vainilla."},{"q":"ana","t":"(Ana sale corriendo y se tira en su cama a llorar.) ¡Nunca podré borrar esta vergüenza!"},{"q":"sraallan","t":"(La Sra. Allan sube a verla.) Querida, fue un error muy gracioso, nada más. Ahora muéstrame tus flores… y ven un día a tomar el té a la casa parroquial."}],"resumen":"El pastel de Ana para la Sra. Allan lleva linimento en vez de vainilla.","punto":"Antes del pastel con linimento","grande":true,"canal":"gg","prioridad":"7","interrumpe":true,"sujeta":"sraallan, marilla","en":"ana=gg, sraallan=gg","tipo":"escena"},{"id":"cama_josephine","origen":"guion","si":["cuaderno:amigas","!hecho:prohibida","!hecho:cama_josephine","dias_desde:conocidas_diana:15","afecto:diana:ana>=5","letras:ana>=10"],"o":[],"empieza":[],"termina":["hecho cama_josephine","afecto josephine ana 5","log Ana y Diana saltaron sobre la cama del cuarto de huéspedes, donde dormía la tía Josephine; Ana confesó y se ganó su amistad. | yo: Diana y yo saltamos sobre la cama de huéspedes, ¡y ahí dormía la tía Josephine! Confesé, y se hizo mi amiga."],"narra":["La tía de la Sra. Barry, la Srta. Josephine Barry, vino desde Charlottetown. Es una anciana rica, muy de mal genio, y se queda en el cuarto de huéspedes de La Cuesta del Huerto. Ana y Diana no lo saben."],"L":[{"q":"diana","t":"¡Ana! Esta noche hay concierto del Club de Debate en el salón. Mamá dice que puedes quedarte a dormir… ¡en el cuarto de huéspedes!"},{"q":"ana","t":"(Esa noche, al volver del concierto, las niñas corren por el pasillo.) ¡A la que llegue última a la cama!"},{"q":"diana","t":"(Las dos saltan sobre la cama del cuarto de huéspedes…) ¡Ay! ¡Hay alguien en la cama!"},{"q":"josephine","t":"¡Misericordia! ¿Qué es esto? ¡Niñas sin educación!"},{"q":"diana","t":"Es… es la tía Josephine, de Charlottetown. ¡Ahora sí que nos va a pasar algo terrible!"},{"q":"ana","t":"(A la mañana siguiente, Ana va a verla.) Fue culpa mía, Srta. Barry. Diana no tuvo la culpa. Y usted no sabe lo que es tener tanta imaginación."},{"q":"josephine","t":"(La tía Josephine se ríe como hacía años.) Vaya, vaya… Ven a verme a menudo mientras esté aquí, niña. Y escríbeme cuando me vaya."}],"resumen":"Ana y Diana saltan sobre la cama del cuarto de huéspedes… y está la Srta. Josephine.","punto":"Antes de la noche en la cama de la Srta. Josephine","grande":true,"canal":"os","prioridad":"6","interrumpe":true,"en":"ana=os, diana=os","tipo":"escena"},{"id":"examen_primera","origen":"guion","si":["estacion:verano","dia_estacion:1","dia_juego:56","estudio:ana>=85","!hecho:queens","no_hoy:examen"],"o":[],"empieza":[],"termina":["hecho examen","hecho queens","hecho queens_primera","afecto marilla ana 5","afecto matthew ana 5","log Ana dio el examen de ingreso a Queen's en Charlottetown y quedó primera, empatada con Gilbert Blythe. | yo: di el examen de ingreso a Queen's y quedé primera, empatada con Gilbert Blythe."],"narra":["El examen de ingreso al Queen's, el colegio de Charlottetown donde se preparan los maestros, se da al comenzar el verano. Los mejores alumnos de toda la Isla compiten por entrar. Ana estudió meses con la Srta. Stacy, y Gilbert Blythe también."],"L":[{"q":"marilla","t":"Ana, hoy es el examen de Queen's. Matthew te lleva a Charlottetown. Toma, no se te olvide el almuerzo."},{"q":"ana","t":"(Ana pasa el día en Charlottetown, con la pluma temblándole en la mano. La geometría… ¡la geometría salió bien!)"},{"q":"ana","t":"(Semanas después, Diana llega corriendo con el diario.) ¡Marilla! ¡Pasé! ¡Primera de toda la isla… empatada con Gilbert Blythe!"},{"q":"marilla","t":"(Marilla no dice nada por un momento. Pero los ojos le brillan.) Bueno, Ana. Bien hecho. Bien hecho, de verdad."}],"resumen":"El examen del Queen's: Ana sale primera de toda la Isla.","canal":"gg","prioridad":"8","interrumpe":true,"en":"ana=gg, marilla=gg","tipo":"escena"},{"id":"examen_entra","origen":"guion","si":["estacion:verano","dia_estacion:1","dia_juego:56","estudio:ana>=50","estudio:ana\u003c85","!hecho:queens","no_hoy:examen"],"o":[],"empieza":[],"termina":["hecho examen","hecho queens","afecto marilla ana 5","log Ana dio el examen de ingreso a Queen's en Charlottetown y en
