dos los niños del pueblo. Gilbert Blythe es el más listo y el más buen mozo, y está acostumbrado a que todas las niñas lo miren. Ana todavía no lo ha mirado.","primera":"gilbert: (Gilbert Blythe alarga la mano, toma la punta de una trenza de Ana y susurra, lo bastante fuerte para que lo oiga toda la clase.) ¡Zanahorias! ¡Zanahor","lineas":1,"empieza":[],"termina":["hecho zanahorias","hecho conoce_gilbert"],"ops":[{"t":"Partirle la pizarra en la cabeza","propia":true,"ef":["hecho zanahorias_pizarra","ofensa ana gilbert zanahorias -2","log En la escuela, Gilbert Blythe le dijo «¡Zanahorias!» a Ana, y Ana le partió la pizarra en la cabeza. | yo: en la escuela, Gilbert Blythe me dijo «¡Zanahorias!» delante de todos… y le partí la pizarra en la cabeza."],"dice":"ana: (Ana se pone de pie de un salto, con los ojos echando chispas.) ¡Odioso, malvado! ¿Cómo te atreves?"},{"t":"Hacer como que no lo oyó, con la frente en alto","propia":false,"ef":["hecho zanahorias_ignora","ofensa ana gilbert zanahorias -1","log En la escuela, Gilbert Blythe le dijo «¡Zanahorias!» a Ana, y Ana hizo como que no existía. | yo: en la escuela, Gilbert Blythe me dijo «¡Zanahorias!» delante de todos. Hice como que no existía."],"dice":"ana: (Ana se pone roja hasta las orejas… pero no se da vuelta. Mira el pizarrón como si Gilbert Blythe no existiera en el mundo.)"},{"t":"Contestarle, delante de todos","propia":false,"ef":["hecho zanahorias_contesta","ofensa ana gilbert zanahorias -2","log En la escuela, Gilbert Blythe le dijo «¡Zanahorias!» a Ana, y Ana le contestó delante de toda la clase. | yo: en la escuela, Gilbert Blythe me dijo «¡Zanahorias!» delante de todos, y le contesté. Toda la clase se rió… de él."],"dice":"ana: (Ana se da vuelta despacio.) Mejor zanahoria que cabeza hueca, Gilbert Blythe. Las zanahorias, por lo menos, sirven para algo."}]},"desc":"En la escuela, Gilbert le dice «Zanahorias» a Ana.","x":1930,"y":1910,"c":7,"suelto":false},{"id":"escena clase_geografia","k":"clase_geografia","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:se_queda, hora:9.2-12, no_hoy:clase","canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","narra":"Clase de geografía. El Sr. Phillips señala el mapa del Canadá con una varilla, y las provincias parecen manchas de colores.","primera":"phillips: Ana Shirley. ¿Cuál es la capital de la Isla del Príncipe Eduardo?","lineas":1,"empieza":[],"termina":["hecho clase"],"ops":[{"t":"«Charlottetown, señor. Y es la isla más hermosa del mundo.»","propia":true,"ef":["suma estudio:ana 1"],"dice":"ana: Charlottetown, señor. Y si me permite, la Isla del Príncipe Eduardo es la isla más hermosa del mundo. Lo leí antes de venir, y ahora sé que es verdad."},{"t":"Mirar por la ventana, al Lago de las Aguas Refulgentes","propia":false,"ef":[],"dice":"ana: (Ana no oye la pregunta. Por la ventana se ve un pedacito del lago, y Ana está navegando en él, en un barco de velas de seda.)"}]},"desc":"Clase de geografía.","x":1930,"y":710,"c":7,"suelto":false},{"id":"escena clase_dictado","k":"clase_dictado","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:se_queda, hora:9.2-12, no_hoy:clase","canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","narra":"Dictado. Se oye el rasgueo de las plumas sobre las pizarras, y una mosca que choca contra el vidrio.","primera":"phillips: «El… invierno… en… Avonlea… es… largo… y… blanco.» Punto.","lineas":2,"empieza":[],"termina":["hecho clase"],"ops":[{"t":"Borrar lo que agregó","propia":true,"ef":["suma estudio:ana 1"],"dice":"ana: (Ana lo borra con la manga, con un suspiro. Un dictado no es lugar para la poesía.)"},{"t":"Dejarlo, total es más bonito así","propia":false,"ef":[],"dice":"ana: (Ana lo deja. Cuando el Sr. Phillips revisa, levanta las cejas hasta el pelo.)"}]},"desc":"Dictado.","x":1930,"y":610,"c":7,"suelto":false},{"id":"escena clase_geometria","k":"clase_geometria","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:se_queda, hora:9.2-12, no_hoy:clase","canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","narra":"Geometría. En el pizarrón hay un triángulo con letras en las puntas, y para Ana es un misterio tan grande como las pirámides.","primera":"phillips: Ana Shirley, al pizarrón. Demuestre que estos dos ángulos son iguales.","lineas":2,"empieza":[],"termina":["hecho clase"],"ops":[{"t":"Intentarlo, aunque se equivoque","propia":true,"ef":["suma estudio:ana 1"],"dice":"ana: Bueno… si este lado es igual a este otro… entonces… ¿los ángulos se ponen de acuerdo?"},{"t":"Confesar que no entiende nada","propia":false,"ef":[],"dice":"ana: Señor Phillips, le confieso que no entiendo nada. La geometría y yo no nos llevamos. Tengo el alma más bien literaria."}]},"desc":"Geometría.","x":1930,"y":760,"c":7,"suelto":false},{"id":"escena clase_lectura","k":"clase_lectura","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:se_queda, hora:9.2-12, no_hoy:clase","canal":"es","prioridad":"4","en":"ana=es, phillips=es","repetir":"cada 6","narra":"Lectura en voz alta. Le toca a Ana leer un poema del libro de cuarto grado.","primera":"phillips: Ana Shirley, «La batalla de Hohenlinden». Desde el principio.","lineas":3,"empieza":[],"termina":["hecho clase"],"ops":[{"t":"Seguir hasta el final, con todo el corazón","propia":true,"ef":["suma estudio:ana 1"],"dice":"ana: (Cuando termina, nadie se mueve. Hasta Josie Pye se quedó con la boca abierta.)"},{"t":"Bajar la voz, porque todos la miran","propia":false,"ef":[],"dice":"ana: (Ana siente todos los ojos encima, y la voz se le achica. Termina el poema casi en un susurro.)"}]},"desc":"Lectura en voz alta.","x":1930,"y":810,"c":7,"suelto":false},{"id":"escena clase_composicion_stacy","k":"clase_composicion_stacy","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:se_queda, hora:9.2-12, no_hoy:clase, hecho:llego_stacy","canal":"es","prioridad":"4","resumen":"La Srta. Stacy pide escribir sobre lo que se ve por la ventana.","en":"ana=es, stacy=es","repetir":"cada 5","narra":"La Srta. Stacy abre las ventanas para que entre el aire. «Hoy», dice, «van a escribir sobre algo que vean desde aquí».","primera":"stacy: Escriban lo que ven, niños. Pero miren bien: con los ojos, y con algo más.","lineas":2,"empieza":[],"termina":["hecho clase"],"ops":[{"t":"Escribir sobre el arce, sencillo y verdadero","propia":true,"ef":["suma estudio:ana 1"],"dice":"ana: (Ana escribe del arce: de cómo se le mueven las hojas, y nada más. Le cuesta no adornarlo.)"},{"t":"Escribir que el arce es un rey encantado","propia":false,"ef":[],"dice":"ana: (El arce se vuelve un rey encantado que espera a una princesa desde hace cien años. Ana llena dos páginas.)"}]},"desc":"La Srta. Stacy pide escribir sobre lo que se ve por la ventana.","x":1930,"y":2460,"c":7,"suelto":false},{"id":"escena clase_botanica_stacy","k":"clase_botanica_stacy","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:se_queda, hora:9.2-12, no_hoy:clase, hecho:llego_stacy","canal":"es","prioridad":"4","resumen":"Clase de botánica de la Srta. Stacy con flores silvestres.","en":"ana=es, stacy=es","repetir":"cada 5","narra":"Clase de botánica. La Srta. Stacy trajo del bosque un ramo de flores silvestres, y lo pone en un frasco sobre su mesa.","primera":"stacy: (La Srta. Stacy saca una florcita blanca, de siete pétalos.) ¿Quién sabe cómo se llama esta flor?","lineas":1,"empieza":[],"termina":["hecho clase"],"ops":[{"t":"«Es una estrella de junio… bueno, así le digo yo.»","propia":true,"ef":["suma estudio:ana 1"],"dice":"ana: Es… una estrella de junio. Bueno, así le digo yo. ¿Cómo se llama de verdad?"},{"t":"Quedarse callada, por si se equivoca","propia":false,"ef":[],"dice":"ana: (Desde el fondo, alguien contesta: «Trientalis, Srta. Stacy».)"}]},"desc":"Clase de botánica de la Srta. Stacy con flores silvestres.","x":1930,"y":2360,"c":7,"suelto":false},{"id":"escena te_grosella","k":"te_grosella","tipo":"escena","grande": escena primera_escenario","k":"primera_escenario","tipo":"escena","grande":false,"punto":null,"info":{"si":"","canal":"ana_sola","disparo":"primera","primera":"ana: (Ana sube al escenario. El salón vacío parece enorme desde arriba.) Si algún día recito aquí, me van a temblar las rodillas. Pero la voz no. La voz, nunca.","lineas":1,"empieza":[],"termina":[],"ops":[]},"desc":"(Ana sube al escenario.","c":0,"suelto":true},{"id":"escena primera_cage","k":"primera_cage","tipo":"escena","grande":false,"punto":null,"info":{"si":"","canal":"ana_sola","disparo":"primera","primera":"ana: (El loro la mira de reojo, con la cabeza ladeada.) Buenos días, Ginger. ¿Tú también tienes mal genio? Entonces somos espíritus afines… creo.","lineas":1,"empieza":[],"termina":[],"ops":[]},"desc":"(El loro la mira de reojo, con la cabeza ladeada.) Buenos días, Ginger.","c":0,"suelto":true},{"id":"escena senas_vela","k":"senas_vela","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:se_queda, hecho:conocidas_diana","canal":"ana_sola","repetir":"dia","disparo":"menu","primera":"ana: (Ana pone la vela en la ventana y la tapa y destapa con un cartón: cinco destellos.)","lineas":3,"empieza":[],"termina":["suma afecto:diana:ana 1","log Ana le hizo señas a Diana con la vela, desde la ventana de su pieza; Diana contestó. | yo: le hice señas a Diana con la vela, desde la ventana de mi pieza, ¡y ella me contestó!"],"ops":[]},"desc":"(Ana pone la vela en la ventana y la tapa y destapa con un cartón: cinco destellos.)","x":2740,"y":2135,"c":10,"suelto":false},{"id":"escena lynde_visita","k":"lynde_visita","tipo":"escena","grande":true,"punto":"Antes de la visita de la Sra. Lynde","info":{"si":"hecho:se_queda, !hecho:lynde_visita, sentada:lynde","canal":"gg","prioridad":"9","resumen":"La Sra. Lynde viene a conocer a Ana y la llama flaca y fea; Ana elige cómo responder.","en":"ana=gg, marilla=gg, lynde=gg","narra":"La Sra. Rachel Lynde, la vecina que todo lo sabe y todo lo dice, ha venido a ver con sus propios ojos a la huérfana de Tejas Verdes. Es la mujer más respetada de Avonlea, y la que tiene la lengua más larga.","primera":"lynde: (La Sra. Lynde mira a Ana de arriba abajo.) Bueno, no te eligieron por tu cara, eso seguro. Es terriblemente flaca y fea, Marilla. ¡Y qué pecas! ¡Y el pe","lineas":1,"empieza":[],"termina":["hecho lynde_visita"],"ops":[{"t":"¡La odio! ¡Es una mujer grosera e insensible!","propia":false,"ef":["hecho ofendio_lynde","suma afecto:lynde:ana -1","log Ana estalló con la Sra. Lynde, que la llamó flaca, fea y pelirroja. Marilla la mandó a su pieza. | yo: la Sra. Lynde me llamó flaca, fea y pelirroja, y estallé. Marilla me mandó a mi pieza."],"dice":"ana: (Ana se planta frente a ella, temblando de rabia.) ¡La odio! ¡La odio, la odio, la odio! ¿Cómo se atreve a decir que soy flaca y fea? ¿Le gustaría que dije"},{"t":"Apretar los puños y contar hasta diez","propia":true,"ef":["suma afecto:marilla:ana 1","hecho lynde_contenida","log Ana se contuvo cuando la Sra. Lynde la llamó flaca y fea. Marilla lo notó. | yo: la Sra. Lynde me llamó flaca y fea, y me contuve. Marilla lo notó."],"dice":"ana: (Ana aprieta los puños, se pone roja como un tomate… y cuenta hasta diez, muy despacio.) Buenas tardes, Sra. Lynde."},{"t":"Salir corriendo a llorar a su pieza","propia":false,"ef":["hecho lynde_llanto","a_pieza","log Ana se fue llorando cuando la Sra. Lynde la llamó flaca y fea. | yo: la Sra. Lynde me llamó flaca y fea, y me fui llorando a mi pieza."],"dice":"ana: (Ana sale corriendo escaleras arriba y se tira en la cama a llorar.)"}]},"desc":"La Sra. Lynde viene a conocer a Ana y la llama flaca y fea; Ana elige cómo responder.","x":1930,"y":460,"c":7,"suelto":false},{"id":"escena lynde_perdon_marilla","k":"lynde_perdon_marilla","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:ofendio_lynde, !hecho:perdon_pedido","canal":"gg","prioridad":"8","resumen":"Marilla le dice a Ana que tiene que pedirle perdón a la Sra. Lynde.","en":"ana=gg, marilla=gg","primera":"marilla: Ana, lo que hiciste no se hace. Vas a ir a la casa de la Sra. Lynde a pedirle perdón.","lineas":3,"empieza":[],"termina":["hecho perdon_pedido"],"ops":[]},"desc":"Marilla le dice a Ana que tiene que pedirle perdón a la Sra. Lynde.","x":2200,"y":1110,"c":8,"suelto":false},{"id":"escena lynde_disculpa","k":"lynde_disculpa","tipo":"escena","grande":false,"punto":null,"info":{"si":"hecho:ofendio_lynde","canal":"rl","prioridad":"9","resumen":"Ana se arrodilla y le pide perdón a la Sra. Lynde, con todo el drama.","en":"ana=rl, lynde=rl","primera":"ana: (Ana se arrodilla de pronto frente a la Sra. Lynde.)","lineas":1,"empieza":[],"termina":["hecho disculpa_lynde","olvidar ofendio_lynde"],"ops":[{"t":"Disculparse a lo grande, con todo el dramatismo del mundo","propia":true,"ef":["suma afecto:lynde:ana 3","log Ana le pidió perdón a la Sra. Lynde a lo grande, de rodillas; la Sra. Lynde la perdonó y terminó encantada con ella. | yo: le pedí perdón a la Sra. Lynde a lo grande, de rodillas. Me perdonó, y terminó encantada conmigo."],"dice":"ana: ¡Oh, Sra. Lynde, lo siento tanto! Nunca podré expresar todo mi dolor, aunque usara un diccionario entero. Me porté terriblemente. Soy una niña mala e ingra"},{"t":"Pedirle perdón con pocas palabras","propia":false,"ef":["suma afecto:lynde:ana 1","log Ana le pidió perdón a la Sra. Lynde. | yo: le pedí perdón a la Sra. Lynde."],"dice":"ana: Sra. Lynde… perdóneme por lo que le dije. No estuvo bien."}]},"desc":"Ana se arrodilla y le pide perdón a la Sra. Lynde, con todo el drama.","x":2200,"y":1060,"c":8,"suelto":false},{"id":"escena ventana_primavera_manana","k":"ventana_primavera_manana","tipo":"escena","grande":false,"punto":null,"info":{"si":"estacion:primavera, hora:5-11","canal":"ana_sola","repetir":"dia","disparo":"objeto","primera":"ana: (Ana abre la ventana. El aire de la mañana entra oliendo a flores de cerezo y a tierra mojada.)","lineas":3,"empieza":[],"termina":[],"ops":[]},"desc":"(Ana abre l
