# «Mientras Ana duerme»: la IA de la noche, probada en GitHub (donde api.openai.com sí se alcanza).
# Arma el pedido para un escenario (tools/noche.js), se lo hace a OpenAI con el secreto OPENAI_API_KEY, revisa los bloques
# en el juego y con el grafo y el modelo (Z3), y deja el informe como artefacto y en el resumen del trabajo.
name: La IA de la noche

on:
  workflow_dispatch:
    inputs:
      escenario:
        description: 'Escenario (spencer_rachel, rival_ignora) o la ruta de una partida guardada (.json) en el repositorio'
        default: spencer_rachel
        required: true
      nivel:
        description: 'Nivel de la IA de la noche'
        type: choice
        options: [palabras, efectos, libre]
        default: efectos
      modelo:
        description: 'Modelo de OpenAI'
        default: gpt-5.4-mini
        required: true
      experimento:
        description: 'En vez de la noche, un experimento (temas: cómo contarle a la IA lo ya conversado; tools/temas.js)'
        type: choice
        options: ['no', 'temas', 'prompts', 'juez', 'elegir']
        default: 'no'
      juez:
        description: 'Modelo del juez (elige las mejores escenas entre los candidatos; en «juez», los modelos a calibrar, separados por comas)'
        default: gpt-5.4-mini

permissions:
  contents: read

jobs:
  noche:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar (z3-solver; Playwright y su Chromium)
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Armar el juego
        run: node tools/build.js
      - name: Pedirle a la IA y revisar lo que escribe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ESCENARIO: ${{ inputs.escenario }}
          NIVEL: ${{ inputs.nivel }}
          MODELO: ${{ inputs.modelo }}
          EXPERIMENTO: ${{ inputs.experimento }}
          JUEZ: ${{ inputs.juez }}
        run: |
          if [ "$EXPERIMENTO" = "temas" ]; then node tools/temas.js --partida "$ESCENARIO" --modelo "$MODELO" --veces 3 --salida trazas/noche; cp trazas/noche/temas.md trazas/noche/noche.md; cat trazas/noche/temas.md
          elif [ "$EXPERIMENTO" = "prompts" ]; then
            for v in rubrica rubrica+cuidado rubrica+cuidado+ejemplo; do for r in 1 2 3; do
              node tools/noche.js --escenario "$ESCENARIO" --nivel "$NIVEL" --modelo "$MODELO" --variante "$([ $v = base ] || echo $v)" --candidatos 0 --salida "trazas/noche/$v-$r" > /dev/null 2>&1 || true
              node tools/prompts-muestra.js "trazas/noche/$v-$r" "$v · $r" >> trazas/noche/noche.md
            done; done; cat trazas/noche/noche.md
          elif [ "$EXPERIMENTO" = "juez" ]; then node tools/juez.js --modelos "$JUEZ" --veces 2 --salida trazas/noche; cp trazas/noche/juez.md trazas/noche/noche.md
          elif [ "$EXPERIMENTO" = "elegir" ]; then
            for c in 0 8; do for r in 1 2 3; do
              node tools/noche.js --escenario "$ESCENARIO" --nivel "$NIVEL" --modelo "$MODELO" --variante rubrica+cuidado --candidatos $c --juez "$JUEZ" --salida "trazas/noche/c$c-$r" > /dev/null 2>&1 || true
              node tools/prompts-muestra.js "trazas/noche/c$c-$r" "candidatos $c · $r" >> trazas/noche/noche.md
            done; done; cat trazas/noche/noche.md
          else node tools/noche.js --escenario "$ESCENARIO" --nivel "$NIVEL" --modelo "$MODELO" --juez "$JUEZ" --salida trazas/noche; fi
      - name: El informe, en el resumen
        if: always()
        run: |
          if [ -f trazas/noche/noche.md ]; then cat trazas/noche/noche.md >> "$GITHUB_STEP_SUMMARY"; else echo "No hubo informe (ver el registro del paso anterior)." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: El nombre del informe (sin la ruta de una partida guardada)
        id: nombre
        if: always()
        env:
          ESCENARIO: ${{ inputs.escenario }}
        run: n="$(basename "$ESCENARIO" .json)"; echo "n=${n//[^A-Za-z0-9_-]/_}" >> "$GITHUB_OUTPUT"
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noche-${{ steps.nombre.outputs.n }}-${{ inputs.nivel }}
          path: |
            trazas/noche/noche.md
            trazas/noche/noche.json
            trazas/noche/pedido.md
            trazas/noche/pedido.json
            trazas/noche/respuesta.json
            trazas/noche/temas.json
            trazas/noche/juez.json
          if-no-files-found: warn
