<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hablemos coreano</title>
<style>
:root{
  --bg:#f6f3ee;--card:#fffdf9;--fg:#24211d;--muted:#7a7268;--line:#e3ddd3;
  --accent:#c2412d;--accent-soft:#f6e1da;--me:#e9f0f7;--me-line:#c9d8e8;
  --new:#2f6f5e;--new-soft:#e1f0ea;--warn:#9a5b00;--warn-soft:#fbefd9;--shadow:0 1px 3px rgba(40,30,20,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191714;--card:#24211d;--fg:#eee8df;--muted:#a59c90;--line:#3a352f;
  --accent:#ec7a63;--accent-soft:#4a2a22;--me:#22303d;--me-line:#34495e;
  --new:#7fcbb3;--new-soft:#1e3a32;--warn:#f0b35c;--warn-soft:#3e3020;--shadow:0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#191714;--card:#24211d;--fg:#eee8df;--muted:#a59c90;--line:#3a352f;
  --accent:#ec7a63;--accent-soft:#4a2a22;--me:#22303d;--me-line:#34495e;
  --new:#7fcbb3;--new-soft:#1e3a32;--warn:#f0b35c;--warn-soft:#3e3020;--shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
.ko{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}

header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{color:var(--muted);font-weight:normal;font-size:13px;margin-left:6px}
.ib{background:none;border:1px solid var(--line);border-radius:10px;height:38px;min-width:38px;padding:0 9px;font-size:15px;display:inline-flex;align-items:center;gap:5px}
.ib:hover{background:var(--bg)}
.ib.on{background:var(--accent-soft);border-color:var(--accent)}

#chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(620px,92%);padding:10px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.msg.ai{align-self:flex-start;border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--me);border-color:var(--me-line);border-top-right-radius:4px}
.msg.note{align-self:center;background:var(--warn-soft);border-color:transparent;color:var(--warn);font-size:14px;box-shadow:none}
.msg .text{font-size:21px;line-height:2.05;word-break:keep-all}
.msg.me .text{font-size:19px}
.msg .text.hide{filter:blur(7px);cursor:pointer;user-select:none}
.w{cursor:pointer;border-radius:5px;padding:0 1px;transition:background .15s}
.w:hover{background:var(--accent-soft)}
.w{touch-action:manipulation}
.w.new{border-bottom:2px solid var(--new)}
#tip{position:fixed;z-index:30;background:var(--fg);color:var(--bg);padding:4px 10px;border-radius:8px;font-size:14px;line-height:1.3;pointer-events:none;max-width:260px;transform:translate(-50%,-100%);box-shadow:var(--shadow);text-align:center}
#tip.below{transform:translate(-50%,0)}
#tip .ko{font-weight:600}
#tip small{display:block;opacity:.7;font-size:11px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--new)}
.vocab .chip{position:relative}
ruby{ruby-position:over}
rt{font-size:11px;color:var(--new);font-family:system-ui,sans-serif;letter-spacing:0;line-height:1}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.es{margin-top:6px;color:var(--muted);font-size:15px;border-top:1px dashed var(--line);padding-top:6px}
.fix{margin-top:7px;font-size:14px;background:var(--warn-soft);border-radius:8px;padding:6px 9px}
.fix b{color:var(--warn)}
.fix .ko{font-size:17px}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;font-size:14px;padding:4px 8px}
.card{align-self:center;width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--new);border-radius:10px;padding:10px 13px;box-shadow:var(--shadow)}
.card .q{font-size:13px;color:var(--muted)}
.card .lem{font-size:22px;font-weight:600}
.welcome{align-self:center;width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.welcome h2{margin:.1em 0 .4em;font-size:20px}
.welcome p{margin:.4em 0;color:var(--muted)}
.btn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:9px 15px;font-weight:600}
.btn.sec{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}

#quick{padding:6px 12px 0}
#sugs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#sugs:empty{display:none}
#fixed{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#quick .chip{white-space:nowrap;font-size:14px;padding:4px 11px}
#quick .chip.sug{background:var(--new-soft);border-color:var(--new);display:flex;align-items:stretch;padding:0;border-radius:12px;overflow:hidden;max-width:100%}
#quick .sug .pick{background:none;border:none;font-size:15px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;padding:4px 6px 4px 12px;text-align:left;min-width:0;white-space:normal}
#quick .sug .pick small{font-size:11px;color:var(--muted);font-family:system-ui,sans-serif}
#quick .sug .tr{background:none;border:none;border-left:1px solid var(--new);padding:0 8px;font-size:15px;color:var(--muted)}
#quick .sug .pick small[hidden]{display:none}
#quick .sug .ed{background:none;border:none;border-left:1px solid var(--new);padding:0 9px;font-size:14px;opacity:.75}
#quick .sug .ed:hover,#quick .sug .pick:hover{background:rgba(127,127,127,.12)}
footer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
#inp{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:18px/1.35 inherit;background:var(--card);color:var(--fg);max-height:120px;min-height:44px}
#inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
#mic,#send{width:46px;height:46px;border-radius:50%;border:none;font-size:20px;flex:none}
#mic{background:var(--card);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#recbar{padding:6px 12px 0;font-size:14px;text-align:center;color:var(--accent);font-weight:600}
#recbar.cancel,#recbar.hint{color:var(--muted);font-weight:normal}
#recbar.err{color:var(--warn);font-weight:normal}
#recbar.err .chip{margin-left:6px;font-size:13px}
#send.ready{animation:pulse 1.2s 2}
#mlang{width:34px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;flex:none;padding:0}
#mlang.es{background:var(--warn-soft);color:var(--warn)}
#mic.rec{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
#send{background:var(--accent);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--accent-soft)}}

/* the word sheet */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:78dvh;overflow-y:auto;background:var(--card);border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));z-index:21;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
#sheet .big{font-size:34px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rom{color:var(--muted);font-size:14px}
.pos{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-right:6px;color:var(--muted)}
.gloss{font-size:19px;margin:6px 0}
.form{background:var(--new-soft);color:var(--fg);border-radius:8px;padding:7px 10px;margin:8px 0;font-size:15px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 4px}
.conj{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px}
.conj .ko{font-size:17px}
.ex{margin:4px 0;font-size:15px}
.ex .ko{font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.spk{background:none;border:none;font-size:20px;padding:0 4px}
.busy{color:var(--muted);font-style:italic;font-size:14px}

/* panels */
#panel{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;flex-direction:column}
#panel .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
#panel .ph h2{flex:1;margin:0;font-size:18px}
#panel .pb{flex:1;overflow-y:auto;padding:12px 14px 30px}
#panel .pb > *{max-width:760px;margin-left:auto;margin-right:auto}
.field{margin:12px 0}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=password],.field select,.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.small{font-size:13px;color:var(--muted)}
.lv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lv h3{margin:0 0 4px;font-size:17px}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.vocab .chip{font-size:15px}
.gram{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.gram b{font-size:16px}
.ent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.ent .top{display:flex;align-items:center;gap:8px;cursor:pointer}
.ent .top .ko{font-size:20px;font-weight:600}
.ent .top .g{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;border-radius:6px;padding:1px 6px;white-space:nowrap}
.st.nueva{background:var(--new-soft);color:var(--new)}
.st.conocida{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.filters .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
[hidden]{display:none !important}
@media (max-width:480px){header h1 small{display:none}.ib .lbl{display:none}}
</style>
</head>
<body>
<header>
  <h1><span class="ko">한국어</span> · Hablemos <small id="lvname"></small></h1>
  <button class="ib" id="bLevels" title="Niveles">🎓<span class="lbl">Niveles</span></button>
  <button class="ib" id="bDict" title="Diccionario">📖<span class="lbl">Diccionario</span></button>
  <button class="ib" id="bListen" title="Modo escucha: ocultar el texto coreano">👂</button>
  <button class="ib" id="bSettings" title="Ajustes">⚙</button>
</header>
<main id="chat" aria-live="polite"></main>
<div id="quick"></div>
<div id="recbar" hidden></div>
<footer>
  <button id="mic" title="Mantén presionado para hablar">🎤</button>
  <button id="mlang" title="Idioma en que vas a hablar">한</button>
  <textarea id="inp" rows="1" class="ko" placeholder="Escribe o habla en coreano…"></textarea>
  <button id="send" title="Enviar">➤</button>
</footer>
<div id="veil" hidden></div>
<div id="sheet" hidden></div>
<div id="panel" hidden><div class="ph"><h2 id="ptitle"></h2><button class="ib" id="pclose">✕</button></div><div class="pb" id="pbody"></div></div>

<script>
'use strict';
/* =====================================================================
   Hablemos coreano: conversación con IA, lectura, audio y diccionario.
   Todo vive en el navegador: las claves, la conversación y el diccionario.
   ===================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- niveles: vocabulario y gramática ---------- */
// [palabra, categoría, significado]
const LEVELS = [
  { id: 1, name: 'Nivel 1 · Saludos y presentarse',
    desc: 'Saludar, decir quién eres, de dónde eres, y preguntar «¿qué es?».',
    vocab: [
      ['안녕하세요','expresión','hola (cortés)'],['안녕히 가세요','expresión','adiós (a quien se va)'],['안녕히 계세요','expresión','adiós (a quien se queda)'],
      ['감사합니다','expresión','gracias'],['고맙습니다','expresión','gracias'],['죄송합니다','expresión','lo siento, perdón'],
      ['네','expresión','sí'],['아니요','expresión','no'],['저','pronombre','yo (humilde)'],['이름','sustantivo','nombre'],
      ['사람','sustantivo','persona'],['학생','sustantivo','estudiante'],['선생님','sustantivo','profesor(a)'],['친구','sustantivo','amigo, amiga'],
      ['한국','nombre propio','Corea'],['칠레','nombre propio','Chile'],['나라','sustantivo','país'],['이다','verbo','ser (cópula)'],
      ['아니다','adjetivo','no ser'],['반갑다','adjetivo','estar contento de ver/conocer'],['만나다','verbo','encontrarse, conocer'],
      ['뭐','pronombre','qué'],['누구','pronombre','quién'],['어느','otro','cuál, qué (determinante)']],
    grammar: [
      ['N은/는','Partícula de tema: «en cuanto a N». 은 después de consonante, 는 después de vocal.',[['저는 학생이에요.','Yo soy estudiante.'],['이름은 뭐예요?','¿Y el nombre?']]],
      ['N이에요/예요','«Es / soy N». 이에요 después de consonante, 예요 después de vocal.',[['선생님이에요.','Es profesor(a).'],['친구예요.','Es mi amigo.']]],
      ['N이/가 아니에요','«No es N».',[['저는 선생님이 아니에요.','Yo no soy profesor.']]],
      ['뭐예요? / 누구예요?','«¿Qué es?», «¿quién es?».',[['이름이 뭐예요?','¿Cómo te llamas?'],['어느 나라 사람이에요?','¿De qué país eres?']]],
      ['만나서 반갑습니다','«Encantado/a de conocerte» (literalmente: me alegra haberte conocido).',[['만나서 반가워요.','Encantado.']]]],
    topics: ['Presentarse a alguien nuevo','¿De dónde eres?','En la clase de coreano'] },
  { id: 2, name: 'Nivel 2 · Cosas y lugares',
    desc: 'Preguntar qué es algo, decir qué hay y dónde está.',
    vocab: [
      ['이거','pronombre','esto'],['그거','pronombre','eso'],['저거','pronombre','aquello'],['여기','pronombre','aquí'],['거기','pronombre','ahí'],['저기','pronombre','allá'],
      ['어디','pronombre','dónde'],['책','sustantivo','libro'],['물','sustantivo','agua'],['커피','sustantivo','café'],['가방','sustantivo','bolso, mochila'],
      ['휴대폰','sustantivo','celular'],['집','sustantivo','casa'],['학교','sustantivo','escuela'],['카페','sustantivo','cafetería'],['화장실','sustantivo','baño'],
      ['방','sustantivo','pieza, habitación'],['있다','adjetivo','haber, tener, estar'],['없다','adjetivo','no haber, no tener'],
      ['위','sustantivo','arriba, encima'],['아래','sustantivo','abajo, debajo'],['옆','sustantivo','al lado'],['안','sustantivo','dentro'],['하나','número','uno'],['둘','número','dos']],
    grammar: [
      ['이거 뭐예요?','«¿Qué es esto?». 이거/그거/저거 = esto/eso/aquello (forma hablada de 이것/그것/저것).',[['이거 뭐예요?','¿Qué es esto?'],['그거 책이에요.','Eso es un libro.']]],
      ['N이/가 있어요 / 없어요','«Hay N / no hay N» y también «tengo / no tengo N».',[['가방이 있어요.','Tengo una mochila.'],['물이 없어요.','No hay agua.']]],
      ['N에 있어요','«Está en N». 에 marca el lugar donde algo está.',[['화장실이 어디에 있어요?','¿Dónde está el baño?'],['책이 가방 안에 있어요.','El libro está dentro de la mochila.']]],
      ['N 위/아래/옆/안에','Posición: encima, debajo, al lado, dentro de N.',[['휴대폰이 책 위에 있어요.','El celular está sobre el libro.']]]],
    topics: ['¿Qué hay en tu mochila?','Buscar el baño en una cafetería','Tu pieza'] },
  { id: 3, name: 'Nivel 3 · Acciones de cada día',
    desc: 'El presente cortés (-아요/어요), el objeto y los lugares de las acciones.',
    vocab: [
      ['가다','verbo','ir'],['오다','verbo','venir'],['먹다','verbo','comer'],['마시다','verbo','beber'],['보다','verbo','ver, mirar'],['하다','verbo','hacer'],
      ['공부하다','verbo','estudiar'],['일하다','verbo','trabajar'],['자다','verbo','dormir'],['읽다','verbo','leer'],['듣다','verbo','escuchar (irregular ㄷ)'],
      ['좋아하다','verbo','gustar (algo a alguien)'],['좋다','adjetivo','ser bueno'],['맛있다','adjetivo','ser rico, sabroso'],['많다','adjetivo','ser mucho'],
      ['밥','sustantivo','arroz, comida'],['음악','sustantivo','música'],['영화','sustantivo','película'],['한국어','sustantivo','idioma coreano'],
      ['오늘','sustantivo','hoy'],['지금','sustantivo','ahora'],['매일','adverbio','todos los días'],['같이','adverbio','juntos'],['그리고','adverbio','y, además'],['안','adverbio','no (antes del verbo)']],
    grammar: [
      ['-아요/어요/해요','Presente cortés. Si la última vocal de la raíz es ㅏ u ㅗ: -아요; si no: -어요; 하다 → 해요. Se contraen: 가요, 와요, 봐요, 마셔요.',[['밥을 먹어요.','Como.'],['학교에 가요.','Voy a la escuela.'],['한국어를 공부해요.','Estudio coreano.']]],
      ['N을/를','Partícula de objeto directo. 을 después de consonante, 를 después de vocal.',[['커피를 마셔요.','Tomo café.'],['음악을 들어요.','Escucho música.']]],
      ['N에 가요 / N에서 V','에 = a dónde se va; 에서 = dónde ocurre la acción.',[['카페에 가요.','Voy al café.'],['집에서 자요.','Duermo en casa.']]],
      ['안 + V','Negación simple: «no» antes del verbo (공부 안 해요 con 하다 compuestos).',[['커피를 안 마셔요.','No tomo café.']]]],
    topics: ['Tu rutina diaria','Lo que te gusta comer','Música y películas que te gustan'] },
  { id: 4, name: 'Nivel 4 · El pasado y el tiempo',
    desc: 'Contar lo que hiciste: pasado -았/었어요, horas y días, unir acciones con -고.',
    vocab: [
      ['어제','sustantivo','ayer'],['주말','sustantivo','fin de semana'],['아침','sustantivo','mañana, desayuno'],['점심','sustantivo','mediodía, almuerzo'],['저녁','sustantivo','tarde-noche, cena'],

const RF = ['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
// si la sílaba siguiente empieza con ㅇ, la consonante final se pasa (enlace): [lo que queda, lo que pasa]
const LINK = { 1:['','g'],2:['','kk'],3:['k','s'],4:['','n'],5:['n','j'],6:['n',''],7:['','d'],8:['','r'],9:['l','g'],10:['l','m'],11:['l','b'],12:['l','s'],13:['l','t'],14:['l','p'],15:['l',''],16:['','m'],17:['','b'],18:['p','s'],19:['','s'],20:['','ss'],22:['','j'],23:['','ch'],24:['','k'],25:['','t'],26:['','p'],27:['',''] };

const PARTICLES = ['에서','에게','한테','으로','이랑','하고','까지','부터','처럼','보다','은','는','이','가','을','를','에','도','로','의','랑','와','과','만','요'];

function stemVariants(stem){

  const out = new Set([stem]);

    if (v === 14) add(d.l, 13, 0);                                   // ㅝ → ㅜ (줘 → 주)
    if (v === 6) add(d.l, 20, 0);                                    // ㅕ → ㅣ (마셔 → 마시)
    if (v === 10) add(d.l, 11, 0);                                   // ㅙ → ㅚ (돼 → 되)

  const stems = new Set(), seen = new Set(), queue = [w];

// los errores de la transcripción, explicados
function sttError(res, data, model){
  const m = data.error?.message || '';

    res.status === 401 ? 'la clave de OpenAI no es válida (revísala en ⚙ Ajustes)' :
    res.status === 403 ? 'tu clave de OpenAI no tiene permiso para este modelo' :
    res.status === 404 || /model/i.test(m) && /not.*(found|exist|access)/i.test(m) ? `el modelo ${model} no está disponible para tu cuenta; elige otro en ⚙ Ajustes → Reconocimiento de voz` :
    res.status === 429 ? (/quota|billing|credit/i.test(m) ? 'tu cuenta de OpenAI no tiene saldo' : 'demasiados pedidos seguidos; espera un poco') :

    res.status >= 500 ? 'OpenAI tuvo un problema; prueba de nuevo' :

async function post(url, headers, body, ms){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  let res;
  try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'la IA tardó demasiado' : 'sin conexión'); }
  finally { clearTimeout(timer); }
  return { res, data: await res.json().catch(() => ({})) };
}
// lo mismo, pero leyendo la respuesta a medida que llega (eventos del servidor); onEvent recibe cada evento
async function postStream(url, headers, body, ms, onEvent){
  const ctl = new AbortController(); let timer = setTimeout(() => ctl.abort(), ms);
  let res;
  try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal }); }
  catch (e) { clearTimeout(timer); throw new Error(e.name === 'AbortError' ? 'la IA tardó demasiado' : 'sin conexión'); }
  // (si el servidor contesta sin streaming, se lee como una respuesta normal)

      const { value, done } = await reader.read(); if (done) break;
      clearTimeout(timer); timer = setTimeout(() => ctl.abort(), ms);   // mientras lleguen datos, no se corta
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim(); if (!d || d === '[DONE]') continue;
        let ev; try { ev = JSON.parse(d); } catch (e) { continue; }
        onEvent(ev);
      }
    }
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'la IA tardó demasiado' : (e.message || 'se cortó la conexión')); }

function partialString(raw, key){

  let i = m.index + m[0].length, out = '';
  while (i < raw.length) {
    const c = raw[i];
    if (c === '"') break;
    if (c === '\\') {
      const n = raw[i + 1]; if (n === undefined) break;
      if (n === 'u') { const h = raw.substr(i + 2, 4); if (h.length < 4) break; out += String.fromCharCode(parseInt(h, 16)); i += 6; continue; }
      out += { n: '\n', t: '\t', r: '', b: '', f: '' }[n] ?? n; i += 2; continue;
    }
    out += c; i++;
  }

}

async function ask(model, system, user, schema, { effort = 'low', maxTokens = 8000, ms = 60000, kind = 'chat', fast = false, onText = null } = {}){
  const prov = provOf(model);

  const r = prov === 'openai' ? await openaiAsk(model, system, user, schema, effort, maxTokens, ms, true, onText) : await claudeAsk(model, system, user, schema, effort, maxTokens, ms, fast, true, onText);

// Claude (Messages API). Las instrucciones fijas van en system y se marcan para el caché.
async function claudeAsk(model, system, user, schema, effort, maxTokens, ms, fast = false, fallback = true, onText = null){
  const body = { model, max_tokens: maxTokens, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }], messages: [{ role: 'user', content: user }], output_config: { format: { type: 'json_schema', schema }, effort } };

  if (KEYS.workspace) headers['anthropic-workspace-id'] = KEYS.workspace;

  if (fallback && model !== 'claude-haiku-5-5') { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }

  const { res, data } = await post('https://api.anthropic.com/v1/messages', headers, body, ms);
  if (!res.ok) {

    if (res.status === 400 && fast && /thinking/i.test(data.error?.message || '')) return claudeAsk(model, system, user, schema, effort, maxTokens, ms, false, fallback);
    throw httpError(res, data);
  }
  if (data.stop_reason === 'refusal') throw new Error('el modelo no quiso responder eso');
  if (data.stop_reason === 'max_tokens') throw new Error('la respuesta quedó cortada');
  console.debug('[hablemos]', data.model, data.usage);
  const u = data.usage || {};
  return { out: parseJSON((data.content || []).filter(b => b.type === 'text').map(b => b.text).join('')), served: data.model,
    usage: { in: u.input_tokens || 0, cacheW: u.cache_creation_input_tokens || 0, cacheR: u.cache_read_input_tokens || 0, out: u.output_tokens || 0 } };

// OpenAI (Chat Completions)
// Claude, leyendo la respuesta a medida que llega: onText recibe el texto (JSON parcial) acumulado
async function claudeStream(model, body, headers, ms, fast, fallback, onText, retryNoFallback, retryNoFast){
  body.stream = true;
  let text = '', stop = null, served = model, err = null; const u = {};
  const { res, data, plain } = await postStream('https://api.anthropic.com/v1/messages', headers, body, ms, ev => {

    else if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onText(text); }
    else if (ev.type === 'message_delta') { stop = ev.delta?.stop_reason || stop; if (ev.usage) Object.assign(u, ev.usage); }

  if (!res.ok) {
    if (res.status === 400 && fallback && /fallback/i.test(data.error?.message || '')) return retryNoFallback();
    if (res.status === 400 && fast && /thinking/i.test(data.error?.message || '')) return retryNoFast();
    throw httpError(res, data);

  if (err) throw new Error(err);
  if (stop === 'refusal') throw new Error('el modelo no quiso responder eso');
  if (stop === 'max_tokens') throw new Error('la respuesta quedó cortada');
  console.debug('[hablemos]', served, u);
  return { out: parseJSON(text), served, usage: { in: u.input_tokens || 0, cacheW: u.cache_creation_input_tokens || 0, cacheR: u.cache_read_input_tokens || 0, out: u.output_tokens || 0 } };

async function openaiAsk(model, system, user, schema, effort, maxTokens, ms, strict = true, onText = null){

  if (strict) { body.response_format = { type: 'json_schema', json_schema: { name: 'respuesta', strict: true, schema } }; body.reasoning_effort = effort; }
  else body.response_format = { type: 'json_object' };
  const oh = { 'content-type': 'application/json', authorization: 'Bearer ' + KEYS.openai };
  if (onText) {   // leyendo la respuesta a medida que llega
    body.stream = true; body.stream_options = { include_usage: true };
    let text = '', refusal = '', served = model, uu = {};
    const { res, data } = await postStream('https://api.openai.com/v1/chat/completions', oh, body, ms, ev => {
      served = ev.model || served; if (ev.usage) uu = ev.usage;
      const d = ev.choices?.[0]?.delta || {};
      if (d.refusal) refusal += d.refusal;
      if (d.content) { text += d.content; onText(text); }
    });
    if (!res.ok) { if (res.status === 400 && strict) return openaiAsk(model, system, user, schema, effort, maxTokens, ms, false, onText); throw httpError(res, data); }
    if (refusal) throw new Error('el modelo no quiso responder eso');

    return { out: parseJSON(text), served, usage: { in: (uu.prompt_tokens || 0) - cached, cacheW: 0, cacheR: cached, out: uu.completion_tokens || 0 } };
  }
  const { res, data } = await post('https://api.openai.com/v1/chat/completions', oh, body, ms);

  const msg = data.choices?.[0]?.message || {};

  const u = data.usage || {}, cached = u.prompt_tokens_details?.cached_tokens || 0;

}

/* ---------- gasto estimado ---------- */
// dólares por millón de tokens: [entrada, salida, lectura de caché, escritura de caché]. Precios publicados de Anthropic;
// la escritura de caché se estima en 1,25 veces la entrada. GPT-5.4 mini no tiene precio aquí: se cuentan solo sus tokens.
const PRICES = {
  'claude-haiku-5-5': [0.10, 0.50, 0.01, 0.125],
  'claude-sonnet-5-5': [2, 10, 0.20, 2.5],
  'claude-opus-5-5': [4, 20, 0.20, 5],
  'claude-fable-5-1': [10, 50, 0.25, 12.5]
};
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function recordUsage(kind, model, served, u){
  if (!u) return;
  const pr = PRICES[served] || PRICES[model];
  const day = USAGE[today()] || (USAGE[today()] = {});
  const k = day[kind] || (day[kind] = { n: 0, tin: 0, tout: 0, cost: 0, unpriced: 0 });
  k.n++; k.tin += u.in + u.cacheW + u.cacheR; k.tout += u.out;
  if (pr) k.cost += (u.in * pr[0] + u.out * pr[1] + u.cacheR * pr[2] + u.cacheW * pr[3]) / 1e6;
  else k.unpriced++;
  saveUsage();
}
function usageSum(filter){
  const t = { chat: { n: 0, tin: 0, tout: 0, cost: 0, unpriced: 0 }, explain: { n: 0, tin: 0, tout: 0, cost: 0, unpriced: 0 } };
  for (const [day, v] of Object.entries(USAGE)) if (filter(day)) for (const k of ['chat', 'explain']) if (v[k]) for (const f of Object.keys(t[k])) t[k][f] += v[k][f] || 0;
  return t;
}
const money = c => c === 0 ? '$0' : c < 0.001 ? '< $0,001' : '$' + c.toFixed(c < 0.01 ? 3 : 2).replace('.', ',');
const ktok = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M' : n >= 1000 ? Math.round(n / 1000) + ' mil' : String(n);
function usageHTML(){
  const d = today(), month = d.slice(0, 7);
  const rows = [['Hoy', usageSum(x => x === d)], ['Este mes', usageSum(x => x.startsWith(month))], ['Total', usageSum(() => true)]];
  const cell = k => `${k.n} · ${money(k.cost)}${k.unpriced ? ` <span class="small">(+${k.unpriced} sin precio)</span>` : ''}`;
  return `<div class="conj" style="grid-template-columns:auto 1fr 1fr;gap:6px 14px;font-size:15px">
    <span></span><b class="small">Conversación</b><b class="small">Explicaciones</b>
    ${rows.map(([l, t]) => `<b>${l}</b><span>${cell(t.chat)}</span><span>${cell(t.explain)}</span>`).join('')}</div>
    <div class="small" style="margin-top:6px">Total: ${money(rows[2][1].chat.cost + rows[2][1].explain.cost)} · ${ktok(rows[2][1].chat.tin + rows[2][1].explain.tin)} tokens de entrada y ${ktok(rows[2][1].chat.tout + rows[2][1].explain.tout)} de salida.<br>Es una estimación con los tokens que informa la API y los precios publicados. El cobro real está en console.anthropic.com (o platform.openai.com).</div>`;
}

let busy = false;
const uid = () => Math.random().toString(36).slice(2, 10);
function transcript(){
  const msgs = CONV.msgs.filter(m => m.role === 'me' || m.role === 'ai').slice(-(S.memory || 16));
  return msgs.map(m => (m.role === 'me' ? 'Estudiante: ' : 'Tú (지수): ') + m.ko).join('\n');

function newConversation(levelId, topic){
  if (busy) return;   // (no empezar otra mientras 지수 está respondiendo)
  CONV = { level: levelId, topic: topic || LV(levelId).topics[0], msgs: [] };
  saveConv(); closePanel(); renderAll();
  STARTING = true; aiTurn(null).finally(() => { STARTING = false; });

async function aiTurn(userMsg){
  if (!CONV) return;
  busy = true; renderTyping(true);
  const lv = CONV.level;
  const frequent = frequentErrors();
  const user = profileText() + extText(CONV.level) + (frequent.length ? 'ERRORES FRECUENTES DEL ESTUDIANTE (para practicarlos con naturalidad):\n' + frequent.map(g => `- ${g.category} (${g.items.length} veces). Correcto: «${g.items[g.items.length - 1].right}»`).join('\n') + '\n\n' : '') +
    (CONV.msgs.some(m => m.role === 'me' || m.role === 'ai') ? 'CONVERSACIÓN HASTA AHORA:\n' + transcript() + '\n\n' : '') +
    (userMsg ? 'Responde al último mensaje del estudiante.' : `Empieza tú la conversación. Tema: «${CONV.topic}». Escribe un solo saludo breve (una vez) y después una pregunta sencilla sobre el tema; nada más.`);
  try {
    // 1) lo que dice 지수: un pedido corto, sin razonar, que se va mostrando (y leyendo) a medida que llega
    const m = { id: uid(), role: 'ai', ko: '', es: '', tokens: [], suggestions: [], streaming: true };
    let shown = false, spoken = 0, lastSaid = '', streamedKo = '';
    const say = t => { t = t.trim(); if (!t || t === lastSaid) return; lastSaid = t; speak(t, S.rate, true); };
    const onText = raw => {
      const ko = partialString(raw, 'ko'); if (!ko || ko === m.ko) return;
      m.ko = ko; streamedKo = ko;
      if (!shown) { shown = true; CONV.msgs.push(m); renderTyping(false); renderAll(); scrollEnd(); }
      const el = document.querySelector(`.msg[data-id="${m.id}"] .text`);
      if (el) { el.textContent = ko + ' ▍'; const ch = $('chat'); if (ch.scrollHeight - ch.scrollTop - ch.clientHeight < 120) scrollEnd(); }
      // la voz: cada oración apenas termina
      if (S.autoSpeak) { let end = -1; const re = /[.?!~]+\s/g; let x; while ((x = re.exec(ko))) end = x.index + x[0].length; if (end > spoken) { say(ko.slice(spoken, end)); spoken = end; } }
    };
    let r;
    try { r = await ask(S.chatModel, chatSystem(lv), user, REPLY_SCHEMA, { effort: 'low', maxTokens: 2000, ms: 45000, fast: true, onText }); }
    catch (e) { if (shown) { CONV.msgs = CONV.msgs.filter(x => x !== m); renderAll(); } throw e; }
    m.ko = (r.ko || m.ko).trim(); m.es = (r.es || '').trim(); m.streaming = false;
    if (!shown) CONV.msgs.push(m);
    saveConv();
    busy = false; renderTyping(false); renderAll(); scrollEnd();
    // lo que falte por leer (si el texto final no empieza igual que lo leído, no se vuelve a leer nada)
    if (S.autoSpeak && m.ko.length > spoken && m.ko.startsWith(streamedKo.slice(0, spoken).trim())) say(m.ko.slice(spoken));
    // 2) en segundo plano y en paralelo: las palabras de 지수 y las respuestas sugeridas
    if (S.suggest) fetchSuggestions(m);
    analyzeReply(m, lv);
  } catch (e) {
    busy = false; renderTyping(false);
    if (e instanceof NoKey) { note(`Para conversar falta la clave de ${e.message === 'openai' ? 'OpenAI' : 'Anthropic'}. Ponla en ⚙ Ajustes.`); openSettings(); }
    else if (/workspace/i.test(e.message)) { note('Tu clave de Anthropic no está asignada a un workspace. En ⚙ Ajustes pon el ID del workspace (lo ves en console.anthropic.com → Settings → Workspaces, empieza con «wrkspc_»), o crea una clave dentro de un workspace.', true); openSettings(); }
    else note('No se pudo obtener respuesta: ' + e.message + '.', true);
  } finally { busy = false; }
}
const norm = s => (s || '').replace(/[\s.,!?~]/g, '');
function send(fromSug){
  const text = $('inp').value.trim();
  if (!text || busy) return;
  if (!CONV) { CONV = { level: S.level || 1, topic: LV(S.level || 1).topics[0], msgs: [] }; }
  $('inp').value = ''; autosize();
  // ¿es una respuesta sugerida tal cual (tocada, o puesta con ✏ y enviada sin cambios)?
  const isSug = (fromSug === true && text === SUG_SENT) || (!!SUG_PLACED && text === SUG_PLACED);
  SUG_SENT = SUG_PLACED = '';
  creditHeard();
  // lo que miró antes de responder: las palabras del mensaje de 지수 si vio su traducción, y lo que preguntó con «…뭐예요?»
  const prevAi = CONV.msgs.filter(x => x.role === 'ai').slice(-1)[0];
  if (prevAi?.sawEs) msgLemmas(prevAi).forEach(l => VIEWED.add(l));
  const q0 = detectQuestion(text);
  if (q0) { VIEWED.add(q0); const g = guessLemma(q0); if (g) VIEWED.add(g); }
  const m = { id: uid(), role: 'me', ko: text, tokens: [], fromSug: isSug, viewed: [...VIEWED], esPending: /[A-Za-zÁÉÍÓÚáéíóúÑñÜü]{2,}/.test(text) };
  VIEWED.clear();
  CONV.msgs.push(m); saveConv(); renderAll(); scrollEnd();
  const q = detectQuestion(text);
  if (q) lookup(q, text);
  analyzeStudent(m, CONV.level);   // en paralelo con la respuesta de 지수
  aiTurn(m);
}
function note(text, retry){
  if (!CONV) CONV = { level: S.level || 1, topic: LV(S.level || 1).topics[0], msgs: [] };
  CONV.msgs.push({ id: uid(), role: 'note', text, retry: !!retry }); saveConv(); renderAll(); scrollEnd();
}

/* ---------- avance de cada palabra ----------
   Responder a 지수 sin mirar el significado de una palabra la marca como «ya sé» y la llena de a poco: +10 % cada vez,
   hasta 50 %. Usarla uno mismo (escribiendo o hablando) suma +20 % cada vez, hasta 100 %. */
function wordProgress(lemma){
  const e = DICT[lemma]; if (!e) return 0;
  return Math.min(100, Math.min(50, (e.heard || 0) * 10) + (e.used || 0) * 20);
}
// marcarla a mano como sabida la deja al menos en 50 %
function toggleKnown(e){
  if (e.status === 'conocida') e.status = 'nueva';
  else { e.status = 'conocida'; e.heard = Math.max(e.heard || 0, 5); }
  saveDict();
}
function bump(lemma, field){
  const e = DICT[lemma]; if (!e) return;
  e[field] = (e[field] || 0) + 1;
  if (wordProgress(lemma) >= 100 && !e.mastered) e.mastered = Date.now();
}
const msgLemmas = m => [...new Set((m.tokens || []).filter(t => t.lemma && t.pos !== 'puntuación' && t.pos !== 'partícula').map(t => t.lemma))];
// el estudiante responde al último mensaje de 지수: las palabras que no miró las sabe
function creditHeard(){
  const last = CONV?.msgs.filter(m => m.role === 'ai').slice(-1)[0];
  if (!last || last.credited) return;
  last.credited = true;
  if (last.sawEs) return;                         // vio la traducción de todo el mensaje (o pidió explicarlo)
  const learned = [];
  for (const l of msgLemmas(last)) {
    if ((last.peek || []).includes(l) || !DICT[l]) continue;
    bump(l, 'heard');
    if (DICT[l].status !== 'conocida') { DICT[l].status = 'conocida'; DICT[l].knownAt = Date.now(); learned.push(l); }
  }
  if (learned.length) { last.learnedWords = learned; saveConv(); }
  saveDict();
}
// lo que el estudiante miró mientras prepara su respuesta (se vacía al enviarla): usar esas palabras no suma
const VIEWED = new Set();
function markPeek(msg, lemma){
  if (!lemma) return;
  VIEWED.add(lemma);
  if (msg) { msg.peek = msg.peek || []; if (!msg.peek.includes(lemma)) { msg.peek.push(lemma); saveConv(); } }
}

/* ---------- el diccionario se llena solo ---------- */
// registra las palabras de un mensaje; devuelve los lemas que el estudiante todavía no domina (para resaltarlos)
function learnTokens(tokens, sentence, source){
  const fresh = [];
  for (const t of tokens || []) {
    const lemma = (t.lemma || '').trim();
    if (!lemma || t.pos === 'puntuación' || t.pos === 'partícula' || !/[가-힣]/.test(lemma)) continue;
    if (t.pos === 'nombre propio' && !LEVEL_WORDS[lemma]) continue;   // los nombres de personas no van al diccionario
    let e = DICT[lemma];
    if (!e) {
      const lw = LEVEL_WORDS[lemma];
      e = DICT[lemma] = { lemma, pos: t.pos || lw?.pos || 'otro', gloss: t.gloss || lw?.gloss || '', status: 'nueva', seen: 0, forms: {}, added: Date.now(), source, level: lw?.level || null, detailed: false };
    }
    if (!e.gloss && t.gloss) e.gloss = t.gloss;
    if (t.t && t.t !== lemma) e.forms[t.t] = t.form || e.forms[t.t] || '';
    if (!e.sentence && sentence) e.sentence = sentence;
    e.seen = (e.seen || 0) + 1; e.last = Date.now();
    if (e.status !== 'conocida' && e.seen <= 3 && !fresh.includes(lemma)) fresh.push(lemma);
  }
  return fresh;
}
function mergeEntry(x, surface, form){
  if (!x || !x.lemma) return null;
  const lemma = x.lemma.trim();
  const e = DICT[lemma] || { lemma, status: 'nueva', seen: 0, forms: {}, added: Date.now(), source: 'consulta', level: LEVEL_WORDS[lemma]?.level || null };
  Object.assign(e, { pos: x.pos || e.pos, gloss: x.gloss || e.gloss, meaning: x.meaning, explanation: x.explanation, hanja: x.hanja, irregular: x.irregular,
    conjugations: x.conjugations || [], examples: x.examples || [], detailed: true });
  e.forms = e.forms || {};
  if (surface && surface !== lemma && /[가-힣]/.test(surface)) e.forms[surface] = form || e.forms[surface] || '';
  DICT[lemma] = e;
  return e;
}
async function define(items, model = S.defModel){
  const user = (items[0]?.context ? 'ÚLTIMOS MENSAJES DE LA CONVERSACIÓN:\n' + items[0].context + '\n\n' : '') + 'TÉRMINOS:\n' + items.map((it, i) => `${i + 1}. «${it.term}»` + (it.lemma ? ` (forma de diccionario probable: ${it.lemma})` : '') + (it.sentence ? ` — en la oración: «${it.sentence}»` : '')).join('\n');
  const out = await ask(model, DEF_SYSTEM, user, DEF_SCHEMA, { effort: 'low', maxTokens: 16000, ms: 120000, kind: model === S.defModel ? 'explain' : 'chat' });
  return out.entries || [];
}
const pendingDefs = new Set();
async function defineInBackground(m){
  const lemmas = m.fresh.filter(l => DICT[l] && !DICT[l].detailed && !pendingDefs.has(l)).slice(0, 8);
  if (!lemmas.length) return;
  lemmas.forEach(l => pendingDefs.add(l));
  try {
    const items = lemmas.map(l => { const surface = (m.tokens.find(t => t.lemma === l) || {}).t || l; return { term: surface, lemma: l, sentence: m.ko }; });
    const entries = await define(items);
    entries.forEach((x, i) => { const it = items[i]; const e = mergeEntry(x, it?.term, (m.tokens.find(t => t.t === it?.term) || {}).form); if (e && it && x.lemma !== it.lemma && DICT[it.lemma] && !DICT[it.lemma].detailed) { /* el modelo caro corrigió el lema */ e.seen = Math.max(e.seen || 0, DICT[it.lemma].seen || 0); } });
    saveDict(); refreshSheet();
  } catch (e) { console.warn('definiciones:', e.message); }
  finally { lemmas.forEach(l => pendingDefs.delete(l)); }
}

/* ---------- explicar una frase (modelo caro, solo cuando se pide) ---------- */
async function explainSentence(m){
  m.sawEs = true; msgLemmas(m).forEach(l => VIEWED.add(l));
  m.explBusy = true; m.explErr = ''; renderAll();
  try {
    const x = await ask(S.defModel, SENT_SYSTEM, seenGrammarText() + ctxBlock(m, 'FRASE A EXPLICAR (la dijo ' + (m.role === 'me' ? 'el estudiante' : '지수') + '): «' + m.ko + '»'), SENT_SCHEMA, { effort: 'low', maxTokens: 16000, ms: 150000, kind: 'explain' });
    m.expl = x; m.showExpl = true;
    const before = extGrammarCount(); noteExtGrammar(x.new_grammar); saveExt(); m.explGrammar = extGrammarCount() - before;
    // las palabras explicadas quedan en el diccionario (sin contar como vistas otra vez)
    // cada palabra queda en el diccionario: definición, la forma que tiene aquí y la frase como ejemplo
    let added = 0, updated = 0;
    for (const w of x.words || []) {
      const lemma = (w.lemma || '').trim(); if (!lemma || !/[\uAC00-\uD7A3]/.test(lemma) || w.pos === 'puntuación' || w.pos === 'partícula' || (w.pos === 'nombre propio' && !LEVEL_WORDS[lemma])) continue;
      let e = DICT[lemma];
      if (!e) { e = DICT[lemma] = { lemma, pos: w.pos, gloss: w.gloss, status: 'nueva', seen: 1, forms: {}, added: Date.now(), source: 'explicación', level: LEVEL_WORDS[lemma]?.level || null, detailed: false }; added++; }
      else updated++;
      if (!e.gloss) e.gloss = w.gloss;
      if (!e.pos || e.pos === 'otro') e.pos = w.pos;
      if (!e.meaning && w.meaning) e.meaning = w.meaning;
      e.forms = e.forms || {};
      if (w.t && w.t !== lemma) e.forms[w.t] = e.forms[w.t] || w.explanation;
      e.examples = e.examples || [];
      if (!e.examples.some(ex => ex.ko === m.ko) && e.examples.length < 4) e.examples.push({ ko: m.ko, es: x.translation });
      if (!e.sentence) e.sentence = m.ko;
      e.last = Date.now();
    }
    m.explDict = { added, updated };
    saveDict();
  } catch (e) { m.explErr = e instanceof NoKey ? 'Falta la clave de la API (⚙ Ajustes).' : 'No se pudo explicar: ' + e.message; }
  m.explBusy = false; saveConv(); renderAll();
}

async function analyzeStudent(userMsg, lv){
  const prev = CONV.msgs.filter(x => x.role === 'ai' && CONV.msgs.indexOf(x) < CONV.msgs.indexOf(userMsg)).slice(-1)[0];
  const user = profileText() + (prev ? `ÚLTIMO MENSAJE DE 지수 (al que respondía): «${prev.ko}»\n` : '') + `MENSAJE DEL ESTUDIANTE: «${userMsg.ko}»`;
  try {
    const out = await ask(S.chatModel, studentSystem(lv), user, STUDENT_SCHEMA, { effort: 'low', maxTokens: 6000, ms: 60000, fast: true });
    userMsg.tokens = out.tokens || [];
    userMsg.korean = (out.korean || '').trim(); userMsg.esPending = false;
    userMsg.esWords = (out.es_words || []).filter(w => w && w.es && w.ko);
    // las palabras que dijo en español quedan en el diccionario con su equivalente coreano
    for (const w of userMsg.esWords) {
      const lemma = (w.lemma || w.ko).trim(); if (!/[\uAC00-\uD7A3]/.test(lemma)) continue;
      if (!DICT[lemma]) DICT[lemma] = { lemma, pos: w.pos || 'otro', gloss: w.es, status: 'nueva', seen: 0, forms: {}, added: Date.now(), source: 'en español', level: LEVEL_WORDS[lemma]?.level || null, detailed: false };
      if (w.ko !== lemma) DICT[lemma].forms[w.ko] = DICT[lemma].forms[w.ko] || '';
      if (!DICT[lemma].sentence && userMsg.korean) DICT[lemma].sentence = userMsg.korean;
    }
    userMsg.correction = userMsg.korean ? '' : (out.correction || '').trim();
    userMsg.note = (out.note || '').trim();
    if (userMsg.correction && norm(userMsg.correction) === norm(userMsg.ko)) userMsg.correction = '';
    userMsg.category = userMsg.correction ? (out.category || '').trim() : '';
    if (S.learnProfile) userMsg.learned = learnFacts(out.learned);
    learnTokens(userMsg.tokens, userMsg.ko, 'tú');
    noteExtWords(userMsg.tokens); noteExtGrammar(out.new_grammar);
    // usarla uno mismo (escrita o hablada) en una frase correcta llena la palabra;
    // si la frase tenía errores, o era una respuesta sugerida, no cuenta
    if (!userMsg.fromSug && !userMsg.correction) for (const t of userMsg.tokens) {
      if (!t.lemma || t.pos === 'puntuación' || t.pos === 'partícula' || !DICT[t.lemma]) continue;
      if ((userMsg.viewed || []).includes(t.lemma) || (userMsg.viewed || []).includes(t.t)) continue;   // la miró antes de usarla
      bump(t.lemma, 'used');
    }
    saveExt(); saveDict(); saveConv(); rerenderKeep();
  } catch (e) { console.warn('análisis del estudiante:', e.message); if (userMsg.esPending) { userMsg.esPending = false; saveConv(); rerenderKeep(); } }
}

/* ---------- vocabulario y gramática extendidos de cada nivel ---------- */
const extOf = lvl => EXT[lvl] || (EXT[lvl] = { words: [], grammar: [] });
const hasList = lvl => LV(lvl).vocab.length > 0;
function inBaseVocab(lemma, lvl){ return LEVELS.some(l => l.id <= lvl && l.vocab.some(v => v[0] === lemma)); }
function inExtUpTo(lemma, lvl){ return LEVELS.some(l => l.id <= lvl && (EXT[l.id]?.words || []).includes(lemma)); }
function noteExtWords(tokens){
  const lvl = CONV?.level; if (!lvl || !hasList(lvl)) return;
  for (const t of tokens || []) {
    const lemma = (t.lemma || '').trim();
    if (!lemma || !/[\uAC00-\uD7A3]/.test(lemma) || ['puntuación', 'partícula', 'nombre propio'].includes(t.pos)) continue;
    if (inBaseVocab(lemma, lvl) || inExtUpTo(lemma, lvl)) continue;
    extOf(lvl).words.push(lemma);
  }
}
const normForm = f => (f || '').replace(/[\s~()\-–?.]/g, '');
function noteExtGrammar(list){
  const lvl = CONV?.level; if (!lvl || !hasList(lvl)) return;
  const base = LEVELS.filter(l => l.id <= lvl).flatMap(l => l.grammar.map(g => normForm(g[0])));
  for (const g of list || []) {
    const k = normForm(g.form); if (!k || base.some(b => b.includes(k) || k.includes(b) && b.length > 2)) continue;
    const prev = LEVELS.filter(l => l.id <= lvl).map(l => (EXT[l.id]?.grammar || []).find(x => normForm(x.form) === k)).find(Boolean);
    if (prev) { prev.count = (prev.count || 1) + 1; prev.last = Date.now(); continue; }
    extOf(lvl).grammar.push({ form: g.form.trim(), label: (g.label || '').trim(), example: (g.example || '').trim(), count: 1, date: Date.now() });
  }
}
function extGrammarCount(){ return Object.values(EXT).reduce((a, x) => a + (x.grammar || []).length, 0); }
// la gramática que el estudiante ya tiene (la del nivel y los anteriores, más lo extendido), para que el profesor diga qué es nuevo
function seenGrammarText(){
  const lvl = CONV?.level || S.level || 1; if (!hasList(lvl)) return '';
  const base = LEVELS.filter(l => l.id <= lvl).flatMap(l => l.grammar.map(g => g[0]));
  const ext = LEVELS.filter(l => l.id <= lvl).flatMap(l => (EXT[l.id]?.grammar || []).map(g => g.form));
  return 'GRAMÁTICA YA VISTA POR EL ESTUDIANTE: ' + [...base, ...ext].join(' · ') + '\n\n';
}
function extText(lvl){
  if (!hasList(lvl)) return '';
  const ws = LEVELS.filter(l => l.id <= lvl).flatMap(l => EXT[l.id]?.words || []).slice(-60);
  const gs = LEVELS.filter(l => l.id <= lvl).flatMap(l => EXT[l.id]?.grammar || []).slice(-20);
  if (!ws.length && !gs.length) return '';
  return 'VOCABULARIO Y GRAMÁTICA EXTENDIDOS DEL NIVEL (ya aparecieron en sus conversaciones):\n' +
    (ws.length ? 'Palabras: ' + ws.map(w => DICT[w]?.gloss ? `${w} (${DICT[w].gloss})` : w).join(', ') + '\n' : '') +
    (gs.length ? 'Gramática: ' + gs.map(g => `${g.form} (${g.label})`).join('; ') + '\n' : '') + '\n';
}

/* ---------- perfil del estudiante ---------- */
const normFact = t => (t || '').toLowerCase().replace(/[^a-záéíóúñü0-9\uAC00-\uD7A3 ]/g, '').replace(/\s+/g, ' ').trim();
function learnFacts(list){
  const added = [];
  for (const f of list || []) {
    const text = (f.text || '').trim(); if (!text || text.length > 140) continue;
    if (PROFILE.facts.some(x => normFact(x.text) === normFact(text))) continue;
    PROFILE.facts.push({ id: uid(), kind: f.kind === 'interés' ? 'interés' : 'dato', text, date: Date.now() });
    added.push(text);
  }
  if (added.length) saveProfile();
  return added;
}
function profileText(){
  if (!PROFILE.facts.length) return '';
  const datos = PROFILE.facts.filter(f => f.kind === 'dato').map(f => '- ' + f.text);
  const gustos = PROFILE.facts.filter(f => f.kind === 'interés').map(f => '- ' + f.text);
  return 'PERFIL DEL ESTUDIANTE (lo que sabes de él):\n' + [...datos, ...gustos].join('\n') + '\n\n';
}

function errGroups(list){
  const g = {};
  for (const e of list) (g[e.category] = g[e.category] || { category: e.category, items: [] }).items.push(e);
  return Object.values(g).sort((a, b) => b.items.length - a.items.length || Math.max(...b.items.map(x => x.date)) - Math.max(...a.items.map(x => x.date)));
}
// los tipos de error que se repiten (2 o más veces sin marcar como aprendidos), para que 지수 los haga practicar
const frequentErrors = () => errGroups(ERRS.filter(e => !e.done && e.category !== 'Otros')).filter(g => g.items.length >= 2).slice(0, 3);
async function explainError(er){

/* ---------- «¿qué es…?»: traducción automática ---------- */
const DEMONST = /^(이거|그거|저거|이것|그것|저것|여기|거기|저기|이게|그게|저게|이건|그건|저건|이름|취미|직업)$/;
function stripParticle(w){
  const last = dec(w.slice(-1)), prev = dec(w.slice(-2, -1));
  if (w.length < 2) return w;
  if (/(이|은|을)$/.test(w) && prev && prev.t) return w.slice(0, -1);
  if (/(가|는|를)$/.test(w) && prev && !prev.t) return w.slice(0, -1);
  if (/(이라는|라는|이란|란)$/.test(w)) return w.replace(/(이라는|라는|이란|란)$/, '');
  return w;
}
function detectQuestion(text){
  const t = text.trim();
  // español: «¿qué es X?», «¿qué significa X?», «¿cómo se dice X?»
  let m = t.match(/(?:qu[ée]\s+(?:es|son|significa|quiere decir)|c[óo]mo\s+se\s+dice)\s+["'«“]?([^?"'»”]+?)["'»”]?\s*\??$/i);
  if (m) return m[1].trim();
  // coreano: «X(이/가) 뭐예요?», «X(이/가) 무슨 뜻이에요?», «X는 뭐야?»
  m = t.match(/(?:^|[\s.,!?])([^\s.,!?]+?)\s*(?:뭐예요|뭐에요|뭐야|뭐지요|뭐죠|뭔가요|뭐예용|무엇입니까|무엇이에요|무슨\s*뜻이에요|무슨\s*뜻이야|무슨\s*뜻이에요|무슨\s*뜻입니까|무슨\s*뜻)\s*[?？]?\s*$/);
  if (m) {
    let term = m[1].replace(/^["'«“‘]|["'»”’]$/g, '');
    term = stripParticle(term).replace(/^["'«“‘]|["'»”’]$/g, '');
    if (!term || DEMONST.test(term)) return null;
    if (DICT[term]?.status === 'conocida') return null;
    return term;
  }
  return null;
}
async function lookup(term, sentence){
  const card = { id: uid(), role: 'lookup', term, state: 'busy' };
  const known = DICT[term] || DICT[guessLemma(term) || ''];
  if (known?.detailed) { card.state = 'ok'; card.lemma = known.lemma; CONV.msgs.push(card); saveConv(); renderAll(); scrollEnd(); return; }
  CONV.msgs.push(card); saveConv(); renderAll(); scrollEnd();
  try {
    const [x] = await define([{ term }], S.chatModel);
    const e = mergeEntry(x, /[가-힣]/.test(term) ? term : '', '');
    if (e) { e.source = e.source || 'consulta'; card.lemma = e.lemma; card.state = 'ok'; } else card.state = 'err';
    saveDict();
  } catch (e) { card.state = 'err'; card.err = e instanceof NoKey ? 'falta la clave en ⚙ Ajustes' : e.message; }
  saveConv(); renderAll();
}

}

function renderKo(el, msg){
  const text = msg.ko || '';
  const toks = (msg.tokens || []).filter(t => t.t && t.pos !== 'puntuación');
  let cur = 0;
  const plain = s => {
    // lo que no vino analizado igual se puede tocar, palabra por palabra
    for (const part of s.split(/(\s+)/)) {
      if (!part) continue;
      if (/[가-힣]/.test(part)) { const w = part.replace(/[.,!?~…"'()]+$/g, ''), rest = part.slice(w.length); el.appendChild(wordSpan({ t: w, lemma: '', pos: '', gloss: '', form: '' }, msg)); if (rest) el.appendChild(document.createTextNode(rest)); }
      else el.appendChild(document.createTextNode(part));
    }
  };
  for (const t of toks) {
    const i = text.indexOf(t.t, cur);
    if (i < 0) continue;
    if (i > cur) plain(text.slice(cur, i));
    el.appendChild(wordSpan(t, msg)); cur = i + t.t.length;

}

// si no hay conversación y ya está la clave, 지수 la empieza sola
let STARTING = false;
const hasTalk = () => !!CONV && CONV.msgs.some(m => m.role === 'ai' || m.role === 'me');
function maybeAutoStart(){
  if (busy || STARTING || hasTalk() || !KEYS[provOf(S.chatModel)]) return false;
  newConversation(CONV?.level || S.level || 1, CONV?.topic);
  return true;
}
$('pclose').onclick = () => { const wasSettings = PANEL === 'settings'; closePanel(); if (wasSettings) maybeAutoStart(); };

// un chip de palabra que se llena según el avance
function wordChip(lemma, gloss){
  const pr = wordProgress(lemma);
  return `<button class="chip ko" data-w="${esc(lemma)}" title="${esc(gloss || '')} · ${pr} %" style="background:linear-gradient(90deg,color-mix(in srgb,var(--new) 38%,var(--bg)) ${pr}%,var(--bg) ${pr}%);${pr >= 100 ? 'border-color:var(--new);' : ''}">${esc(lemma)}${pr >= 100 ? ' ✓' : ''}</button>`;
}
function extHTML(lvl){
  const x = EXT[lvl]; if (!x || (!x.words.length && !x.grammar.length)) return '';
  return (x.words.length ? `<div class="sec-t">Vocabulario extendido · apareció en tus conversaciones (${x.words.length})</div><div class="vocab">${x.words.map(w => wordChip(w, DICT[w]?.gloss)).join('')}</div>` : '') +
    (x.grammar.length ? `<div class="sec-t">Gramática extendida · apareció en tus conversaciones (${x.grammar.length})</div>${[...x.grammar].sort((a, b) => (b.count || 1) - (a.count || 1)).map(g => `<div class="gram"><b class="ko">${esc(g.form)}</b> <span class="small">· ${g.count || 1} ${(g.count || 1) === 1 ? 'vez' : 'veces'}</span><div class="small">${esc(g.label)}</div>${g.example ? `<div class="ex"><span class="ko" data-say="${esc(g.example)}" style="cursor:pointer">🔊 ${esc(g.example)}</span></div>` : ''}</div>`).join('')}` : '');
}
function openLevels(){
  openPanel('Niveles', 'levels');
  const cur = CONV?.level || S.level || 1;
  const pb = $('pbody'); pb.innerHTML = '<p class="small">Cada nivel tiene un conjunto de palabras y de formas gramaticales. 지수 conversa usando las de tu nivel y de los anteriores. Cada palabra se va llenando: cada vez que 지수 la usa y respondes sin mirar su significado sube 10 % (hasta la mitad, y queda como «ya sé»); cada vez que la usas tú, sube 20 %, hasta completarse. Toca una palabra para oírla y ver su significado.</p>';
  for (const lv of LEVELS) {
    const d = document.createElement('div'); d.className = 'lv' + (lv.id === cur ? ' cur' : '');
    const known = lv.vocab.filter(v => wordProgress(v[0]) >= 100).length;
    const avg = lv.vocab.length ? Math.round(lv.vocab.reduce((a, v) => a + wordProgress(v[0]), 0) / lv.vocab.length) : 0;
    d.innerHTML = `<h3>${esc(lv.name)}${lv.id === cur ? ' · actual' : ''}</h3><div class="small">${esc(lv.desc)}${lv.vocab.length ? ` · ${known}/${lv.vocab.length} palabras dominadas · ${avg} %` : ''}</div>${lv.vocab.length ? `<div class="bar"><i style="width:${avg}%"></i></div>` : ''}
      ${lv.vocab.length ? `<div class="sec-t">Vocabulario</div><div class="vocab">${lv.vocab.map(v => wordChip(v[0], v[2])).join('')}</div>` : ''}
      ${lv.grammar.length ? `<div class="sec-t">Gramática</div>${lv.grammar.map(g => `<div class="gram"><b class="ko">${esc(g[0])}</b><div class="small">${esc(g[1])}</div>${g[2].map(x => `<div class="ex"><span class="ko" data-say="${esc(x[0])}" style="cursor:pointer">🔊 ${esc(x[0])}</span> <span class="small">${esc(x[1])}</span></div>`).join('')}</div>`).join('')}` : ''}
      ${extHTML(lv.id)}
      <div class="sec-t">Practicar</div><div class="row" style="margin-top:4px">${lv.topics.map(t => `<button class="btn ${lv.id === cur ? '' : 'sec'}" data-topic="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
    d.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const w = LEVEL_WORDS[b.dataset.w] || DICT[b.dataset.w] || { lemma: b.dataset.w }; openWord({ t: w.lemma, lemma: w.lemma, pos: w.pos || '', gloss: w.gloss || '', form: '' }, null); });
    d.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
    d.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { if (CONV?.msgs.length && !confirm('¿Empezar una conversación nueva? (la actual se borra; tu diccionario se mantiene)')) return; S.level = lv.id; saveSet(); newConversation(lv.id, b.dataset.topic); });
    pb.appendChild(d);
  }
}

let DFILTER = 'todas', DQUERY = '', DOPEN = '';
let DTAB = 'palabras', EFILTER = 'pendientes';
function openDict(tab){ if (tab) DTAB = tab; openPanel('Diccionario', 'dict'); drawDict(); }
function tabsHTML(){
  const n = ERRS.filter(e => !e.done).length;
  return `<div class="filters" style="margin-top:0"><button class="chip ${DTAB === 'palabras' ? 'on' : ''}" data-tab="palabras">📖 Palabras (${Object.keys(DICT).length})</button><button class="chip ${DTAB === 'errores' ? 'on' : ''}" data-tab="errores">✍ Mis errores${n ? ` (${n})` : ''}</button></div>`;
}
function bindTabs(pb){ pb.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { DTAB = b.dataset.tab; drawDict(); }); }
function drawErrors(){
  const pb = $('pbody');
  const list = ERRS.filter(e => EFILTER === 'pendientes' ? !e.done : e.done);
  const groups = errGroups(list);
  pb.innerHTML = tabsHTML() + `<div class="filters"><button class="chip ${EFILTER === 'pendientes' ? 'on' : ''}" data-ef="pendientes">Por repasar</button><button class="chip ${EFILTER === 'aprendidos' ? 'on' : ''}" data-ef="aprendidos">Aprendidos</button></div>
    <p class="small">Aquí quedan los errores que pediste explicar con «🎓 Explicar error», agrupados por tipo. Los tipos que se repiten, 지수 los hace practicar en la conversación.</p><div id="elist"></div>`;
  bindTabs(pb);
  pb.querySelectorAll('[data-ef]').forEach(b => b.onclick = () => { EFILTER = b.dataset.ef; drawDict(); });
  const el = pb.querySelector('#elist');
  if (!list.length) el.innerHTML = `<p class="small">${EFILTER === 'pendientes' ? 'No hay errores por repasar. Cuando 지수 corrija algo que escribas, aprieta «🎓 Explicar error» y quedará guardado aquí.' : 'Todavía no marcas errores como aprendidos.'}</p>`;
  for (const g of groups) {
    const box = document.createElement('div'); box.className = 'lv';
    box.innerHTML = `<h3>${esc(g.category)} <span class="small">· ${g.items.length} ${g.items.length === 1 ? 'vez' : 'veces'}</span></h3>`;
    for (const er of [...g.items].reverse()) {
      const it = document.createElement('div'); it.className = 'gram';
      it.innerHTML = `<div class="ko" style="font-size:17px;text-decoration:line-through;color:var(--muted)">${esc(er.wrong)}</div>
        <div class="ko" style="font-size:18px">${esc(er.right)} <button class="spk" data-say="${esc(er.right)}">🔊</button></div>
        ${er.note ? `<div class="small">${esc(er.note)}</div>` : ''}
        <div class="small">${new Date(er.date).toLocaleDateString()}${er.level ? ' · ' + esc(LV(er.level).name) : ''}</div>`;
      if (er.err) { const x = document.createElement('div'); x.className = 'fix'; x.textContent = er.err; it.appendChild(x); }
      if (er.expl) it.appendChild(errExplBlock(er));
      const row = document.createElement('div'); row.className = 'tools';
      const btn = (label, fn) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; b.onclick = fn; row.appendChild(b); return b; };
      if (!er.expl) { const b = btn(ERR_BUSY.has(er.id) ? 'Explicando…' : '🎓 Explicar', () => explainError(er)); b.disabled = ERR_BUSY.has(er.id); }
      btn(er.done ? 'Volver a repasar' : 'Ya lo aprendí ✓', () => { er.done = !er.done; saveErrs(); drawDict(); });
      btn('Borrar', () => { if (confirm('¿Borrar este error?')) { ERRS = ERRS.filter(x => x !== er); saveErrs(); drawDict(); renderAll(); } });
      it.appendChild(row);
      it.querySelectorAll('[data-say]').forEach(x => x.onclick = () => speak(x.dataset.say));
      box.appendChild(it);
    }
    el.appendChild(box);
  }
}
function drawDict(){
  if (DTAB === 'errores') return drawErrors();
  const pb = $('pbody');
  const all = Object.values(DICT);
  const groups = { todas: () => true, verbos: e => e.pos === 'verbo' || e.pos === 'adjetivo', sustantivos: e => e.pos === 'sustantivo', otras: e => !['verbo','adjetivo','sustantivo'].includes(e.pos), nuevas: e => e.status !== 'conocida', conocidas: e => e.status === 'conocida' };
  const q = DQUERY.trim().toLowerCase();
  const list = all.filter(groups[DFILTER]).filter(e => !q || e.lemma.includes(q) || (e.gloss || '').toLowerCase().includes(q) || Object.keys(e.forms || {}).some(f => f.includes(q)))
    .sort((a, b) => (b.last || b.added || 0) - (a.last || a.added || 0));
  pb.innerHTML = tabsHTML() + `<input class="search ko" id="dq" placeholder="Buscar en coreano o en español (también formas conjugadas)…" value="${esc(DQUERY)}">
    <div class="filters">${Object.keys(groups).map(k => `<button class="chip ${k === DFILTER ? 'on' : ''}" data-f="${k}">${{ todas: 'Todas', verbos: 'Verbos y adjetivos', sustantivos: 'Sustantivos', otras: 'Otras', nuevas: 'Por aprender', conocidas: 'Ya sé' }[k]}</button>`).join('')}</div>
    <div class="small" style="margin-bottom:8px">${list.length} de ${all.length} palabras.</div><div id="dlist"></div>
    <div class="row"><button class="btn sec" id="dExport">Exportar (JSON)</button><label class="btn sec" style="cursor:pointer">Importar<input type="file" id="dImport" accept=".json,application/json" hidden></label></div>`;
  bindTabs(pb);
  const dl = pb.querySelector('#dlist');
  if (!all.length) dl.innerHTML = '<p class="small">Todavía está vacío. Las palabras se agregan solas cuando conversas, cuando las tocas y cuando preguntas «…뭐예요?».</p>';
  for (const e of list.slice(0, 400)) {
    const d = document.createElement('div'); d.className = 'ent';
    const nForms = Object.keys(e.forms || {}).length;
    d.innerHTML = `<div class="top"><span class="ko">${esc(e.lemma)}</span><button class="spk" title="Escuchar">🔊</button><span class="g">${e.pos ? `<span class="pos">${esc(e.pos)}</span>` : ''}${esc(e.gloss || '')}${nForms ? ` · ${nForms} forma${nForms > 1 ? 's' : ''}` : ''}</span><span class="st ${e.status === 'conocida' ? 'conocida' : 'nueva'}">${e.status === 'conocida' ? 'ya sé · ' : ''}${wordProgress(e.lemma)} %</span></div><div class="bar"><i style="width:${wordProgress(e.lemma)}%"></i></div>`;
    d.querySelector('.spk').onclick = ev => { ev.stopPropagation(); speak(e.lemma); };
    d.querySelector('.top').onclick = () => { DOPEN = DOPEN === e.lemma ? '' : e.lemma; if (DOPEN) VIEWED.add(e.lemma); drawDict(); };
    if (DOPEN === e.lemma) {
      const body = document.createElement('div');
      body.innerHTML = `<div class="rom">${esc(romanize(e.lemma))}${e.level ? ` · ${esc(LV(e.level).name)}` : ''} · visto ${e.seen || 0} ${e.seen === 1 ? 'vez' : 'veces'}</div>` + entryHTML(e) +
        (!e.detailed ? `<div class="small" style="margin-top:6px">Sin definición completa todavía.</div>` : '') +
        `<div class="row"><button class="btn" data-a="def">${e.detailed ? 'Rehacer definición' : 'Completar con IA'}</button><button class="btn sec" data-a="known">${e.status === 'conocida' ? 'Marcar por aprender' : 'Ya la sé ✓'}</button><button class="btn sec" data-a="del">Borrar</button></div>`;
      body.querySelectorAll('[data-say]').forEach(x => x.onclick = () => speak(x.dataset.say));
      body.querySelector('[data-a=known]').onclick = () => { toggleKnown(e); drawDict(); };
      body.querySelector('[data-a=del]').onclick = () => { if (confirm('¿Borrar ' + e.lemma + ' del diccionario?')) { delete DICT[e.lemma]; saveDict(); drawDict(); } };
      body.querySelector('[data-a=def]').onclick = async ev => {
        ev.target.disabled = true; ev.target.textContent = 'Definiendo…';
        try { const [x] = await define([{ term: e.lemma, lemma: e.lemma, sentence: e.sentence || '' }]); mergeEntry(x); saveDict(); }
        catch (err) { alert('No se pudo: ' + (err instanceof NoKey ? 'falta la clave de la API.' : err.message)); }
        if (PANEL === 'dict') drawDict();
      };
      d.appendChild(body);
    }
    dl.appendChild(d);
  }
  const dq = pb.querySelector('#dq');
  dq.oninput = () => { DQUERY = dq.value; const pos = dq.selectionStart; drawDict(); const n = $('dq'); n.focus(); n.setSelectionRange(pos, pos); };
  pb.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { DFILTER = b.dataset.f; drawDict(); });
  pb.querySelector('#dExport').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(DICT, null, 1)], { type: 'application/json' }));
    a.download = 'diccionario-coreano.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  pb.querySelector('#dImport').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { const o = JSON.parse(await f.text()); let n = 0; for (const [k, v] of Object.entries(o)) if (v && v.lemma) { DICT[k] = Object.assign(DICT[k] || {}, v); n++; } saveDict(); alert(n + ' palabras importadas.'); drawDict(); }
    catch (e) { alert('El archivo no es un diccionario válido.'); }
  };
}

      <div class="small">Más mensajes: 지수 recuerda más de lo que hablaron, pero cada mensaje cuesta un poco más. Lo que cuentas de ti queda igual en tu perfil.</div></div>
    <div class="sec-t">Gasto (estimado)</div>
    <div id="usage">${usageHTML()}</div>
    <div class="row" style="margin-top:6px"><button class="btn sec" id="xUsage">Reiniciar el contador</button></div>

    <div class="field"><label>ID del workspace de Anthropic · solo si la clave no está asignada a un workspace</label><input type="text" id="kW" autocomplete="off" value="${esc(KEYS.workspace)}" placeholder="wrkspc_..."><div class="small">Lo ves en console.anthropic.com → Settings → Workspaces. Si tu clave se creó dentro de un workspace, déjalo vacío.</div></div>

      ${VOICES.length ? '' : '<div class="small">No se encontró una voz coreana instalada. En el celular suele venir; en el computador puedes agregarla en los ajustes de idioma o voz del sistema.</div>'}

  const on = (id, ev, fn) => $(id).addEventListener(ev, fn);
  pb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { PROFILE.facts = PROFILE.facts.filter(f => f.id !== b.dataset.del); saveProfile(); const y = $('pbody').scrollTop; openSettings(); $('pbody').scrollTop = y; });
  const addFact = () => { const t = $('pfText').value.trim(); if (!t) return; learnFacts([{ kind: $('pfKind').value, text: t }]); openSettings(); };
  on('pfAdd', 'click', addFact);
  on('pfText', 'keydown', e => { if (e.key === 'Enter') addFact(); });

  on('sMem', 'change', e => { S.memory = +e.target.value; saveSet(); });
  on('xUsage', 'click', () => { if (confirm('¿Reiniciar el contador de gasto?')) { USAGE = {}; saveUsage(); $('usage').innerHTML = usageHTML(); } });
  on('sChat', 'change', e => { S.chatModel = e.target.value; saveSet(); });
  on('sDef', 'change', e => { S.defModel = e.target.value; saveSet(); });
  on('kA', 'change', e => { KEYS.anthropic = e.target.value.trim(); saveKeys(); });
  on('kW', 'change', e => { KEYS.workspace = e.target.value.trim(); saveKeys(); });
  on('kO', 'change', e => { KEYS.openai = e.target.value.trim(); saveKeys(); });
  on('oGloss', 'change', e => { S.inlineGloss = e.target.checked; saveSet(); renderAll(); });
  on('oDef', 'change', e => { S.autoDefine = e.target.checked; saveSet(); });
  on('oSpeak', 'change', e => { S.autoSpeak = e.target.checked; saveSet(); });
  on('oStt', 'change', e => { const [stt, model] = e.target.value.split(':'); S.stt = stt; if (model) S.sttModel = model; saveSet(); });
  on('oSug', 'change', e => { S.suggest = e.target.checked; saveSet(); const last = CONV?.msgs.filter(m => m.role === 'ai').slice(-1)[0]; if (S.suggest && last && !last.suggestions?.length && !last.sugBusy) fetchSuggestions(last); renderQuick(); });
  on('oRate', 'input', e => { S.rate = +e.target.value; $('rv').textContent = S.rate; saveSet(); });
  on('oVoice', 'change', e => { S.voice = e.target.value; saveSet(); });
  on('oTest', 'click', () => speak('안녕하세요, 만나서 반가워요'));
  on('oTheme', 'change', e => { S.theme = e.target.value; saveSet(); if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; });
  on('xConv', 'click', () => { if (confirm('¿Borrar la conversación?')) { CONV = null; saveConv(); closePanel(); renderAll(); maybeAutoStart(); } });
  on('xExt', 'click', () => { if (confirm('¿Borrar el vocabulario y la gramática extendidos de todos los niveles?')) { EXT = {}; saveExt(); } });
  on('xProf', 'click', () => { if (confirm('¿Borrar todo tu perfil?')) { PROFILE.facts = []; saveProfile(); openSettings(); } });
  on('xErrs', 'click', () => { if (confirm('¿Borrar todos tus errores guardados?')) { ERRS = []; saveErrs(); renderAll(); } });
  on('xDict', 'click', () => { if (confirm('¿Borrar todo el diccionario? No se puede deshacer.')) { DICT = {}; saveDict(); renderAll(); } });
}

/* ---------- frases rápidas y controles ---------- */
const QUICK = [['뭐예요?','¿Qué es?'],['다시 말해 주세요','¿Puedes repetir?'],['천천히 말해 주세요','Más despacio, por favor'],['잘 모르겠어요','No entiendo bien'],['네','Sí'],['아니요','No'],['감사합니다','Gracias']];
let SUG_SENT = '', SUG_PLACED = '';   // la sugerencia tocada, y la puesta en el cuadro con ✏
// arriba del cuadro de texto: las respuestas sugeridas para el último mensaje de 지수, y después las frases fijas
function renderQuick(){
  const q = $('quick'); q.innerHTML = '<div id="sugs"></div><div id="fixed"></div>';
  const sq = $('sugs'), fq = $('fixed');
  // las frases fijas y las sugerencias tienen sentido solo cuando 지수 ya dijo algo
  if (!CONV?.msgs.some(m => m.role === 'ai')) { q.innerHTML = ''; return; }
  const last = CONV?.msgs.filter(m => m.role === 'me' || m.role === 'ai').slice(-1)[0];
  const sugs = S.suggest && !busy && last?.role === 'ai' ? (last.suggestions || []) : [];
  if (S.suggest && !busy && last?.role === 'ai' && last.sugBusy) { const w = document.createElement('span'); w.className = 'small'; w.style.padding = '4px 2px'; w.textContent = 'Pensando respuestas posibles…'; sq.appendChild(w); }
  for (const sg of sugs) {
    // tocarla la dice y la envía (para conversar sin hablar ni escribir); ✏ la deja escrita para cambiarla
    const b = document.createElement('div'); b.className = 'chip sug';
    b.innerHTML = `<button class="pick" title="Responder esto"><span class="ko">${esc(sg.ko)}</span><small hidden>${esc(sg.es)}</small></button><button class="tr" title="Ver la traducción">›</button><button class="ed" title="Escribirla para cambiarla antes de enviar">✏</button>`;
    b.querySelector('.tr').onclick = ev => { const sm = b.querySelector('.pick small'); sm.hidden = !sm.hidden; ev.currentTarget.textContent = sm.hidden ? '›' : '‹'; ev.currentTarget.title = sm.hidden ? 'Ver la traducción' : 'Ocultar la traducción'; };
    b.querySelector('.pick').onclick = () => { if (busy) return; const inp = $('inp'); inp.value = sg.ko; SUG_SENT = sg.ko; autosize(); speak(sg.ko); send(true); };
    b.querySelector('.ed').onclick = () => { speak(sg.ko); const inp = $('inp'); inp.value = sg.ko; SUG_PLACED = sg.ko.trim(); autosize(); inp.focus(); };
    sq.appendChild(b);
  }
  for (const [ko, es] of QUICK) {
    const b = document.createElement('button'); b.className = 'chip ko'; b.textContent = ko; b.title = es;
    b.onclick = () => { const inp = $('inp'); if (ko === '뭐예요?') { inp.value = (inp.value.trim() ? inp.value.trim() + ' ' : '') + '뭐예요?'; inp.focus(); inp.setSelectionRange(0, 0); } else { inp.value = ko; send(); } autosize(); };
    fq.appendChild(b);
  }
}
function autosize(){ const t = $('inp'); t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }
$('inp').addEventListener('input', autosize);
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('send').onclick = send;
function micLangUI(){ const b = $('mlang'); const es = S.micLang === 'es'; b.textContent = es ? 'ES' : '한'; b.classList.toggle('es', es); b.title = es ? 'Vas a hablar en español (toca para cambiar a coreano)' : 'Vas a hablar en coreano (toca para cambiar a español)'; }
$('mlang').onclick = () => { S.micLang = S.micLang === 'es' ? 'ko' : 'es'; saveSet(); micLangUI(); };
micLangUI();
$('mic').addEventListener('pointerdown', micDown);
$('mic').addEventListener('pointermove', micMove);
$('mic').addEventListener('pointerup', e => micUp(e));
$('mic').addEventListener('pointercancel', e => micUp(e, true));
$('mic').addEventListener('contextmenu', e => e.preventDefault());
// con el teclado: mantener Espacio o Enter sobre el botón
$('mic').addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); micDown({ button: 0, pointerId: 0, preventDefault(){} }); } });
$('mic').addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); micUp(e); } });
$('bLevels').onclick = openLevels;
$('bDict').onclick = () => openDict();
$('bSettings').onclick = openSettings;
$('bListen').onclick = () => { LISTEN = !LISTEN; $('bListen').classList.toggle('on', LISTEN); $('bListen').title = LISTEN ? 'Modo escucha activado: toca un mensaje para ver el texto' : 'Modo escucha: ocultar el texto coreano'; renderAll(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (SHEET) closeSheet(); else if (PANEL) closePanel(); } });
if (!SR) $('mic').title = 'Este navegador no reconoce voz (usa Chrome o Safari)';

renderAll(); scrollEnd();
maybeAutoStart();
</script>
